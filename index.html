<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOVENZA — Global Institutional Group</title>
  <meta name="description" content="TOVENZA — Beyond Business. Built to Endure. Global Institutional Group." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --tvz-color-obsidian: #080909;
      --tvz-color-obsidian-deep: #050606;
      --tvz-color-basalt: #202321;
      --tvz-color-basalt-elevated: #282c29;
      --tvz-color-champagne: #B99D6B;
      --tvz-color-champagne-light: #D1B98A;
      --tvz-color-champagne-muted: rgba(185, 157, 107, 0.28);
      --tvz-color-ivory: #E9E4D9;
      --tvz-color-ivory-secondary: #B8B2A6;
      --tvz-color-ivory-muted: #868177;

      --tvz-border-hairline: rgba(233, 228, 217, 0.12);
      --tvz-border-champagne: rgba(185, 157, 107, 0.36);

      --tvz-font-display: 'Cormorant Garamond', Georgia, serif;
      --tvz-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --tvz-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

      --tvz-text-hero: clamp(2.75rem, 6vw, 5.25rem);
      --tvz-text-h1: clamp(2.25rem, 4.5vw, 4rem);
      --tvz-text-h2: clamp(1.75rem, 3vw, 2.75rem);
      --tvz-text-h3: clamp(1.35rem, 2vw, 1.85rem);
      --tvz-text-body: clamp(0.95rem, 1.05vw, 1.0625rem);
      --tvz-text-micro: 0.6875rem;

      --tvz-container-max: 1360px;
      --tvz-gutter-x: clamp(1.25rem, 4vw, 3.5rem);
      --tvz-section-py: clamp(4.5rem, 8vw, 7.5rem);
      --tvz-header-height: 5rem;

      --tvz-ease-architectural: cubic-bezier(0.22, 1, 0.36, 1);
      --tvz-duration-base: 320ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      background-color: var(--tvz-color-obsidian);
      color: var(--tvz-color-ivory);
      font-family: var(--tvz-font-sans);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .tvz-container {
      width: 100%;
      max-width: var(--tvz-container-max);
      margin-inline: auto;
      padding-inline: var(--tvz-gutter-x);
    }

    .tvz-display {
      font-family: var(--tvz-font-display);
      font-weight: 400;
      letter-spacing: -0.015em;
      line-height: 1.05;
    }

    .tvz-mono {
      font-family: var(--tvz-font-mono);
      font-size: var(--tvz-text-micro);
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .tvz-hairline-t {
      border-top: 1px solid var(--tvz-border-hairline);
    }

    .tvz-hairline-b {
      border-bottom: 1px solid var(--tvz-border-hairline);
    }

    .tvz-monolith-card {
      background: linear-gradient(180deg, rgba(32, 35, 33, 0.48) 0%, rgba(8, 9, 9, 0.94) 100%);
      border: 1px solid var(--tvz-border-hairline);
      transition: border-color var(--tvz-duration-base) var(--tvz-ease-architectural),
                  background-color var(--tvz-duration-base) var(--tvz-ease-architectural);
    }

    .tvz-monolith-card:hover {
      border-color: var(--tvz-border-champagne);
    }

    @media (max-width: 1023px) {
      .tvz-desktop-nav { display: none !important; }
    }
    @media (min-width: 1024px) {
      .tvz-mobile-toggle { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { Component, useState, useEffect, useCallback } = React;

    /* ============================================================================
       CENTRALIZED TOVENZA INSTITUTIONAL DATA REGISTRY
       ============================================================================ */
    const INSTITUTION_META = Object.freeze({
      name: 'TOVENZA',
      identity: 'Global Institutional Group',
      statement: 'Beyond Business. Built to Endure.',
      creativeDirection: 'Obsidian Sovereignty',
      currentStage: 'Pre-Operational Institutional Architecture & Pilot Preview',
      governanceDisclosure:
        'TOVENZA presents its Four Foundations and Eleven Strategic Horizons as a long-term institutional architecture. Individual horizons carry explicit lifecycle designations distinguishing research and thesis development from active operations.'
    });

    const FOUR_FOUNDATIONS = Object.freeze([
      {
        id: 'sovereign-identity',
        numeral: 'I',
        path: '/foundations/sovereign-identity',
        title: 'Sovereign Identity',
        subtitle: 'Philosophical Independence & Brand Permanence',
        thesis:
          'Establishes institutional independence, unmistakable aesthetic restraint, and long-horizon ownership principles across every venture.',
        principles: [
          'Uncompromising editorial and architectural coherence',
          'Independence from short-term market noise and opportunistic dilution',
          'Long-term intellectual property and brand equity stewardship'
        ]
      },
      {
        id: 'architectural-authority',
        numeral: 'II',
        path: '/foundations/architectural-authority',
        title: 'Architectural Authority',
        subtitle: 'Governance, Operating Models & Accountability',
        thesis:
          'Codifies clear decision gates, modular organisational structures, and repeatable operating standards before scaling complexity.',
        principles: [
          'Stage-Gate validation prior to capital or operational expansion',
          'Unified digital infrastructure built on reusable architectural templates',
          'Transparent separation between research, development, and live operations'
        ]
      },
      {
        id: 'financial-sophistication',
        numeral: 'III',
        path: '/foundations/financial-sophistication',
        title: 'Financial Sophistication',
        subtitle: 'Capital Discipline & Downside Resilience',
        thesis:
          'Governs capital allocation through explicit stress-testing, liquidity floors, and risk-adjusted unit economics.',
        principles: [
          'Downside protection and cash-runway verification before commitment',
          'Phased capital deployment matched to validated operational maturity',
          'Transparent, inspectable financial modeling free of speculative claims'
        ]
      },
      {
        id: 'global-ecosystem',
        numeral: 'IV',
        path: '/foundations/global-ecosystem',
        title: 'Global Ecosystem',
        subtitle: 'Cross-Border Connectivity & Strategic Alliances',
        thesis:
          'Connects multi-market opportunities, institutional partnerships, and cross-industry capabilities within a disciplined governance perimeter.',
        principles: [
          'Jurisdiction-aware expansion aligned with local regulatory compliance',
          'Interconnected value creation across human capital, technology, and advisory',
          'Enduring institutional partnerships vetted for alignment and rigor'
        ]
      }
    ]);

    const ELEVEN_HORIZONS = Object.freeze([
      {
        index: '01',
        slug: 'human-capital',
        path: '/horizons/human-capital',
        title: 'Recruitment & HR / Human Capital',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['sovereign-identity', 'global-ecosystem'],
        priorityTier: 'Near-Term',
        lifecycleStatus: 'In Development',
        summary: 'Structured compensation benchmarking, offer evaluation architecture, and executive talent intelligence.'
      },
      {
        index: '02',
        slug: 'healthcare-diagnostics',
        path: '/horizons/healthcare-diagnostics',
        title: 'Healthcare & Diagnostics',
        primaryFoundation: 'financial-sophistication',
        secondaryFoundations: ['architectural-authority', 'global-ecosystem'],
        priorityTier: 'Long-Term',
        lifecycleStatus: 'Research',
        summary: 'Long-horizon diagnostic and preventative health infrastructure subject to clinical and regulatory licensing.'
      },
      {
        index: '03',
        slug: 'hospitality',
        path: '/horizons/hospitality',
        title: 'Hospitality',
        primaryFoundation: 'sovereign-identity',
        secondaryFoundations: ['financial-sophistication', 'global-ecosystem'],
        priorityTier: 'Long-Term',
        lifecycleStatus: 'Research',
        summary: 'Architectural hospitality concepts anchored in understated luxury, operational precision, and asset discipline.'
      },
      {
        index: '04',
        slug: 'real-estate-property',
        path: '/horizons/real-estate-property',
        title: 'Real Estate & Property',
        primaryFoundation: 'financial-sophistication',
        secondaryFoundations: ['architectural-authority', 'sovereign-identity'],
        priorityTier: 'Long-Term',
        lifecycleStatus: 'Research',
        summary: 'Long-duration physical asset stewardship and disciplined development underwriting.'
      },
      {
        index: '05',
        slug: 'technology-ai-software',
        path: '/horizons/technology-ai-software',
        title: 'Technology, AI & Software',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['global-ecosystem', 'financial-sophistication'],
        priorityTier: 'Near-Term',
        lifecycleStatus: 'In Development',
        summary: 'Deterministic decision instruments, spatial digital interfaces, and modular institutional software systems.'
      },
      {
        index: '06',
        slug: 'business-consulting',
        path: '/horizons/business-consulting',
        title: 'Business Consulting',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['sovereign-identity', 'financial-sophistication'],
        priorityTier: 'Near-Term',
        lifecycleStatus: 'In Development',
        summary: 'Structured operator clinics, cash-runway diagnostics, and organisational execution frameworks.'
      },
      {
        index: '07',
        slug: 'psychology-wellbeing',
        path: '/horizons/psychology-wellbeing',
        title: 'Psychology & Wellbeing',
        primaryFoundation: 'sovereign-identity',
        secondaryFoundations: ['architectural-authority', 'global-ecosystem'],
        priorityTier: 'Medium-Term',
        lifecycleStatus: 'Strategic Thesis',
        summary: 'Behavioral clarity, cognitive resilience, and non-clinical performance frameworks.'
      },
      {
        index: '08',
        slug: 'astrology-jyotish',
        path: '/horizons/astrology-jyotish',
        title: 'Astrology & Jyotish Sciences',
        primaryFoundation: 'sovereign-identity',
        secondaryFoundations: ['global-ecosystem'],
        priorityTier: 'Medium-Term',
        lifecycleStatus: 'In Development',
        summary: 'Cultural and traditional temporal decision-pacing research framed with explicit non-claim boundaries.'
      },
      {
        index: '09',
        slug: 'education-learning',
        path: '/horizons/education-learning',
        title: 'Education & Learning',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['sovereign-identity', 'global-ecosystem'],
        priorityTier: 'Medium-Term',
        lifecycleStatus: 'Strategic Thesis',
        summary: 'Applied institutional learning systems and structured capability transfer.'
      },
      {
        index: '10',
        slug: 'retail',
        path: '/horizons/retail',
        title: 'Retail',
        primaryFoundation: 'financial-sophistication',
        secondaryFoundations: ['global-ecosystem', 'sovereign-identity'],
        priorityTier: 'Long-Term',
        lifecycleStatus: 'Research',
        summary: 'Curated consumer commerce governed by inventory discipline and brand equity.'
      },
      {
        index: '11',
        slug: 'future-industries',
        path: '/horizons/future-industries',
        title: 'Future Industries',
        primaryFoundation: 'global-ecosystem',
        secondaryFoundations: ['financial-sophistication', 'architectural-authority'],
        priorityTier: 'Long-Term',
        lifecycleStatus: 'Research',
        summary: 'Long-horizon frontier research observatory evaluating emerging industrial shifts.'
      }
    ]);

    const CAPABILITY_SYSTEMS_CHARTER = Object.freeze({
      ratified: false,
      statusLabel: 'Pending Founder Ratification — Six Capability Systems Charter',
      notice:
        'The final names, definitions, and operational scope of the Six Institutional Capability Systems remain under founder review and are intentionally not fabricated.',
      evaluationDimensions: [
        'Institutional Purpose & Cross-Horizon Mandate',
        'Core Operational Functions & Boundaries',
        'Dependencies Across the Four Locked Foundations',
        'Digital Application & Workspace Integration',
        'Governance Controls, Compliance & Audit Trails'
      ]
    });

    const ROUTE_REGISTRY = Object.freeze([
      { index: '01', path: '/', group: 'core', title: 'Homepage', template: 'HomeFlagshipTemplate' },
      { index: '02', path: '/institution', group: 'core', title: 'The Institution', template: 'EditorialEssayTemplate' },
      ...FOUR_FOUNDATIONS.map((f, idx) => ({
        index: String(idx + 3).padStart(2, '0'),
        path: f.path,
        group: 'foundations',
        title: f.title,
        template: 'FoundationDetailTemplate',
        slug: f.id
      })),
      ...ELEVEN_HORIZONS.map((h, idx) => ({
        index: String(idx + 7).padStart(2, '0'),
        path: h.path,
        group: 'horizons',
        title: h.title,
        template: 'HorizonBlueprintTemplate',
        slug: h.slug
      })),
      { index: '18', path: '/capabilities', group: 'control', title: 'Six Capability Systems', template: 'CapabilityFrameworkTemplate' },
      { index: '19', path: '/governance', group: 'control', title: 'Institutional Governance', template: 'GovernanceLedgerTemplate' },
      { index: '20', path: '/gateway', group: 'control', title: 'Institutional Gateway', template: 'GatewayPortalTemplate' },
      { index: '21', path: '/legal', group: 'control', title: 'Legal & Disclosures', template: 'LegalDocumentTemplate' }
    ]);

    /* ============================================================================
       SHARED UI COMPONENTS
       ============================================================================ */
    class InstitutionalErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      render() {
        if (this.state.hasError) {
          return (
            <main className="tvz-container" style={{ paddingBlock: '6rem' }}>
              <div className="tvz-monolith-card" style={{ padding: '2.5rem' }}>
                <p className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>
                  Institutional Fallback Interface
                </p>
                <h1 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', marginTop: '0.75rem' }}>
                  A visual module encountered an interruption.
                </h1>
              </div>
            </main>
          );
        }
        return this.props.children;
      }
    }

    function InstitutionalLink({ to, onNavigate, className = '', style = {}, children, ...rest }) {
      const handleClick = (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        onNavigate(to);
      };
      return (
        <a href={to} onClick={handleClick} className={className} style={style} {...rest}>
          {children}
        </a>
      );
    }

    function LifecycleStatusBadge({ status }) {
      const isDev = status === 'In Development';
      const isThesis = status === 'Strategic Thesis';
      return (
        <span
          className="tvz-mono"
          style={{
            fontSize: '0.58rem',
            padding: '0.26rem 0.6rem',
            border: `1px solid ${isDev ? 'var(--tvz-color-champagne)' : 'var(--tvz-border-hairline)'}`,
            color: isDev
              ? 'var(--tvz-color-champagne-light)'
              : isThesis
              ? 'var(--tvz-color-ivory)'
              : 'var(--tvz-color-ivory-muted)',
            backgroundColor: isDev ? 'rgba(185, 157, 107, 0.08)' : 'transparent',
            whiteSpace: 'nowrap'
          }}
        >
          {status}
        </span>
      );
    }

    function SectionHeaderBlock({ indexLabel, title, subtitle }) {
      return (
        <div style={{ maxWidth: '48rem', marginBottom: '2.5rem' }}>
          <p className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', margin: 0 }}>
            {indexLabel}
          </p>
          <h1 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h1)', margin: '0.6rem 0 0' }}>
            {title}
          </h1>
          {subtitle && (
            <p style={{ fontSize: 'var(--tvz-text-body)', color: 'var(--tvz-color-ivory-secondary)', marginTop: '1.1rem', maxWidth: '62ch' }}>
              {subtitle}
            </p>
          )}
        </div>
      );
    }

    function InstitutionalNoticeBanner() {
      return (
        <div
          className="tvz-monolith-card"
          style={{
            padding: '1.25rem 1.5rem',
            marginTop: '3rem',
            display: 'flex',
            flexWrap: 'wrap',
            justifyContent: 'space-between',
            alignItems: 'center',
            gap: '1rem'
          }}
        >
          <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.6rem' }}>
            Governance Disclosure • Ambition Separated From Verified Operations
          </span>
          <span style={{ fontSize: '0.82rem', color: 'var(--tvz-color-ivory-muted)' }}>
            {INSTITUTION_META.currentStage}
          </span>
        </div>
      );
    }

    /* ============================================================================
       GLOBAL NAVIGATION HEADER
       ============================================================================ */
    function InstitutionalHeader({ currentPath, onNavigate }) {
      const [openMenu, setOpenMenu] = useState(null);
      const [mobileOpen, setMobileOpen] = useState(false);

      const navigateAndClose = (path) => {
        setOpenMenu(null);
        setMobileOpen(false);
        onNavigate(path);
      };

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') {
            setOpenMenu(null);
            setMobileOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      const isFoundationsActive = currentPath.startsWith('/foundations/');
      const isHorizonsActive = currentPath.startsWith('/horizons/');

      return (
        <header
          className="tvz-hairline-b"
          style={{
            position: 'sticky',
            top: 0,
            zIndex: 40,
            backgroundColor: 'rgba(8, 9, 9, 0.92)',
            backdropFilter: 'blur(14px)'
          }}
          onMouseLeave={() => setOpenMenu(null)}
        >
          <div
            className="tvz-container"
            style={{
              height: 'var(--tvz-header-height)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1.5rem'
            }}
          >
            <InstitutionalLink
              to="/"
              onNavigate={navigateAndClose}
              style={{ display: 'flex', alignItems: 'center', gap: '0.85rem', textDecoration: 'none' }}
            >
              <svg width="28" height="34" viewBox="0 0 96 120" fill="none" aria-hidden="true">
                <rect x="12" y="10" width="72" height="100" stroke="#B99D6B" strokeWidth="1.4" />
                <line x1="48" y1="24" x2="48" y2="96" stroke="#B99D6B" strokeWidth="1.6" />
                <line x1="30" y1="36" x2="66" y2="36" stroke="#B99D6B" strokeWidth="1.6" />
                <circle cx="48" cy="60" r="11" stroke="#B99D6B" strokeWidth="1.1" />
              </svg>
              <div>
                <div
                  className="tvz-display"
                  style={{ fontSize: '1.45rem', letterSpacing: '0.22em', color: 'var(--tvz-color-ivory)' }}
                >
                  {INSTITUTION_META.name}
                </div>
                <div className="tvz-mono" style={{ fontSize: '0.55rem', color: 'var(--tvz-color-champagne)' }}>
                  {INSTITUTION_META.identity}
                </div>
              </div>
            </InstitutionalLink>

            <nav aria-label="Global Institutional Navigation" className="tvz-desktop-nav" style={{ display: 'flex', alignItems: 'center', gap: '1.4rem' }}>
              <InstitutionalLink
                to="/institution"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  color: currentPath === '/institution' ? 'var(--tvz-color-champagne)' : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Institution
              </InstitutionalLink>

              <button
                type="button"
                onClick={() => setOpenMenu(openMenu === 'foundations' ? null : 'foundations')}
                onMouseEnter={() => setOpenMenu('foundations')}
                aria-expanded={openMenu === 'foundations'}
                className="tvz-mono"
                style={{
                  background: 'none',
                  border: 'none',
                  padding: 0,
                  cursor: 'pointer',
                  color: isFoundationsActive || openMenu === 'foundations'
                    ? 'var(--tvz-color-champagne)'
                    : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Foundations (04) ▾
              </button>

              <button
                type="button"
                onClick={() => setOpenMenu(openMenu === 'horizons' ? null : 'horizons')}
                onMouseEnter={() => setOpenMenu('horizons')}
                aria-expanded={openMenu === 'horizons'}
                className="tvz-mono"
                style={{
                  background: 'none',
                  border: 'none',
                  padding: 0,
                  cursor: 'pointer',
                  color: isHorizonsActive || openMenu === 'horizons'
                    ? 'var(--tvz-color-champagne)'
                    : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Horizons (11) ▾
              </button>

              <InstitutionalLink
                to="/capabilities"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  color: currentPath === '/capabilities' ? 'var(--tvz-color-champagne)' : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Capabilities
              </InstitutionalLink>

              <InstitutionalLink
                to="/governance"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  color: currentPath === '/governance' ? 'var(--tvz-color-champagne)' : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Governance
              </InstitutionalLink>

              <InstitutionalLink
                to="/gateway"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  padding: '0.55rem 0.95rem',
                  border: '1px solid var(--tvz-border-champagne)',
                  color: currentPath === '/gateway' ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-champagne)',
                  backgroundColor: currentPath === '/gateway' ? 'var(--tvz-color-champagne)' : 'transparent'
                }}
              >
                Gateway
              </InstitutionalLink>
            </nav>

            <button
              type="button"
              className="tvz-mono tvz-mobile-toggle"
              onClick={() => setMobileOpen(!mobileOpen)}
              aria-expanded={mobileOpen}
              style={{
                padding: '0.5rem 0.85rem',
                backgroundColor: 'transparent',
                border: '1px solid var(--tvz-border-hairline)',
                color: 'var(--tvz-color-ivory)',
                cursor: 'pointer'
              }}
            >
              {mobileOpen ? 'Close ✕' : 'Index (21)'}
            </button>
          </div>

          {openMenu === 'foundations' && (
            <div className="tvz-hairline-t" style={{ backgroundColor: 'var(--tvz-color-obsidian-deep)', paddingBlock: '2rem' }}>
              <div className="tvz-container">
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '1.25rem' }}>
                  Four Permanent Institutional Foundations
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '1rem' }}>
                  {FOUR_FOUNDATIONS.map((f) => (
                    <InstitutionalLink
                      key={f.id}
                      to={f.path}
                      onNavigate={navigateAndClose}
                      className="tvz-monolith-card"
                      style={{ padding: '1.35rem', textDecoration: 'none', display: 'block' }}
                    >
                      <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                        Foundation {f.numeral}
                      </div>

              </p>
              <InstitutionalLink to="/capabilities" onNavigate={onNavigate} className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', textDecoration: 'none', fontSize: '0.6rem' }}>

    function CapabilityFrameworkTemplate({ onNavigate }) {
      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>

            indexLabel={`Route 18 • ${CAPABILITY_SYSTEMS_CHARTER.statusLabel}`}
            title="Six Institutional Capability Systems"
            subtitle={CAPABILITY_SYSTEMS_CHARTER.notice}
          />

          <div className="tvz-monolith-card" style={{ padding: '2.25rem', marginBottom: '2rem' }}>
            <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '1rem' }}>

            </div>

                <div key={dim} style={{ padding: '1.25rem', border: '1px solid var(--tvz-border-hairline)' }}>
                  <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>Criterion 0{i + 1}</div>
                  <div style={{ color: 'var(--tvz-color-ivory)', fontSize: '0.92rem', marginTop: '0.4rem' }}>{dim}</div>

                <p style={{ fontSize: '0.82rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>

    function GovernanceLedgerTemplate({ onNavigate }) {
      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Route 19 • Institutional Control"
            title="Governance & Stage-Gate Ledger"
            subtitle="Complete route topology, lifecycle status classifications, and separation between long-horizon research and verified operational reality."
          />

          <div className="tvz-monolith-card" style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '0.85rem' }}>

                        {r.path}

                    </td>
                    <td style={{ padding: '0.85rem 1rem', color: 'var(--tvz-color-ivory)' }}>{r.title}</td>

                ))}

    function GatewayPortalTemplate() {
      const [email, setEmail] = useState('');
      const [track, setTrack] = useState('Institutional Dispatch');
      const [statusMsg, setStatusMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email.trim()) return;
        try {
          window.localStorage.setItem(
            'tovenza_gateway_dispatch_preview',
            JSON.stringify({ email: email.trim(), track, recordedAt: new Date().toISOString() })
          );
        } catch {}
        setStatusMsg(`Recorded locally in preview storage for ${email.trim()} (${track}).`);
        setEmail('');
      };

      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Route 20 • Institutional Gateway"
            title="Dispatches & Level 2 Workspace Preview"
            subtitle="Register an address for institutional architectural notes or preview the upcoming Level 2 Authorized Digital Workspace gateway."
          />

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem' }}>
            <form onSubmit={handleSubmit} className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '1rem' }}>
              <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Institutional Dispatch Registration</div>
              <label style={{ display: 'grid', gap: '0.4rem', fontSize: '0.85rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                <span>Inquiry Track</span>
                <select
                  value={track}
                  onChange={(e) => setTrack(e.target.value)}
                  style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                >
                  <option value="Institutional Dispatch">Institutional Dispatch</option>
                  <option value="Strategic Horizon Dialogue">Strategic Horizon Dialogue</option>
                  <option value="Level 2 Workspace Pilot">Level 2 Workspace Pilot</option>
                </select>
              </label>
              <label style={{ display: 'grid', gap: '0.4rem', fontSize: '0.85rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                <span>Email Address</span>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@institution.org"
                  style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                />
              </label>
              <button
                type="submit"
                className="tvz-mono"
                style={{ padding: '0.85rem 1.25rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
              >
                Record Dispatch Interest
              </button>
              <p style={{ fontSize: '0.78rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>
                Preview Disclosure: Entries are stored locally in browser <code>localStorage</code> until Level 2 backend services are deployed.
              </p>
              {statusMsg && (
                <p role="status" style={{ fontSize: '0.84rem', color: 'var(--tvz-color-champagne-light)', margin: 0 }}>{statusMsg}</p>
              )}
            </form>

            <div className="tvz-monolith-card" style={{ padding: '2rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
              <div>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Ecosystem Progression</div>
                <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', margin: '0.6rem 0 1rem' }}>Level 2 Authorized Digital Workspace</h2>
                <p style={{ fontSize: '0.9rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                  Authenticated member dashboards, saved quantitative decision analyses, and horizon-specific operational instruments are scheduled for Phase 08 following backend security and privacy ratification.
                </p>
              </div>
              <div className="tvz-mono" style={{ color: 'var(--tvz-color-ivory-muted)', fontSize: '0.6rem', marginTop: '1.5rem' }}>
                Current Active Layer: Level 1 Public Institutional Experience
              </div>
            </div>
          </div>
        </div>
      );
    }

      return (

              </div>

              <div>

                <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: '0.5rem', fontSize: '0.84rem' }}>
                  {ELEVEN_HORIZONS.slice(0, 6).map((h) => (
                    <li key={h.slug}>
                      <InstitutionalLink to={h.path} onNavigate={onNavigate} style={{ color: 'var(--tvz-color-ivory-secondary)', textDecoration: 'none' }}>
                        {h.index}. {h.title}

                    </li>

              </div>

              <div>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '0.85rem' }}>Horizons (07–11) &amp; Control</div>
                <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: '0.5rem', fontSize: '0.84rem' }}>
                  {ELEVEN_HORIZONS.slice(6).map((h) => (
                    <li key={h.slug}>
                      <InstitutionalLink to={h.path} onNavigate={onNavigate} style={{ color: 'var(--tvz-color-ivory-secondary)', textDecoration: 'none' }}>
                        {h.index}. {h.title}
                      </InstitutionalLink>
                    </li>
                  ))}
                  <li style={{ paddingTop: '0.4rem' }}>
                    <InstitutionalLink to="/capabilities" onNavigate={onNavigate} style={{ color: 'var(--tvz-color-champagne-light)', textDecoration: 'none' }}>
                      Capabilities • Governance • Gateway • Legal
                    </InstitutionalLink>
                  </li>
                </ul>
              </div>
            </div>

            <div className="tvz-hairline-t" style={{ paddingTop: '1.5rem', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', gap: '1rem', color: 'var(--tvz-color-ivory-muted)' }}>
              <span className="tvz-mono">© {new Date().getFullYear()} TOVENZA. Beyond Business. Built to Endure.</span>
              <span className="tvz-mono">21 Canonical Routes • Milestone 02 (Phase 04)</span>
            </div>
          </div>
        </footer>
      );
    }

    /* ============================================================================
       UNIFIED 21-ROUTE APPLICATION ROOT
       ============================================================================ */
    function normalizePathname(rawPath) {
      if (!rawPath || rawPath === '') return '/';
      return rawPath.replace(/\/+$/, '') || '/';
    }

    function App() {
      const [currentPath, setCurrentPath] = useState(() => normalizePathname(window.location.pathname));

      const navigate = useCallback((to) => {
        const nextPath = normalizePathname(to);
        if (window.location.pathname !== nextPath) {
          try {
            window.history.pushState({}, '', nextPath);
          } catch {}
        }
        setCurrentPath(nextPath);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, []);

      useEffect(() => {
        const handlePopState = () => setCurrentPath(normalizePathname(window.location.pathname));
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const matchedRoute = ROUTE_REGISTRY.find((r) => r.path === currentPath);

      let activeView = null;
      if (!matchedRoute || matchedRoute.path === '/') {
        activeView = <HomeFlagshipTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/institution') {
        activeView = <EditorialEssayTemplate onNavigate={navigate} />;
      } else if (matchedRoute.group === 'foundations') {
        activeView = <FoundationDetailTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.group === 'horizons') {
        activeView = <HorizonBlueprintTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.path === '/capabilities') {
        activeView = <CapabilityFrameworkTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/governance') {
        activeView = <GovernanceLedgerTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/gateway') {
        activeView = <GatewayPortalTemplate />;
      } else if (matchedRoute.path === '/legal') {
        activeView = <LegalDocumentTemplate />;
      }

      return (
        <InstitutionalErrorBoundary>
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', backgroundColor: 'var(--tvz-color-obsidian)', color: 'var(--tvz-color-ivory)' }}>
            <InstitutionalHeader currentPath={matchedRoute ? matchedRoute.path : '/'} onNavigate={navigate} />
            <main style={{ flex: 1 }}>{activeView}</main>
            <InstitutionalFooter onNavigate={navigate} />
          </div>
        </InstitutionalErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
