            level += (tLevel - level) * Math.min(1, 0.05 * dt);
            g.clearRect(0, 0, S, S);
            g.beginPath();
            g.moveTo(-2, surf(-2));

            g.lineTo(S + 2, S + 2);
            g.lineTo(-2, S + 2);

            const A = 0.32 + glow * 0.45;
            const lg = g.createLinearGradient(0, level - 4, 0, S);
            lg.addColorStop(0, 'rgba(70,225,150,' + A + ')');
            lg.addColorStop(0.35, 'rgba(22,150,92,' + A * 0.9 + ')');
            lg.addColorStop(1, 'rgba(4,42,28,' + A * 0.85 + ')');
            g.fillStyle = lg;
            g.fill();
            g.beginPath();
            for (let x = -2; x <= S + 2; x += 2) {
              const y = surf(x);
              x === -2 ? g.moveTo(x, y) : g.lineTo(x, y);
            }
            g.strokeStyle = 'rgba(175,255,215,' + (0.25 + glow * 0.45) + ')';
            g.lineWidth = 1;

              p.x += Math.sin(t * p.sw * 3 + p.ph) * 0.12 * dt;
              if (p.y < surf(p.x) + 1.5) Object.assign(p, np(false));
              const al = p.a * (0.3 + glow * 0.7) * Math.min(1, (S - p.y) / 6);
              g.beginPath();
              g.arc(p.x, p.y, p.r, 0, 6.283);

        /* fingerprint generator: ridge field (loop / whorl / arch) rasterised with domain warping, breaks and pressure falloff */
        function makePrint(fpSeed) {
          const r = mulberry32(fpSeed);
          const W = 110;
          const H = 140;
          const D = 2;
          const c = document.createElement('canvas');
          c.width = W * D;
          c.height = H * D;
          const g = c.getContext('2d');
          const LS = 32;
          const latA = new Float32Array(LS * LS);
          const latB = new Float32Array(LS * LS);
          for (let i = 0; i < LS * LS; i++) {
            latA[i] = r() * 2 - 1;
            latB[i] = r() * 2 - 1;
          }
          function vn(lat, x, y) {
            const xi = Math.floor(x);
            const yi = Math.floor(y);
            const fx = x - xi;
            const fy = y - yi;
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);
            const x0 = ((xi % LS) + LS) % LS;
            const x1 = (x0 + 1) % LS;
            const y0 = ((yi % LS) + LS) % LS;
            const y1 = (y0 + 1) % LS;
            return (
              (lat[y0 * LS + x0] * (1 - sx) + lat[y0 * LS + x1] * sx) * (1 - sy) +
              (lat[y1 * LS + x0] * (1 - sx) + lat[y1 * LS + x1] * sx) * sy
            );
          }
          function fbm(lat, x, y) {
            return (
              vn(lat, x, y) * 0.6 +
              vn(lat, x * 2.1 + 3.7, y * 2.1 + 1.3) * 0.28 +
              vn(lat, x * 4.3 + 9.1, y * 4.3 + 5.2) * 0.12
            );
          }
          const ss = (a, b, x) => {
            const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
            return t * t * (3 - 2 * t);
          };
          const tr = r();
          const type = tr < 0.58 ? 'loop' : tr < 0.85 ? 'whorl' : 'arch';
          const cx = 55;
          const cy = 48;
          const sp = 2.55 + r() * 0.45;
          const wAmp = 3.5 + r() * 3.5;
          const wF = 1 / (34 + r() * 10);
          const tilt = (r() - 0.5) * 0.4;
          const ct = Math.cos(tilt);
          const st = Math.sin(tilt);
          const spiral = r() < 0.5 ? 0 : r() < 0.5 ? 1 : -1;
          const ell = 1.05 + r() * 0.2;
          const archA = 10 + r() * 6;
          const archS = 15 + r() * 8;
          const diverge = 0.002 + r() * 0.003;
          const img = g.createImageData(W * D, H * D);
          const d = img.data;
          for (let py = 0; py < H * D; py++) {
            for (let px = 0; px < W * D; px++) {
              const x = px / D;
              const y = py / D;
              const wx = x + fbm(latA, x * wF, y * wF) * wAmp;
              const wy = y + fbm(latB, x * wF + 5, y * wF + 7) * wAmp;
              const dx = wx - cx;
              const dy = wy - cy;
              const ux = dx * ct - dy * st;
              const uy = dx * st + dy * ct;
              let f;
              if (type === 'loop') {
                f = uy < 0 ? Math.hypot(ux, uy) : Math.abs(ux) / (1 + uy * diverge);
              } else if (type === 'whorl') {
                f = Math.hypot(ux, uy / ell) + (spiral * Math.atan2(uy, ux) * sp) / (2 * Math.PI);
              } else {
                f = uy + archA * Math.exp(-(ux * ux) / (archS * archS));
              }
              const ph = (2 * Math.PI * f) / sp;
              const ridge = ss(-0.12, 0.5, Math.cos(ph));
              const br = fbm(latB, x * 0.11 + 40, y * 0.11 + 40);
              const cut = ss(-0.52, -0.34, br);
              const ex = (x - cx) / 43;
              const ey = (y - cy - 16) / 58;
              const re = Math.hypot(ex, ey);
              const en = fbm(latA, x * 0.05 + 20, y * 0.05 + 20) * 0.16;
              const mask = ss(1.08 + en, 0.78 + en, re);
              const pr = 0.55 + 0.45 * (1 - Math.min(1, re));
              const gr = 0.82 + 0.18 * vn(latA, x * 0.9 + 11, y * 0.9 + 3);
              const a = Math.min(1, ridge * cut * mask * pr * gr + mask * 0.05);
              const o = (py * W * D + px) * 4;
              d[o] = 255;
              d[o + 1] = 255;
              d[o + 2] = 255;
              d[o + 3] = Math.round(a * 255);
            }
          }
          g.putImageData(img, 0, 0);
          return c;
        }

        let seed = 7;
        function addPrint(x, y, rot, hold) {

        function setState() {

        }
        function localPoint(e) {

        btn.addEventListener('pointerleave', onLeave);
        btn.addEventListener('pointerdown', onDown);
        btn.addEventListener('pointerup', onUp);
        btn.addEventListener('pointercancel', onCancel);
        btn.addEventListener('keydown', onKeyDown);
        btn.addEventListener('keyup', onKeyUp);
        btn.addEventListener('contextmenu', onContext);

        return () => {

          cancelAnimationFrame(rafId);
          clearTimeout(sentTimer);
          timers.forEach(clearTimeout);
          btn.removeEventListener('pointerenter', onEnter);
          btn.removeEventListener('pointerleave', onLeave);
          btn.removeEventListener('pointerdown', onDown);
          btn.removeEventListener('pointerup', onUp);
          btn.removeEventListener('pointercancel', onCancel);
          btn.removeEventListener('keydown', onKeyDown);
          btn.removeEventListener('keyup', onKeyUp);
          btn.removeEventListener('contextmenu', onContext);
        };
      }, []);

      return (

    /* ==========================================================================

    function resolveAtmosphereConfig(currentPath) {

      if (matchedHorizon) {
        return {
          mode: matchedHorizon.atmosphereMode,

          horizonIndex: matchedHorizon.index
        };

        };

    function SovereignAtmosphereCanvas({ currentPath, preset }) {

                let highlight = 0;
                if (pActive) {
                  const dist = Math.hypot(px - gx, py - gy);
                  if (dist < 220) {
                    const pull = 1 - dist / 220;
                    highlight = pull;
                    const factor = mode === 'neural-lattice' ? 16 : -10;
                    dx = ((px - gx) / (dist || 1)) * pull * factor;
                    dy = ((py - gy) / (dist || 1)) * pull * factor;
                  }
                }
                const x = gx + dx;
                const y = gy + dy;
                ctx.globalAlpha = 0.16 + highlight * 0.55;
                ctx.beginPath();
                ctx.moveTo(x - 4, y);
                ctx.lineTo(x + 4, y);
                ctx.moveTo(x, y - 4);
                ctx.lineTo(x, y + 4);
                ctx.stroke();
              }
            }
            ctx.globalAlpha = 1;
          } else if (mode === 'vector-compass') {
            const step = 76;
            for (let x = step; x < width; x += step) {
              for (let y = step; y < height; y += step) {
                const angle = pActive ? Math.atan2(py - y, px - x) : Math.sin(x * 0.004 + t) * 0.6;
                ctx.beginPath();
                ctx.moveTo(x - Math.cos(angle) * 9, y - Math.sin(angle) * 9);
                ctx.lineTo(x + Math.cos(angle) * 9, y + Math.sin(angle) * 9);
                ctx.stroke();
              }
            }
          } else if (mode === 'breath-topography') {
            const breath = 0.85 + Math.sin(t * 0.85) * 0.15;
            for (let c = 1; c <= 6; c++) {
              ctx.beginPath();
              for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.12) {
                const wobble = Math.sin(a * 3 + t + c) * 10;
                const r = (minDim * 0.075 * c + wobble) * breath;
                const x = cx + Math.cos(a) * r * 1.3;
                const y = cy + Math.sin(a) * r * 0.82;
                if (a === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.stroke();
            }
          } else if (mode === 'chronos-astrolabe') {
            const outerR = minDim * 0.36;
            const innerR = minDim * 0.22;
            ctx.beginPath();
            ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
            ctx.stroke();

            for (let n = 0; n < 27; n++) {
              const a = t * 0.18 + (n * Math.PI * 2) / 27;
              ctx.beginPath();
              ctx.moveTo(cx + Math.cos(a) * innerR, cy + Math.sin(a) * innerR);
              ctx.lineTo(cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR);
              ctx.stroke();
            }
          } else if (mode === 'fibonacci-stairway') {
            ctx.beginPath();
            for (let i = 0; i < 160; i++) {
              const theta = i * 0.14 + t * 0.4;
              const rad = i * (minDim * 0.0022);
              const x = cx + Math.cos(theta) * rad;
              const y = cy + Math.sin(theta) * rad * 0.78;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.stroke();
          } else if (mode === 'prism-showcase') {
            const boxW = minDim * 0.56;
            const boxH = minDim * 0.36;
            ctx.strokeRect(cx - boxW / 2, cy - boxH / 2, boxW, boxH);
            ctx.strokeRect(cx - boxW * 0.34, cy - boxH * 0.34, boxW * 0.68, boxH * 0.68);
            if (pActive) {
              ctx.beginPath();
              ctx.moveTo(px - 24, py);
              ctx.lineTo(px + 24, py);
              ctx.moveTo(px, py - 24);
              ctx.lineTo(px, py + 24);
              ctx.stroke();
            }
          } else if (mode === 'quantum-horizon') {
            for (let ring = 1; ring <= 5; ring++) {
              ctx.beginPath();
              ctx.ellipse(
                cx,
                cy,
                minDim * 0.09 * ring,
                minDim * 0.042 * ring,
                Math.sin(t * 0.25) * 0.22,
                0,
                Math.PI * 2
              );
              ctx.stroke();
            }
            const sweepAngle = t * 0.85;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(sweepAngle) * minDim * 0.45, cy + Math.sin(sweepAngle) * minDim * 0.22);
            ctx.stroke();
          }

          ctx.restore();
          animId = requestAnimationFrame(draw);
        };

        animId = requestAnimationFrame(draw);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
        };
      }, [config.mode, preset]);

      return (
        <canvas
          ref={canvasRef}
          aria-hidden="true"
          style={{
            position: 'fixed',
            inset: 0,
            width: '100vw',
            height: '100vh',
            pointerEvents: 'none',
            zIndex: 0
          }}
        />
      );
    }

      const isBlobPreview =
        typeof window !== 'undefined' &&
        (window.location.protocol === 'blob:' || window.location.origin === 'null');
      const safeHref = isBlobPreview ? `#${to}` : to;

      const handleClick = (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        onNavigate(to);
      };
      return (
        <a href={safeHref} onClick={handleClick} className={`tvz-focus-ring ${className}`.trim()} style={style} {...rest}>
          {children}
        </a>
      );
    }

    function RealEstatePropertyTemplate() {
      const [encFilter, setEncFilter] = useState('all');
      const [gatewayOpen, setGatewayOpen] = useState(false);
      const [activeTourKey, setActiveTourKey] = useState('lutyens');
      const [activeRoomIdx, setActiveRoomIdx] = useState(0);
      const [autoWalk, setAutoWalk] = useState(true);
      const [walkPct, setWalkPct] = useState(0);
      const [cornerKey, setCornerKey] = useState('sw');
      const [tilt, setTilt] = useState({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });

      const [inqName, setInqName] = useState('');
      const [inqContact, setInqContact] = useState('');
      const [inqEnclave, setInqEnclave] = useState('Lutyens Delhi');
      const [inqStatus, setInqStatus] = useState('');

      const activeTour = HORIZON_04_TOURS[activeTourKey] || HORIZON_04_TOURS.lutyens;
      const activeRoom = activeTour.rooms[activeRoomIdx] || activeTour.rooms[0];

      const openTour = useCallback((key) => {
        setActiveTourKey(HORIZON_04_TOURS[key] ? key : 'lutyens');
        setActiveRoomIdx(0);
        setWalkPct(0);
        setCornerKey('sw');
        setTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
        setAutoWalk(true);
        setGatewayOpen(true);
      }, []);

      const closeTour = useCallback(() => {
        setGatewayOpen(false);
        setWalkPct(0);
        setTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      }, []);

      useEffect(() => {
        if (!gatewayOpen) return undefined;
        const onKey = (e) => {
          if (e.key === 'Escape') closeTour();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [gatewayOpen, closeTour]);

      useEffect(() => {
        if (!gatewayOpen || !autoWalk) return undefined;
        const stopDurationMs = 5200;
        const tickMs = 80;
        let elapsed = 0;

        const timer = setInterval(() => {
          elapsed += tickMs;
          const pct = Math.min((elapsed / stopDurationMs) * 100, 100);
          setWalkPct(pct);
          if (elapsed >= stopDurationMs) {
            elapsed = 0;
            setWalkPct(0);
            setActiveRoomIdx((prev) => (prev + 1) % activeTour.rooms.length);
          }
        }, tickMs);

        return () => clearInterval(timer);
      }, [gatewayOpen, autoWalk, activeTour.rooms.length]);

      const handleRoomMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const rx = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        const ry = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
        const nx = (rx - 0.5) * 2;
        const ny = (ry - 0.5) * 2;
        setTilt({
          rx: Number((-ny * 4.2).toFixed(2)),
          ry: Number((nx * 5.5).toFixed(2)),
          ix: Number((-nx * 20).toFixed(1)),
          iy: Number((-ny * 14).toFixed(1)),
          scale: 1.14
        });
        setCornerKey(ry < 0.5 ? (rx < 0.5 ? 'nw' : 'ne') : rx < 0.5 ? 'sw' : 'se');
      };

      const handleRoomLeave = () => {
        setTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      };

      const handleRoomWheel = (e) => {
        if (Math.abs(e.deltaY) < 18 && Math.abs(e.deltaX) < 18) return;
        const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        const dir = delta > 0 ? 1 : -1;
        setWalkPct(0);
        setActiveRoomIdx((prev) => (prev + dir + activeTour.rooms.length) % activeTour.rooms.length);
      };

      const filteredNcr =
        encFilter === 'all' ? DELHI_NCR_ESTATES : DELHI_NCR_ESTATES.filter((item) => item.enc === encFilter);

      const handleInquiry = (e) => {
        e.preventDefault();
        if (!inqName.trim() || !inqContact.trim()) return;
        setInqStatus(`Thank you, ${inqName.trim()}. Your Horizon 04 inquiry for ${inqEnclave} has been recorded.`);
        setInqName('');
        setInqContact('');
      };

      return (
        <article aria-labelledby="horizon-04-heading">
          <section className="tvz-container" style={{ paddingBlock: 'clamp(3.75rem, 7vw, 6rem)' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center', marginBottom: '1rem' }}>

            </p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem' }}>
              <button

                className="tvz-mono tvz-focus-ring"

              >
                Walk Inside Full House →
              </button>
              <a

                style={{
                  padding: '0.85rem 1.25rem',
                  border: '1px solid var(--tvz-border-champagne)',
                  color: 'var(--tvz-color-ivory)',
                  textDecoration: 'none'
                }}
              >
                Private Inquiry

            </div>

            <div className="tvz-container">
              <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'flex-end', gap: '1rem', marginBottom: '2rem' }}>

                        openTour(item.key);
                      }}
                      className="tvz-mono tvz-focus-ring"
                      style={{
                        padding: '0.7rem 1rem',
                        backgroundColor: 'transparent',
                        border: '1px solid var(--tvz-border-champagne)',
                        color: 'var(--tvz-color-champagne)',
                        cursor: 'pointer',
                        fontSize: '0.58rem',
                        width: '100%'
                      }}
                    >
                      Walk Inside Full House →
                    </button>
                  </div>

              </div>
            </div>
          </section>

          <section id="h4-inquiry" className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
            <div className="tvz-container">
              <form
                onSubmit={handleInquiry}
                className="tvz-monolith-card"
                style={{ padding: '2rem', maxWidth: '44rem', marginInline: 'auto', display: 'grid', gap: '0.9rem' }}
              >
                <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                  Private Viewing &amp; Briefing • Horizon 04
                </span>
                <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: 0 }}>
                  Request a Delhi NCR Residence Dossier
                </h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '0.75rem' }}>
                  <input
                    type="text"
                    required
                    value={inqName}
                    onChange={(e) => setInqName(e.target.value)}
                    placeholder="Full Name"
                    style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                  />
                  <input
                    type="text"
                    required
                    value={inqContact}
                    onChange={(e) => setInqContact(e.target.value)}
                    placeholder="Email or Phone"
                    style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                  />
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '0.75rem' }}>
                  <select
                    value={inqEnclave}
                    onChange={(e) => setInqEnclave(e.target.value)}
                    style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                  >
                    <option value="Lutyens Delhi">Lutyens Delhi</option>
                    <option value="Golf Course Road, Gurugram">Golf Course Road, Gurugram</option>
                    <option value="Sector 44, Noida">Sector 44, Noida</option>
                  </select>
                  <button
                    type="submit"
                    className="tvz-mono tvz-focus-ring"
                    style={{ padding: '0.7rem 1.2rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
                  >
                    Submit Request
                  </button>
                </div>
                {inqStatus && (
                  <p role="status" style={{ margin: 0, fontSize: '0.84rem', color: 'var(--tvz-color-champagne-light)' }}>
                    {inqStatus}
                  </p>
                )}
              </form>
            </div>
          </section>

          {gatewayOpen && (
            <div
              role="dialog"
              aria-modal="true"
              aria-label="Full Interior Residence Walkthrough"
              style={{
                position: 'fixed',
                inset: 0,
                zIndex: 70,
                backgroundColor: 'rgba(5, 6, 6, 0.97)',
                overflowY: 'auto',
                paddingBlock: '2rem'
              }}
            >
              <div className="tvz-container" style={{ display: 'grid', gap: '1.5rem' }}>
                <div className="tvz-hairline-b" style={{ paddingBottom: '1rem', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                  <div>
                    <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>{activeTour.enclave}</div>
                    <h2 className="tvz-display" style={{ fontSize: 'clamp(1.6rem, 3vw, 2.4rem)', margin: '0.25rem 0 0' }}>{activeTour.title}</h2>
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                    <button
                      type="button"
                      onClick={() => setAutoWalk((v) => !v)}
                      className="tvz-mono tvz-focus-ring"
                      style={{ padding: '0.45rem 0.8rem', cursor: 'pointer', fontSize: '0.54rem', border: '1px solid var(--tvz-border-champagne)', backgroundColor: 'transparent', color: 'var(--tvz-color-champagne-light)' }}
                    >
                      Auto-Walk: {autoWalk ? 'On' : 'Off'}
                    </button>
                    <button
                      type="button"
                      onClick={closeTour}
                      className="tvz-mono tvz-focus-ring"
                      style={{ padding: '0.45rem 0.85rem', cursor: 'pointer', fontSize: '0.54rem', border: '1px solid var(--tvz-border-hairline)', backgroundColor: 'transparent', color: 'var(--tvz-color-ivory)' }}
                    >
                      Exit Tour ×
                    </button>
                  </div>
                </div>

                <div className="tvz-monolith-card" style={{ padding: '0.85rem 1.15rem', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '0.75rem' }}>
                  <span className="tvz-mono" style={{ fontSize: '0.54rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    Move cursor across corners to look around or scroll wheel to step through every space
                  </span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', minWidth: '14rem' }}>
                    <span className="tvz-mono" style={{ fontSize: '0.56rem', color: 'var(--tvz-color-champagne)' }}>
                      SPACE {activeRoomIdx + 1} / {activeTour.rooms.length}
                    </span>
                    <div style={{ flex: 1, height: '3px', backgroundColor: 'rgba(233,228,217,0.15)' }}>
                      <div style={{ width: `${walkPct}%`, height: '100%', backgroundColor: 'var(--tvz-color-champagne)', transition: 'width 160ms linear' }} />
                    </div>
                  </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem', alignItems: 'start' }}>
                  <div
                    onMouseMove={handleRoomMove}
                    onMouseLeave={handleRoomLeave}
                    onWheel={handleRoomWheel}
                    style={{
                      position: 'relative',
                      aspectRatio: '16 / 10',
                      overflow: 'hidden',
                      border: '1px solid var(--tvz-border-champagne)',
                      backgroundColor: 'var(--tvz-color-obsidian-deep)',
                      transform: `perspective(1400px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`,
                      transition: 'transform 220ms ease-out'
                    }}
                  >
                    <img
                      src={activeRoom.img}
                      alt={activeRoom.name}
                      style={{
                        width: '100%',
                        height: '100%',
                        objectFit: 'cover',
                        transform: `scale(${tilt.scale}) translate(${tilt.ix}px, ${tilt.iy}px)`,
                        transition: 'transform 320ms ease-out',
                        display: 'block'
                      }}
                    />
                    <div className="tvz-mono" style={{ position: 'absolute', bottom: '0.85rem', left: '1rem', right: '1rem', fontSize: '0.54rem', color: 'var(--tvz-color-ivory)', backgroundColor: 'rgba(8,9,9,0.78)', padding: '0.4rem 0.7rem', display: 'flex', justifyContent: 'space-between', gap: '0.5rem' }}>
                      <span>You are standing in: {activeRoom.name}</span>
                      <span style={{ color: 'var(--tvz-color-champagne-light)' }}>{cornerKey.toUpperCase()}</span>
                    </div>
                  </div>

                  <div className="tvz-monolith-card" style={{ padding: '1.75rem', display: 'grid', gap: '0.85rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', gap: '0.5rem' }}>
                      <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>
                        SPACE 0{activeRoomIdx + 1} • {activeRoom.name.toUpperCase()}
                      </span>
                      <span className="tvz-mono" style={{ fontSize: '0.54rem', color: 'var(--tvz-color-ivory-muted)' }}>
                        {activeRoom.dimensions}
                      </span>
                    </div>
                    <h3 className="tvz-display" style={{ fontSize: '1.85rem', margin: 0 }}>{activeRoom.name}</h3>
                    <p style={{ fontSize: '0.88rem', color: 'var(--tvz-color-ivory-secondary)', margin: 0 }}>{activeRoom.desc}</p>
                    <div style={{ padding: '0.7rem 0.85rem', border: '1px solid var(--tvz-border-champagne)', fontSize: '0.8rem', color: 'var(--tvz-color-champagne-light)' }}>
                      Corner Detail: {activeRoom.corners[cornerKey]}
                    </div>
                    <div style={{ display: 'grid', gap: '0.45rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory)' }}>
                      {activeRoom.specs.map((sp) => (
                        <div key={sp} style={{ padding: '0.55rem 0.75rem', border: '1px solid var(--tvz-border-hairline)' }}>
                          {sp}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </article>
      );
    }

    /* ==========================================================================
       4. SHARED INTERACTIVE WALKTHROUGH BUILDER FOR HORIZONS 01–03 & 05–11
       ========================================================================== */
    function HorizonWalkthroughSuite({
      badgeLabel,
      statusBadge,
      conceptLabel,
      heading,
      lead,
      tracksSectionEyebrow,
      tracksSectionTitle,
      filterOptions,
      tracks,
      photos,
      inquiryEyebrow,
      inquiryTitle,
      inquiryOptions
    }) {
      const [selectedTrack, setSelectedTrack] = useState('all');
      const [walkOpen, setWalkOpen] = useState(false);
      const [activeTrackIdx, setActiveTrackIdx] = useState(0);
      const [activeStageIdx, setActiveStageIdx] = useState(0);
      const [autoWalk, setAutoWalk] = useState(true);
      const [walkProgress, setWalkProgress] = useState(0);
      const [focusedCorner, setFocusedCorner] = useState('sw');
      const [frameTilt, setFrameTilt] = useState({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });

      const [inqName, setInqName] = useState('');
      const [inqContact, setInqContact] = useState('');
      const [inqFocus, setInqFocus] = useState(inquiryOptions[0] || '');
      const [inqConsent, setInqConsent] = useState(false);
      const [inqStatus, setInqStatus] = useState('');

      const visibleTracks =
        selectedTrack === 'all' ? tracks : tracks.filter((t) => t.track === selectedTrack);
      const currentTrack = tracks[activeTrackIdx] || tracks[0];
      const currentStage = currentTrack.stages[activeStageIdx] || currentTrack.stages[0];
      const currentImg = photos[(activeTrackIdx * 3 + activeStageIdx) % photos.length];

      const openWalkthrough = useCallback(
        (trackId) => {
          const idx = Math.max(0, tracks.findIndex((t) => t.id === trackId));
          setActiveTrackIdx(idx);
          setActiveStageIdx(0);
          setWalkProgress(0);
          setFocusedCorner('sw');
          setFrameTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
          setAutoWalk(true);
          setWalkOpen(true);
        },
        [tracks]
      );

      const closeWalkthrough = useCallback(() => {
        setWalkOpen(false);
        setWalkProgress(0);
        setFrameTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      }, []);

      useEffect(() => {
        if (!walkOpen) return undefined;
        const onKey = (e) => {
          if (e.key === 'Escape') closeWalkthrough();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [walkOpen, closeWalkthrough]);

      useEffect(() => {
        if (!walkOpen || !autoWalk) return undefined;
        const stopDurationMs = 5200;
        const tickMs = 80;
        let elapsed = 0;

        const timer = setInterval(() => {
          elapsed += tickMs;
          const pct = Math.min((elapsed / stopDurationMs) * 100, 100);
          setWalkProgress(pct);
          if (elapsed >= stopDurationMs) {
            elapsed = 0;
            setWalkProgress(0);
            setActiveStageIdx((prev) => (prev + 1) % currentTrack.stages.length);
          }
        }, tickMs);

        return () => clearInterval(timer);
      }, [walkOpen, autoWalk, currentTrack.stages.length]);

      const handleStageMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const rx = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        const ry = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
        const nx = (rx - 0.5) * 2;
        const ny = (ry - 0.5) * 2;
        setFrameTilt({
          rx: Number((-ny * 4.2).toFixed(2)),
          ry: Number((nx * 5.5).toFixed(2)),
          ix: Number((-nx * 20).toFixed(1)),
          iy: Number((-ny * 14).toFixed(1)),
          scale: 1.13
        });
        setFocusedCorner(ry < 0.5 ? (rx < 0.5 ? 'nw' : 'ne') : rx < 0.5 ? 'sw' : 'se');
      };

      const handleStageLeave = () => {
        setFrameTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      };

      const handleStageWheel = (e) => {
        if (Math.abs(e.deltaY) < 18 && Math.abs(e.deltaX) < 18) return;
        const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        const dir = delta > 0 ? 1 : -1;
        setWalkProgress(0);
        setActiveStageIdx((prev) => (prev + dir + currentTrack.stages.length) % currentTrack.stages.length);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!inqName.trim() || !inqContact.trim() || !inqConsent) {
          setInqStatus('Please complete your name, contact details, and consent checkbox.');
          return;
        }
        setInqStatus(`Thank you, ${inqName.trim()}. Your request for ${inqFocus} has been recorded with consent.`);
        setInqName('');
        setInqContact('');
        setInqConsent(false);
      };

      return (
        <article>
          <section className="tvz-container" style={{ paddingBlock: 'clamp(3.75rem, 7vw, 6rem)' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center', marginBottom: '1.1rem' }}>
              <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>{badgeLabel}</span>
              <LifecycleStatusBadge status={statusBadge} />
              {conceptLabel && (
                <span className="tvz-mono" style={{ fontSize: '0.56rem', color: 'var(--tvz-color-champagne-light)', padding: '0.24rem 0.55rem', border: '1px solid var(--tvz-border-hairline)' }}>
                  {conceptLabel}
                </span>
              )}
            </div>
            <h1 className="tvz-display" style={{ fontSize: 'var(--tvz-text-hero)', margin: '0 0 0.9rem' }}>{heading}</h1>
            <p style={{ fontSize: 'var(--tvz-text-body)', color: 'var(--tvz-color-ivory-secondary)', maxWidth: '62ch', margin: '0 0 1.65rem' }}>{lead}</p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem' }}>
              <button
                type="button"
                onClick={() => openWalkthrough(tracks[0].id)}
                className="tvz-mono tvz-focus-ring"
                style={{ padding: '0.85rem 1.35rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
              >
                Enter Interactive Walkthrough →
              </button>
              <a
                href="#horizon-briefing-form"
                className="tvz-mono tvz-focus-ring"
                style={{ padding: '0.85rem 1.25rem', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-ivory)', textDecoration: 'none' }}
              >
                Request Briefing
              </a>
            </div>
          </section>

          <section className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
            <div className="tvz-container">
              <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'flex-end', gap: '1rem', marginBottom: '2rem' }}>
                <div>
                  <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>{tracksSectionEyebrow}</span>
                  <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: '0.35rem 0 0' }}>{tracksSectionTitle}</h2>
                </div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.45rem' }}>
                  {filterOptions.map((tab) => {
                    const active = selectedTrack === tab.key;
                    return (
                      <button
                        key={tab.key}
                        type="button"
                        onClick={() => setSelectedTrack(tab.key)}
                        className="tvz-mono tvz-focus-ring"
                        style={{
                          padding: '0.5rem 0.85rem',
                          cursor: 'pointer',
                          fontSize: '0.56rem',
                          border: '1px solid var(--tvz-border-champagne)',
                          backgroundColor: active ? 'var(--tvz-color-champagne)' : 'transparent',
                          color: active ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory-secondary)'
                        }}
                      >
                        {tab.label}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(290px, 1fr))', gap: '1.25rem' }}>
                {visibleTracks.map((trk, idx) => (
                  <div
                    key={trk.id}
                    onClick={() => openWalkthrough(trk.id)}
                    className="tvz-monolith-card"
                    style={{ padding: '1.75rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: '1.25rem', cursor: 'pointer' }}
                  >
                    <div>
                      <img
                        src={photos[idx % photos.length]}
                        alt={trk.title}
                        style={{ width: '100%', height: '12.5rem', objectFit: 'cover', border: '1px solid var(--tvz-border-hairline)', marginBottom: '1.15rem', display: 'block' }}
                      />
                      <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>{trk.badge}</div>
                      <h3 className="tvz-display" style={{ fontSize: '1.5rem', margin: '0.45rem 0 0.5rem' }}>{trk.title}</h3>
                      <p style={{ fontSize: '0.88rem', color: 'var(--tvz-color-ivory-secondary)', margin: 0 }}>{trk.summary}</p>
                    </div>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        openWalkthrough(trk.id);
                      }}
                      className="tvz-mono tvz-focus-ring"
                      style={{ padding: '0.7rem 1rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne)', cursor: 'pointer', fontSize: '0.58rem', width: '100%' }}
                    >
                      Walk Through Pathway →
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section id="horizon-briefing-form" className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
            <div className="tvz-container">
              <form onSubmit={handleSubmit} className="tvz-monolith-card" style={{ padding: '2rem', maxWidth: '42rem', marginInline: 'auto', display: 'grid', gap: '0.9rem' }}>
                <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>{inquiryEyebrow}</span>
                <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: 0 }}>{inquiryTitle}</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '0.75rem' }}>
                  <input
                    type="text"
                    required
                    value={inqName}
                    onChange={(e) => setInqName(e.target.value)}
                    placeholder="Your Name"
                    style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                  />
                  <input
                    type="text"
                    required
                    value={inqContact}
                    onChange={(e) => setInqContact(e.target.value)}
                    placeholder="Email or Phone"
                    style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                  />
                </div>
                <select
                  value={inqFocus}
                  onChange={(e) => setInqFocus(e.target.value)}
                  style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                >
                  {inquiryOptions.map((opt) => (
                    <option key={opt} value={opt}>{opt}</option>
                  ))}
                </select>
                <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.55rem', fontSize: '0.8rem', color: 'var(--tvz-color-ivory-secondary)', cursor: 'pointer' }}>
                  <input type="checkbox" checked={inqConsent} onChange={(e) => setInqConsent(e.target.checked)} style={{ marginTop: '0.2rem' }} />
                  <span>I consent to TOVENZA using these details solely to respond to my request without unconsented third-party sharing.</span>
                </label>
                <button
                  type="submit"
                  className="tvz-mono tvz-focus-ring"
                  style={{ padding: '0.8rem 1.2rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
                >
                  Submit Request
                </button>
                {inqStatus && (
                  <p role="status" style={{ margin: 0, fontSize: '0.84rem', color: 'var(--tvz-color-champagne-light)' }}>{inqStatus}</p>
                )}
              </form>
            </div>
          </section>

          {walkOpen && (
            <div
              role="dialog"
              aria-modal="true"
              aria-label="Interactive Horizon Walkthrough"
              style={{ position: 'fixed', inset: 0, zIndex: 70, backgroundColor: 'rgba(5, 6, 6, 0.97)', overflowY: 'auto', paddingBlock: '2rem' }}
            >
              <div className="tvz-container" style={{ display: 'grid', gap: '1.5rem' }}>
                <div className="tvz-hairline-b" style={{ paddingBottom: '1rem', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                  <div>
                    <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>{currentTrack.badge}</div>
                    <h2 className="tvz-display" style={{ fontSize: 'clamp(1.6rem, 3vw, 2.4rem)', margin: '0.25rem 0 0' }}>{currentTrack.title}</h2>
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                    {tracks.map((t, tIdx) => (
                      <button
                        key={t.id}
                        type="button"
                        onClick={() => {
                          setActiveTrackIdx(tIdx);
                          setActiveStageIdx(0);
                          setWalkProgress(0);
                        }}
                        className="tvz-mono tvz-focus-ring"
                        style={{
                          padding: '0.45rem 0.75rem',
                          cursor: 'pointer',
                          fontSize: '0.54rem',
                          border: '1px solid var(--tvz-border-champagne)',
                          backgroundColor: activeTrackIdx === tIdx ? 'var(--tvz-color-champagne)' : 'transparent',
                          color: activeTrackIdx === tIdx ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory-secondary)'
                        }}
                      >
                        0{tIdx + 1}
                      </button>
                    ))}

              <input type="text" required value={contact} onChange={(e) => setContact(e.target.value)} placeholder="Email or Phone (needed for delivery & follow-up)" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />

                  <option value="Exact">Birth Time: Exact</option>
                  <option value="Approximate">Birth Time: Approximate</option>
                  <option value="Unknown">Birth Time: Unknown</option>

              )}
              <input type="text" required value={birthplace} onChange={(e) => setBirthplace(e.target.value)} placeholder="Birthplace City, State & Country (for coordinates)" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
              <select value={area} onChange={(e) => setArea(e.target.value)} style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>

                <option value="Birth Chart & Nakshatra Overview">Birth Chart &amp; Nakshatra Overview</option>
                <option value="Timing & Reflection Windows">Timing &amp; Reflection Windows</option>
                <option value="Personal & Relationship Context">Personal &amp; Relationship Context</option>
              </select>
              <textarea rows={2} value={context} onChange={(e) => setContext(e.target.value)} placeholder="Optional context or questions (no medical/legal/financial directives)" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
              <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem', fontSize: '0.78rem', color: 'var(--tvz-color-ivory-secondary)', cursor: 'pointer' }}>
                <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} style={{ marginTop: '0.2rem' }} />
                <span>I give explicit consent to process my private birth details solely for preparing my requested Jyotish analysis; birth charts are never published publicly without explicit permission.</span>
              </label>
              <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.8rem 1.2rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}>
                Submit Analysis Request
              </button>
              {formMsg && <p role="status" style={{ margin: 0, fontSize: '0.82rem', color: 'var(--tvz-color-champagne-light)' }}>{formMsg}</p>}
            </form>
          </div>

          <div className="tvz-monolith-card" style={{ padding: '2rem', marginBottom: '2.5rem' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem', marginBottom: '1.25rem' }}>
              <div>
                <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Request Status &amp; Analysis Lookup</span>
                <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', margin: '0.25rem 0 0' }}>Track Request ID</h2>
              </div>
              <input
                type="text"
                value={lookupId}
                onChange={(e) => setLookupId(e.target.value)}
                placeholder="TVZ-JYT-841029"
                style={{ padding: '0.6rem 0.9rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-ivory)', fontFamily: 'var(--tvz-font-mono)', fontSize: '0.78rem' }}
              />
            </div>

            {matchedRecord ? (
              <div style={{ display: 'grid', gap: '0.65rem', fontSize: '0.88rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', gap: '0.5rem' }}>
                  <strong style={{ color: 'var(--tvz-color-ivory)' }}>{matchedRecord.id} — {matchedRecord.name}</strong>
                  <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Status: {matchedRecord.status}</span>
                </div>
                <div>Birth Details: {matchedRecord.dob} • {matchedRecord.birthTime} ({matchedRecord.confidence}) • {matchedRecord.birthplace}</div>
                <div>Methodology: {matchedRecord.report.methodology}</div>
                <div>Chart &amp; Interpretation Scope: {matchedRecord.report.chartSummary}</div>
                <div>Boundaries: {matchedRecord.report.boundaries}</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', marginTop: '0.35rem' }}>
                  <input
                    type="text"
                    value={followUpText}
                    onChange={(e) => setFollowUpText(e.target.value)}
                    placeholder="Ask a scoped follow-up question..."
                    style={{ flex: 1, minWidth: '220px', padding: '0.6rem 0.8rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                  />
                  <button
                    type="button"
                    onClick={() => {
                      if (!followUpText.trim()) return;
                      setRequests((prev) => prev.map((r) => (r.id === matchedRecord.id ? { ...r, followUp: followUpText.trim() } : r)));
                      setFollowUpText('');
                    }}
                    className="tvz-mono tvz-focus-ring"
                    style={{ padding: '0.6rem 1rem', border: '1px solid var(--tvz-border-champagne)', backgroundColor: 'transparent', color: 'var(--tvz-color-champagne)', cursor: 'pointer', fontSize: '0.58rem' }}
                  >
                    Log Follow-Up
                  </button>
                </div>
                {matchedRecord.followUp && (
                  <div style={{ fontSize: '0.82rem', color: 'var(--tvz-color-champagne-light)' }}>Recorded Follow-Up: {matchedRecord.followUp}</div>
                )}
              </div>
            ) : (
              <p style={{ margin: 0, fontSize: '0.86rem', color: 'var(--tvz-color-ivory-muted)' }}>No record matched that Request ID in the current session.</p>
            )}
          </div>

          <div className="tvz-monolith-card" style={{ padding: '2rem' }}>
            <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Internal Delivery Console (Passcode Gated)</span>
            <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', margin: '0.25rem 0 1rem' }}>Jyotish Workflow Queue</h2>

            {!adminUnlocked ? (
              <form onSubmit={unlockConsole} style={{ display: 'flex', flexWrap: 'wrap', gap: '0.65rem', alignItems: 'center' }}>
                <input
                  type="password"
                  value={passcodeInput}
                  onChange={(e) => setPasscodeInput(e.target.value)}
                  placeholder="Enter pilot passcode (TVZ-JYOTISH-2026)"
                  style={{ padding: '0.65rem 0.9rem', minWidth: '260px', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                />
                <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.65rem 1.1rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontSize: '0.6rem' }}>
                  Unlock Console
                </button>
                {passcodeError && <span style={{ fontSize: '0.82rem', color: 'var(--tvz-color-champagne-light)' }}>{passcodeError}</span>}
              </form>
            ) : (
              <div style={{ display: 'grid', gap: '1rem' }}>
                {requests.map((rec) => (
                  <div key={rec.id} style={{ padding: '1.1rem', border: '1px solid var(--tvz-border-hairline)', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                    <div>
                      <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>{rec.id} • {rec.confidence} Birth Time</div>
                      <div style={{ fontSize: '0.95rem', color: 'var(--tvz-color-ivory)', marginTop: '0.2rem' }}>{rec.name} — {rec.birthplace} ({rec.dob})</div>
                    </div>
                    <select
                      value={rec.status}
                      onChange={(e) => updateStatus(rec.id, e.target.value)}
                      aria-label={`Status for ${rec.id}`}
                      style={{ padding: '0.55rem 0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-ivory)', fontSize: '0.82rem' }}
                    >
                      {[
                        'New Request',
                        'Awaiting Information',
                        'Calculation Pending',
                        'Calculation Completed',
                        'Interpretation in Progress',
                        'Quality Review',
                        'Analysis Ready',
                        'Delivered',
                        'Follow-up Requested',
                        'Closed'
                      ].map((st) => (
                        <option key={st} value={st}>{st}</option>
                      ))}
                    </select>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function EducationHorizonTemplate() {
      const [pathways, setPathways] = useState([
        {
          id: 'TVZ-EDU-510294',
          name: 'Niharika Nair',
          email: 'niharika.nair@example.in',
          ageBand: 'Adult (18+)',
          location: 'Bengaluru, India',
          background: '2 years operations coordination',
          area: 'Artificial Intelligence and Productivity',
          goal: 'Build practical AI workflow habits for structured analysis and documentation without relying on unverified prompts.',
          level: 'Foundational / Beginner',
          timePerWeek: '5–7 hours / week',
          format: 'Structured Pathway + Practical Assignments',
          budget: 'Pilot / Free or Scoped Entry',
          status: 'Learning Pathway in Preparation',
          plan: {
            objective: 'Use structured AI workflows responsibly to summarize notes, check logic, and produce verified work artifacts.',
            capability: 'Completed two practical workflow case studies with documented inputs, checks, and limitations.',
            modules: 'Module 1: Problem framing & prompt structure • Module 2: Verification & error checking • Module 3: Real-world work artifact',
            milestones: 'Milestone 1: Baseline workflow audit • Milestone 2: Practical mini-project • Milestone 3: Final review & next step'
          }
        }
      ]);
      const [consoleOpen, setConsoleOpen] = useState(false);
      const [pass, setPass] = useState('');
      const [passMsg, setPassMsg] = useState('');

      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [ageBand, setAgeBand] = useState('Adult (18+)');
      const [guardianConsent, setGuardianConsent] = useState(false);
      const [location, setLocation] = useState('');
      const [background] = useState('');
      const [area, setArea] = useState('Career and Professional Skills');
      const [goal, setGoal] = useState('');
      const [level, setLevel] = useState('Beginner');
      const [timePerWeek, setTimePerWeek] = useState('4–6 hours / week');
      const [format] = useState('Structured Self-Paced + Practical Exercises');
      const [budget] = useState('Exploring / Pilot');
      const [notes, setNotes] = useState('');
      const [consent, setConsent] = useState(false);
      const [msg, setMsg] = useState('');
      const [lookupCode, setLookupCode] = useState('TVZ-EDU-510294');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim() || !email.trim() || !goal.trim() || !consent) {
          setMsg('Please complete Name, Email, Learning Goal, and Privacy Consent.');
          return;
        }
        if (ageBand !== 'Adult (18+)' && !guardianConsent) {
          setMsg('For learners under 18, parent/guardian consent & safeguarding confirmation is required before accepting a request.');
          return;
        }
        const dup = pathways.find(
          (p) => p.email.toLowerCase() === email.trim().toLowerCase() && p.goal.toLowerCase() === goal.trim().toLowerCase()
        );
        if (dup) {
          setMsg(`Duplicate-submission protection: an identical goal is already registered under ${dup.id}.`);
          return;
        }
        const id = `TVZ-EDU-${Math.floor(100000 + Math.random() * 900000)}`;
        const item = {
          id,
          name: name.trim(),
          email: email.trim(),
          ageBand,
          location: location.trim() || 'India',
          background: background.trim() || 'Not specified',
          area,
          goal: goal.trim(),
          level,
          timePerWeek,
          format,
          budget,
          notes: notes.trim(),
          status: 'New Request',
          plan: {
            objective: goal.trim(),
            capability: `Demonstrable practical work in ${area} matched to ${level} starting level.`,
            modules: 'Module 1: Core concepts & gap check • Module 2: Hands-on practice • Module 3: Real-world applied task',
            milestones: 'Milestone 1: Gap check • Milestone 2: First completed exercise • Milestone 3: Progress review'
          }
        };
        setPathways((prev) => [item, ...prev]);
        setLookupCode(id);
        setMsg(`Learning Pathway request submitted. Reference ID: ${id}.`);
        setName('');
        setEmail('');
        setGoal('');
        setNotes('');
        setConsent(false);
        setGuardianConsent(false);
      };

      const found = pathways.find((p) => p.id.trim().toUpperCase() === lookupCode.trim().toUpperCase());

      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Horizon 09 • Education & Learning • Golden-Spiral Mastery Progression"
            title="From Learning to Real Capability."
            subtitle="TOVENZA Learning Pathway turns what you want to learn, your starting level, and your available time into structured practice, real-world assignments, and measurable progress—without unverified job guarantees or fake accreditation claims."
          />

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '0.85rem', marginBottom: '2.5rem' }}>
            {[
              'Career and Professional Skills',
              'Business and Entrepreneurship',
              'Technology and Digital Skills',
              'Artificial Intelligence and Productivity',
              'Communication and Leadership',
              'Financial and Business Literacy',
              'Critical Thinking and Problem Solving',
              'Personal and Professional Development'
            ].map((cat, idx) => (
              <div key={cat} className="tvz-monolith-card" style={{ padding: '1.1rem 1.25rem' }}>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.54rem' }}>AREA 0{idx + 1}</div>
                <div style={{ fontSize: '0.88rem', color: 'var(--tvz-color-ivory)', marginTop: '0.25rem' }}>{cat}</div>
              </div>
            ))}
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem', marginBottom: '2.5rem' }}>
            <form onSubmit={handleSubmit} className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '0.8rem' }}>
              <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>TOVENZA Learning Pathway Request</span>
              <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', margin: 0 }}>Request a Structured Pathway</h2>
              <input type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder="Your Name" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
              <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email Address" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '0.65rem' }}>
                <select value={ageBand} onChange={(e) => setAgeBand(e.target.value)} aria-label="Age Eligibility Band" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                  <option value="Adult (18+)">Adult (18+)</option>
                  <option value="Under 18 (Minor — Guardian Required)">Under 18 (Guardian Required)</option>
                </select>
                <input type="text" value={location} onChange={(e) => setLocation(e.target.value)} placeholder="City & Country" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
              </div>
              {ageBand !== 'Adult (18+)' && (
                <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem', fontSize: '0.78rem', color: 'var(--tvz-color-champagne-light)', padding: '0.65rem', border: '1px solid var(--tvz-border-champagne)', cursor: 'pointer' }}>
                  <input type="checkbox" checked={guardianConsent} onChange={(e) => setGuardianConsent(e.target.checked)} style={{ marginTop: '0.2rem' }} />
                  <span>Safeguarding Notice: I confirm a parent/legal guardian has reviewed and consented to this under-18 learning request and privacy terms.</span>
                </label>
              )}
              <select value={area} onChange={(e) => setArea(e.target.value)} style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                {[
                  'Career and Professional Skills',
                  'Business and Entrepreneurship',
                  'Technology and Digital Skills',
                  'Artificial Intelligence and Productivity',
                  'Communication and Leadership',
                  'Financial and Business Literacy',
                  'Critical Thinking and Problem Solving',
                  'Personal and Professional Development'
                ].map((a) => (
                  <option key={a} value={a}>{a}</option>
                ))}
              </select>
              <textarea rows={2} required value={goal} onChange={(e) => setGoal(e.target.value)} placeholder="What do you want to achieve, why now, and what is your current knowledge level?" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '0.65rem' }}>
                <select value={level} onChange={(e) => setLevel(e.target.value)} style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                  <option value="Beginner">Beginner</option>
                  <option value="Foundational / Beginner">Foundational / Beginner</option>
                  <option value="Intermediate">Intermediate</option>
                  <option value="Transitioning / Upskilling">Transitioning / Upskilling</option>
                </select>
                <input type="text" value={timePerWeek} onChange={(e) => setTimePerWeek(e.target.value)} placeholder="Available time (e.g. 5 hrs/wk)" style={{ padding: '0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
              </div>
              <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem', fontSize: '0.78rem', color: 'var(--tvz-color-ivory-secondary)', cursor: 'pointer' }}>
                <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} style={{ marginTop: '0.2rem' }} />
                <span>I consent to TOVENZA processing my learning pathway request under the learner privacy notice.</span>
              </label>
              <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.8rem 1.2rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}>
                Submit Pathway Request
              </button>
              {msg && <p role="status" style={{ margin: 0, fontSize: '0.82rem', color: 'var(--tvz-color-champagne-light)' }}>{msg}</p>}
            </form>

            <div style={{ display: 'grid', gap: '1.5rem', alignContent: 'start' }}>
              <div className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '0.7rem' }}>
                <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '0.5rem' }}>
                  <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Pathway Lookup</span>
                  <input
                    type="text"
                    value={lookupCode}
                    onChange={(e) => setLookupCode(e.target.value)}
                    style={{ padding: '0.45rem 0.7rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-ivory)', fontFamily: 'var(--tvz-font-mono)', fontSize: '0.75rem' }}
                  />
                </div>
                {found ? (
                  <div style={{ fontSize: '0.86rem', color: 'var(--tvz-color-ivory-secondary)', display: 'grid', gap: '0.45rem' }}>
                    <strong style={{ color: 'var(--tvz-color-ivory)' }}>{found.id} — {found.name} ({found.status})</strong>
                    <div>Area: {found.area} • Pace: {found.timePerWeek}</div>
                    <div>Objective: {found.plan.objective}</div>
                    <div>Target Capability: {found.plan.capability}</div>
                    <div>Structure: {found.plan.modules}</div>
                    <div>Milestones: {found.plan.milestones}</div>
                  </div>

                  <p style={{ margin: 0, fontSize: '0.84rem', color: 'var(--tvz-color-ivory-muted)' }}>No pathway matched that ID.</p>
                )}
              </div>

              <div className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '0.75rem' }}>
                <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Internal Operations Console</span>
                {!consoleOpen ? (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (pass.trim() === 'TVZ-EDU-2026') {
                        setConsoleOpen(true);
                        setPassMsg('');
                      } else {
                        setPassMsg('Use pilot passcode TVZ-EDU-2026 to inspect queue.');
                      }
                    }}
                    style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}
                  >
                    <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="Passcode (TVZ-EDU-2026)" style={{ padding: '0.6rem 0.8rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                    <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.6rem 1rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontSize: '0.58rem' }}>
                      Unlock
                    </button>
                    {passMsg && <span style={{ width: '100%', fontSize: '0.8rem', color: 'var(--tvz-color-champagne-light)' }}>{passMsg}</span>}
                  </form>

    function HomeFlagshipTemplate({ onNavigate }) {
      const [allowMotion, setAllowMotion] = useState(() => {
        if (typeof window === 'undefined') return true;
        const reduced =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const saveData =
          typeof navigator !== 'undefined' &&
          navigator.connection &&
          Boolean(navigator.connection.saveData);
        return !reduced && !saveData;
      });

      useEffect(() => {
        if (typeof window === 'undefined' || !window.matchMedia) return undefined;
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        const onChange = () => setAllowMotion(!mq.matches);
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
        return () => {
          if (mq.removeEventListener) mq.removeEventListener('change', onChange);
          else if (mq.removeListener) mq.removeListener(onChange);
        };
      }, []);

      const naturePosterUrl =
        'https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&q=80';
      const natureVideoUrl =
        'https://assets.mixkit.co/videos/preview/mixkit-sunlight-through-the-trees-in-a-forest-32820-large.mp4';

      return (
        <section
          aria-label="TOVENZA Entrance"
          style={{
            position: 'relative',
            width: '100%',
            minHeight: '100dvh',
            overflow: 'hidden',
            display: 'grid',
            placeItems: 'center',
            backgroundColor: '#0c0e0c'
          }}

          {/* Scoped Living Nature Background (Poster + Muted Looping Video when Motion Allowed) */}
          <div
            aria-hidden="true"
            style={{
              position: 'absolute',
              inset: 0,
              zIndex: 0,
              backgroundImage: `url("${naturePosterUrl}")`,
              backgroundSize: 'cover',
              backgroundPosition: 'center center'

          >
            {allowMotion && (
              <video
                autoPlay

                muted
                playsInline
                preload="metadata"
                poster={naturePosterUrl}
                style={{
                  width: '100%',
                  height: '100%',
                  objectFit: 'cover',
                  display: 'block'
                }}
              >
                <source src={natureVideoUrl} type="video/mp4" />
              </video>
            )}
            {/* Restrained atmospheric depth veil for legibility and contrast */}
            <div
              style={{
                position: 'absolute',
                inset: 0,
                background:
                  'radial-gradient(circle at 50% 50%, rgba(8, 9, 9, 0.34) 0%, rgba(8, 9, 9, 0.72) 100%)'
              }}
            />
          </div>

          {/* Top-Right — Sign In */}
          <div
            style={{
              position: 'fixed',
              top: 'clamp(1.25rem, 3vw, 2.25rem)',
              right: 'clamp(1.25rem, 4vw, 3rem)',
              zIndex: 10
            }}
          >
            <InstitutionalLink
              to="/gateway"
              onNavigate={onNavigate}

              style={{
                display: 'inline-flex',
                alignItems: 'center',
                justifyContent: 'center',
                padding: '0.68rem 1.35rem',
                fontSize: '0.68rem',
                letterSpacing: '0.24em',
                color: '#FFFCFA',
                backgroundColor: 'rgba(8, 9, 9, 0.56)',
                border: '1px solid rgba(255, 252, 250, 0.28)',
                backdropFilter: 'blur(12px)',
                WebkitBackdropFilter: 'blur(12px)',
                textDecoration: 'none',
                transition: 'border-color 280ms ease, background-color 280ms ease'
              }}
            >

          {/* Centre — Explore */}

              padding: '1rem'
            }}

            <InstitutionalLink
              to="/institution"
