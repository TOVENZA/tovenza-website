    function InstitutionalLink({ to, onNavigate, className = '', style = {}, children, ...rest }) {
      const isBlobPreview =
        window.location.protocol === 'blob:' || window.location.origin === 'null';
      const safeHref = isBlobPreview ? `#${to}` : to;

      const handleClick = (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        onNavigate(to);
      };
      return (
        <a href={safeHref} onClick={handleClick} className={`tvz-focus-ring ${className}`.trim()} style={style} {...rest}>
          {children}
        </a>
      );
    }

            <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '1rem' }}>All Eleven Strategic Horizons</div>

    function CapabilityFrameworkTemplate({ onNavigate }) {
      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel={`Route 18 • ${CAPABILITY_SYSTEMS_CHARTER.statusLabel}`}
            title="Six Institutional Capability Systems"
            subtitle={CAPABILITY_SYSTEMS_CHARTER.notice}
          />

          <div className="tvz-monolith-card" style={{ padding: '2.25rem', marginBottom: '2rem' }}>
            <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '1rem' }}>
              Ratification Methodology &amp; Charter Criteria
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '1rem' }}>
              {CAPABILITY_SYSTEMS_CHARTER.evaluationDimensions.map((dim, i) => (

                  <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>Criterion 0{i + 1}</div>

    function GovernanceLedgerTemplate({ onNavigate }) {

          <SectionHeaderBlock
            indexLabel="Route 19 • Institutional Control"
            title="Governance & Stage-Gate Ledger"
            subtitle="Complete route topology, lifecycle status classifications, and separation between long-horizon research and verified operational reality."
          />

          <div className="tvz-monolith-card" style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '0.85rem' }}>
              <thead>
                <tr className="tvz-hairline-b">
                  <th className="tvz-mono" style={{ padding: '1rem', color: 'var(--tvz-color-champagne)' }}>ID</th>
                  <th className="tvz-mono" style={{ padding: '1rem', color: 'var(--tvz-color-champagne)' }}>Canonical Path</th>
                  <th className="tvz-mono" style={{ padding: '1rem', color: 'var(--tvz-color-champagne)' }}>Title</th>

                {ROUTE_REGISTRY.map((r) => (

                    <td className="tvz-mono" style={{ padding: '0.85rem 1rem' }}>

    function GatewayPortalTemplate() {
      const [email, setEmail] = useState('');
      const [track, setTrack] = useState('Institutional Dispatch');
      const [statusMsg, setStatusMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email.trim()) return;
        try {
          window.localStorage.setItem(
            'tovenza_gateway_dispatch_preview',
            JSON.stringify({ email: email.trim(), track, recordedAt: new Date().toISOString() })
          );
        } catch {}
        setStatusMsg(`Recorded locally in preview storage for ${email.trim()} (${track}).`);
        setEmail('');
      };

      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Route 20 • Institutional Gateway"
            title="Dispatches & Level 2 Workspace Preview"
            subtitle="Register an address for institutional architectural notes or preview the upcoming Level 2 Authorized Digital Workspace gateway."
          />

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem' }}>
            <form onSubmit={handleSubmit} className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '1rem' }}>
              <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Institutional Dispatch Registration</div>
              <label style={{ display: 'grid', gap: '0.4rem', fontSize: '0.85rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                <span>Inquiry Track</span>
                <select
                  value={track}
                  onChange={(e) => setTrack(e.target.value)}
                  style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                >
                  <option value="Institutional Dispatch">Institutional Dispatch</option>
                  <option value="TOVENZA Retail Supplier / Research Inquiry">TOVENZA Retail Supplier / Research Inquiry</option>
                  <option value="Strategic Horizon Dialogue">Strategic Horizon Dialogue</option>
                  <option value="Level 2 Workspace Pilot">Level 2 Workspace Pilot</option>
                </select>
              </label>
              <label style={{ display: 'grid', gap: '0.4rem', fontSize: '0.85rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                <span>Email Address</span>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@institution.org"
                  style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                />
              </label>
              <button
                type="submit"
                className="tvz-mono tvz-focus-ring"
                style={{ padding: '0.85rem 1.25rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
              >
                Record Dispatch Interest
              </button>
              <p style={{ fontSize: '0.78rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>
                Preview Disclosure: Entries are stored locally in browser <code>localStorage</code> until Level 2 backend services are deployed.
              </p>
              {statusMsg && (
                <p role="status" style={{ fontSize: '0.84rem', color: 'var(--tvz-color-champagne-light)', margin: 0 }}>{statusMsg}</p>
              )}
            </form>

            <div className="tvz-monolith-card" style={{ padding: '2rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
              <div>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Ecosystem Progression</div>
                <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', margin: '0.6rem 0 1rem' }}>Level 2 Authorized Digital Workspace</h2>
                <p style={{ fontSize: '0.9rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                  Authenticated member dashboards, saved quantitative decision analyses, and horizon-specific operational instruments are scheduled for Phase 08 following backend security and privacy ratification.
                </p>
              </div>
              <div className="tvz-mono" style={{ color: 'var(--tvz-color-ivory-muted)', fontSize: '0.6rem', marginTop: '1.5rem' }}>
                Current Active Layer: Level 1 Public Institutional Experience
              </div>
            </div>
          </div>
        </div>
      );
    }

      return (

          <SectionHeaderBlock
            indexLabel="Route 21 • Legal & Regulatory Disclosures"

            subtitle="Governing principles regarding forward-looking strategic horizons, non-advisory boundaries, and local preview data handling."
          />

          <div style={{ display: 'grid', gap: '1.25rem' }}>
            <article className="tvz-monolith-card" style={{ padding: '2rem' }}>
              <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', marginTop: 0 }}>
                1. Non-Operational &amp; Forward-Looking Horizon Notice
              </h2>
              <p style={{ color: 'var(--tvz-color-ivory-secondary)', marginBottom: 0 }}>
                The Eleven Strategic Horizons presented across TOVENZA represent long-term areas of institutional research, strategic thesis development, and phased capability building. Representation of a horizon does not constitute a claim of current commercial operation, regulated licensing, or historical financial performance.

            <article className="tvz-monolith-card" style={{ padding: '2rem' }}>
              <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', marginTop: 0 }}>
                2. Non-Advisory Boundary
              </h2>
              <p style={{ color: 'var(--tvz-color-ivory-secondary)', marginBottom: 0 }}>
                Analytical models, decision-pacing frameworks, and structural publications provided on this platform are informational instruments and do not constitute regulated investment, banking, legal, tax, or clinical medical advice.
              </p>
            </article>

            <article className="tvz-monolith-card" style={{ padding: '2rem' }}>
              <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', marginTop: 0 }}>
                3. Preview Data Handling
              </h2>
              <p style={{ color: 'var(--tvz-color-ivory-secondary)', marginBottom: 0 }}>
                During Level 1 institutional preview, interactive preferences and dispatch notes are retained locally within the user&apos;s browser storage rather than transmitted to an external production database.
              </p>
            </article>
          </div>

    }

    /* ============================================================================
       INSTITUTIONAL FOOTER
       ============================================================================ */
    function InstitutionalFooter({ onNavigate }) {
      return (
        <footer className="tvz-hairline-t" style={{ backgroundColor: 'var(--tvz-color-obsidian-deep)', paddingBlock: '4rem 2.5rem' }}>
          <div className="tvz-container">
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '2.5rem', paddingBottom: '3rem' }}>
              <div>
                <div className="tvz-display" style={{ fontSize: '1.6rem', letterSpacing: '0.2em' }}>{INSTITUTION_META.name}</div>
                <p style={{ fontSize: '0.85rem', color: 'var(--tvz-color-ivory-muted)', marginTop: '0.75rem' }}>
                  {INSTITUTION_META.statement} — {INSTITUTION_META.identity}.
                </p>
                <p className="tvz-mono" style={{ fontSize: '0.58rem', color: 'var(--tvz-color-champagne)', marginTop: '1rem' }}>
                  {INSTITUTION_META.creativeDirection}
                </p>
              </div>

              <div>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '0.85rem' }}>Four Foundations</div>
                <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: '0.5rem', fontSize: '0.84rem' }}>
                  {FOUR_FOUNDATIONS.map((f) => (
                    <li key={f.id}>
                      <InstitutionalLink to={f.path} onNavigate={onNavigate} style={{ color: 'var(--tvz-color-ivory-secondary)', textDecoration: 'none' }}>
                        {f.numeral}. {f.title}
                      </InstitutionalLink>
                    </li>
                  ))}
                </ul>
              </div>

              <div>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '0.85rem' }}>Horizons (01–06)</div>
                <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: '0.5rem', fontSize: '0.84rem' }}>
                  {ELEVEN_HORIZONS.slice(0, 6).map((h) => (
                    <li key={h.slug}>
                      <InstitutionalLink to={h.path} onNavigate={onNavigate} style={{ color: 'var(--tvz-color-ivory-secondary)', textDecoration: 'none' }}>
                        {h.index}. {h.title}
                      </InstitutionalLink>
                    </li>
                  ))}
                </ul>
              </div>

              <div>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '0.85rem' }}>Horizons (07–11) &amp; Control</div>
                <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: '0.5rem', fontSize: '0.84rem' }}>
                  {ELEVEN_HORIZONS.slice(6).map((h) => (
                    <li key={h.slug}>
                      <InstitutionalLink to={h.path} onNavigate={onNavigate} style={{ color: 'var(--tvz-color-ivory-secondary)', textDecoration: 'none' }}>
                        {h.index}. {h.title}
                      </InstitutionalLink>
                    </li>
                  ))}
                  <li style={{ paddingTop: '0.4rem' }}>
                    <InstitutionalLink to="/capabilities" onNavigate={onNavigate} style={{ color: 'var(--tvz-color-champagne-light)', textDecoration: 'none' }}>
                      Capabilities • Governance • Gateway • Legal
                    </InstitutionalLink>
                  </li>
                </ul>
              </div>
            </div>

            <div className="tvz-hairline-t" style={{ paddingTop: '1.5rem', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', gap: '1rem', color: 'var(--tvz-color-ivory-muted)' }}>
              <span className="tvz-mono">© {new Date().getFullYear()} TOVENZA. Beyond Business. Built to Endure.</span>
              <span className="tvz-mono">21 Canonical Routes • Foundations I–IV &amp; Horizon 10 Retail Complete</span>
            </div>
          </div>
        </footer>
      );
    }

    /* ============================================================================
       UNIFIED 21-ROUTE APPLICATION ROOT
       ============================================================================ */
    function normalizePathname(rawPath) {
      if (!rawPath || rawPath === '') return '/';
      return rawPath.replace(/\/+$/, '') || '/';
    }

    function App() {
      const [currentPath, setCurrentPath] = useState(() => {
        if (window.location.protocol === 'blob:' || window.location.origin === 'null') return '/';
        return normalizePathname(window.location.pathname);
      });

      const navigate = useCallback((to) => {
        const nextPath = normalizePathname(to);
        if (
          window.location.protocol !== 'blob:' &&
          window.location.origin !== 'null' &&
          window.location.pathname !== nextPath
        ) {
          try {
            window.history.pushState({}, '', nextPath);
          } catch {}
        }
        setCurrentPath(nextPath);
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch {}
      }, []);

      useEffect(() => {
        if (window.location.protocol === 'blob:') return;
        const handlePopState = () => setCurrentPath(normalizePathname(window.location.pathname));
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const matchedRoute = ROUTE_REGISTRY.find((r) => r.path === currentPath);

      useEffect(() => {
        if (!matchedRoute || matchedRoute.path === '/') {
          document.title = 'TOVENZA — Global Institutional Group';
        } else if (matchedRoute.path === '/foundations/sovereign-identity') {
          document.title = 'Sovereign Identity (Foundation I) — TOVENZA';
        } else if (matchedRoute.path === '/foundations/architectural-authority') {
          document.title = 'Architectural Authority (Foundation II) — TOVENZA';
        } else if (matchedRoute.path === '/foundations/financial-sophistication') {
          document.title = 'Financial Sophistication (Foundation III) — TOVENZA';
        } else if (matchedRoute.path === '/foundations/global-ecosystem') {
          document.title = 'Global Ecosystem (Foundation IV) — TOVENZA';
        } else if (matchedRoute.path === '/horizons/retail') {
          document.title = 'TOVENZA Retail (Horizon 10) — TOVENZA';
        } else {
          document.title = `${matchedRoute.title} — TOVENZA`;
        }
      }, [matchedRoute]);

      let activeView = null;
      if (!matchedRoute || matchedRoute.path === '/') {
        activeView = <HomeFlagshipTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/institution') {
        activeView = <EditorialEssayTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/sovereign-identity') {
        activeView = <SovereignIdentityTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/architectural-authority') {
        activeView = <ArchitecturalAuthorityTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/financial-sophistication') {
        activeView = <FinancialSophisticationTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/global-ecosystem') {
        activeView = <GlobalEcosystemTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/horizons/retail') {
        activeView = <RetailHorizonTemplate onNavigate={navigate} />;
      } else if (matchedRoute.group === 'foundations') {
        activeView = <FoundationDetailTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.group === 'horizons') {
        activeView = <HorizonBlueprintTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.path === '/capabilities') {
        activeView = <CapabilityFrameworkTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/governance') {
        activeView = <GovernanceLedgerTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/gateway') {
        activeView = <GatewayPortalTemplate />;
      } else if (matchedRoute.path === '/legal') {
        activeView = <LegalDocumentTemplate />;
      }

      return (
        <InstitutionalErrorBoundary>
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', backgroundColor: 'var(--tvz-color-obsidian)', color: 'var(--tvz-color-ivory)' }}>
            <InstitutionalHeader currentPath={matchedRoute ? matchedRoute.path : '/'} onNavigate={navigate} />
            <main style={{ flex: 1 }}>{activeView}</main>
            <InstitutionalFooter onNavigate={navigate} />
          </div>
        </InstitutionalErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
