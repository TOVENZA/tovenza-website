       ============================================================================ */
    function RetailHorizonTemplate({ onNavigate }) {
      const [requests, setRequests] = useState(() => loadRetailRequests());
      const [activeView, setActiveView] = useState('customer'); // 'customer' | 'ops'
      const [selectedRequestId, setSelectedRequestId] = useState(() => {
        const initial = loadRetailRequests();
        return initial[0] ? initial[0].requestId : '';
      });

      // Customer Product Request Form State
      const [direction, setDirection] = useState(RETAIL_DIRECTIONS[2].label);
      const [categoryTag, setCategoryTag] = useState('');
      const [productNeed, setProductNeed] = useState('');
      const [budgetRange, setBudgetRange] = useState('₹2,500 – ₹7,500');
      const [urgency, setUrgency] = useState('Within 1–2 weeks');
      const [requirements, setRequirements] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [customerContact, setCustomerContact] = useState('');
      const [consentGiven, setConsentGiven] = useState(false);
      const [formError, setFormError] = useState('');
      const [lastSubmittedId, setLastSubmittedId] = useState('');
      const [submitting, setSubmitting] = useState(false);

      // Lookup & Customer Follow-up State
      const [lookupId, setLookupId] = useState('');
      const [lookupFeedback, setLookupFeedback] = useState('');
      const [customerNoteText, setCustomerNoteText] = useState('');
      const [customerDecisionNote, setCustomerDecisionNote] = useState('');

      // Internal Operations Passcode & Editing State
      const [consoleUnlocked, setConsoleUnlocked] = useState(false);
      const [passcodeInput, setPasscodeInput] = useState('');
      const [passcodeError, setPasscodeError] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');

      // New Structured Recommendation Form State (Internal Ops)
      const [recProductName, setRecProductName] = useState('');
      const [recSupplier, setRecSupplier] = useState('');
      const [recSourceLink, setRecSourceLink] = useState('');
      const [recPriceLabel, setRecPriceLabel] = useState('');
      const [recPriceType, setRecPriceType] = useState('Estimated Price');
      const [recSpecs, setRecSpecs] = useState('');
      const [recAdvantages, setRecAdvantages] = useState('');
      const [recLimitations, setRecLimitations] = useState('');
      const [recWarranty, setRecWarranty] = useState('Verify manufacturer/seller warranty before purchase');
      const [recReturnPolicy, setRecReturnPolicy] = useState('Subject to seller return window at purchase');
      const [recDelivery, setRecDelivery] = useState('Verify courier delivery window & pin-code coverage');
      const [recReason, setRecReason] = useState('');
      const [recDisclosure, setRecDisclosure] = useState(
        'No paid placement or affiliate commission exists in this free discovery pilot; verify live terms before buying.'
      );

      useEffect(() => {
        saveRetailRequests(requests);
      }, [requests]);

      const activeRequest = useMemo(() => {
        if (!requests.length) return null;
        return requests.find((r) => r.requestId === selectedRequestId) || requests[0];
      }, [requests, selectedRequestId]);

      const demandSummary = useMemo(() => {
        const counts = {
          'Direction A': 0,
          'Direction B': 0,
          'Direction C': 0,
          'Direction D': 0,
          purchaseEnquiries: 0,
          total: requests.length
        };
        requests.forEach((req) => {
          if (req.direction.startsWith('Direction A')) counts['Direction A'] += 1;
          else if (req.direction.startsWith('Direction B')) counts['Direction B'] += 1;
          else if (req.direction.startsWith('Direction C')) counts['Direction C'] += 1;
          else if (req.direction.startsWith('Direction D')) counts['Direction D'] += 1;
          if (req.status === 'Purchase Enquiry') counts.purchaseEnquiries += 1;
        });
        return counts;
      }, [requests]);

      const handleRequestSubmit = (e) => {
        e.preventDefault();
        setFormError('');

        if (submitting) return;
        if (!productNeed.trim() || productNeed.trim().length < 6) {
          setFormError('Please describe the product you are looking for (at least 6 characters).');
          return;
        }
        if (!customerName.trim() || !customerContact.trim()) {
          setFormError('Please provide your name and a valid email or contact reference so we can share your request update.');
          return;
        }
        if (!consentGiven) {
          setFormError('Explicit consent is required so TOVENZA can process your discovery request and retain your record.');
          return;
        }

        const nowMs = Date.now();
        const isDuplicate = requests.some((item) => {
          const sameNeed = item.productNeed.trim().toLowerCase() === productNeed.trim().toLowerCase();
          const sameContact = item.customerContact.trim().toLowerCase() === customerContact.trim().toLowerCase();
          const ageMs = nowMs - new Date(item.createdAt).getTime();
          return sameNeed && sameContact && ageMs < 120000;
        });

        if (isDuplicate) {
          setFormError('Duplicate submission detected within 2 minutes for the same product request and contact.');
          return;
        }

        setSubmitting(true);
        const newId = generateUniqueRequestId(requests);
        const createdIso = new Date().toISOString();
        const newRecord = {
          requestId: newId,
          createdAt: createdIso,
          direction,
          categoryTag: categoryTag.trim() || 'General Discovery',
          productNeed: productNeed.trim(),
          budgetRange: budgetRange.trim() || 'Not specified',
          urgency: urgency.trim() || 'Flexible',
          requirements: requirements.trim() || 'None specified',
          customerName: customerName.trim(),
          customerContact: customerContact.trim(),
          consentGiven: true,
          status: 'New Request',
          internalNotes: '',
          supplierNotes: '',
          outcomeSummary: 'Awaiting internal review.',
          recommendations: [],
          messages: [
            {
              id: `MSG-${nowMs}`,
              sender: 'TOVENZA Retail Discovery',
              createdAt: createdIso,
              text: `Request ${newId} received under "${direction}". Free pilot discovery service — no payment or checkout taken.`
            }
          ]
        };

        setRequests((prev) => [newRecord, ...prev]);
        setSelectedRequestId(newId);
        setLastSubmittedId(newId);
        setLookupId(newId);
        setCategoryTag('');
        setProductNeed('');
        setRequirements('');
        setCustomerName('');
        setCustomerContact('');
        setConsentGiven(false);
        setSubmitting(false);
      };

      const handleLookupRequest = (e) => {
        e.preventDefault();
        const cleanId = lookupId.trim().toUpperCase();
        if (!cleanId) return;
        const found = requests.find((r) => r.requestId.toUpperCase() === cleanId);
        if (found) {
          setSelectedRequestId(found.requestId);
          setLookupFeedback(`Found Request ${found.requestId} — Current status: ${found.status}.`);
        } else {
          setLookupFeedback(`No request found matching "${cleanId}" in current browser pilot records.`);
        }
      };

      const handleCustomerAction = (nextStatus, noteText) => {
        if (!activeRequest) return;
        const ts = new Date().toISOString();
        const trimmed = (noteText || '').trim();
        setRequests((prev) =>
          prev.map((item) => {
            if (item.requestId !== activeRequest.requestId) return item;
            const nextMessages = [...(item.messages || [])];
            if (trimmed) {
              nextMessages.push({
                id: `MSG-${Date.now()}`,
                sender: 'Customer Note',
                createdAt: ts,
                text: trimmed
              });
            } else {
              nextMessages.push({
                id: `MSG-${Date.now()}`,
                sender: 'Customer Action',
                createdAt: ts,
                text: `Customer updated status to "${nextStatus}".`
              });
            }
            return {
              ...item,
              status: nextStatus,
              outcomeSummary:
                nextStatus === 'Purchase Enquiry'
                  ? 'Customer expressed purchase enquiry for further details (no live checkout).'
                  : item.outcomeSummary,
              messages: nextMessages
            };
          })
        );
        setCustomerNoteText('');
        setCustomerDecisionNote('');
      };

      const handleUnlockConsole = (e) => {
        e.preventDefault();
        if (passcodeInput.trim() === INTERNAL_CONSOLE_PASSCODE) {
          setConsoleUnlocked(true);
          setPasscodeError('');
          setPasscodeInput('');
        } else {
          setPasscodeError('Invalid pilot passcode. Internal operations console remains locked.');
        }
      };

      const handleUpdateRequestOps = (requestId, patch) => {
        setRequests((prev) =>
          prev.map((item) => (item.requestId === requestId ? { ...item, ...patch } : item))
        );
      };

      const handleAddRecommendation = (e) => {
        e.preventDefault();
        if (!activeRequest || !recProductName.trim()) return;
        const newRec = {
          recId: `REC-${Date.now().toString().slice(-4)}`,
          productName: recProductName.trim(),
          supplierOrSeller: recSupplier.trim() || 'Source Seller (Verify Listing)',
          sourceLink: recSourceLink.trim() || 'https://consumeraffairs.nic.in/',
          priceLabel: recPriceLabel.trim() || 'Price to be verified at source',
          priceType: recPriceType,
          specifications: recSpecs.trim() || 'Specifications logged during research.',
          advantages: recAdvantages
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean),
          limitations: recLimitations
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean),
          warrantyInfo: recWarranty.trim() || 'Verify manufacturer/seller warranty',
          returnPolicy: recReturnPolicy.trim() || 'Verify seller return policy',
          deliveryInfo: recDelivery.trim() || 'Verify delivery window & terms',
          reason: recReason.trim() || 'Selected to match stated requirements and budget constraints.',
          commercialDisclosure:
            recDisclosure.trim() ||
            'No paid placement or affiliate commission exists unless explicitly disclosed.'
        };

        const ts = new Date().toISOString();
        setRequests((prev) =>
          prev.map((item) => {
            if (item.requestId !== activeRequest.requestId) return item;
            return {
              ...item,
              status: 'Recommendation Ready',
              recommendations: [...(item.recommendations || []), newRec],
              messages: [
                ...(item.messages || []),
                {
                  id: `MSG-${Date.now()}`,
                  sender: 'TOVENZA Retail Research',
                  createdAt: ts,
                  text: `Added structured research option: ${newRec.productName} (${newRec.priceType}: ${newRec.priceLabel}).`
                }
              ]
            };
          })
        );

        setRecProductName('');
        setRecSupplier('');
        setRecSourceLink('');
        setRecPriceLabel('');
        setRecSpecs('');
        setRecAdvantages('');
        setRecLimitations('');
        setRecReason('');
      };

      const filteredOpsRequests = useMemo(() => {
        if (statusFilter === 'ALL') return requests;
        return requests.filter((r) => r.status === statusFilter);
      }, [requests, statusFilter]);

      return (
        <article aria-labelledby="retail-horizon-heading">
          {/* HERO & PILOT SERVICE POSITIONING */}
          <section className="tvz-container" style={{ paddingBlock: 'clamp(3.5rem, 6.5vw, 5.5rem)' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center', marginBottom: '1.25rem' }}>
              <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>
                Horizon 10 of 11 • TOVENZA Retail Activation
              </span>
              <LifecycleStatusBadge status="Active Pilot" />
              <span className="tvz-mono" style={{ fontSize: '0.56rem', color: 'var(--tvz-color-ivory-muted)' }}>
                FREE SCOPED DISCOVERY PILOT • NO FAKE CHECKOUT OR INVENTORY
              </span>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '2.25rem', alignItems: 'center' }}>
              <div>
                <h1 id="retail-horizon-heading" className="tvz-display" style={{ fontSize: 'var(--tvz-text-hero)', margin: '0 0 0.85rem' }}>
                  TOVENZA Product Discovery &amp; Buying Assistance
                </h1>
                <p className="tvz-display" style={{ fontSize: 'clamp(1.25rem, 2vw, 1.65rem)', fontStyle: 'italic', color: 'var(--tvz-color-champagne-light)', margin: '0 0 1.15rem' }}>
                  “Understand before selling. Evaluate before selecting. Communicate before transacting.”

                    className="tvz-mono tvz-focus-ring"
                    style={{
                      padding: '0.8rem 1.25rem',
                      cursor: 'pointer',
                      border: '1px solid var(--tvz-border-champagne)',
                      backgroundColor: activeView === 'customer' ? 'var(--tvz-color-champagne)' : 'transparent',
                      color: activeView === 'customer' ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory)',
                      fontWeight: 500

                          onChange={(e) => setCategoryTag(e.target.value)}
                          placeholder="e.g., Desk Lamp, Ergonomic Chair, Organizer"
                          style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                        />
                      </label>

                      <label style={{ display: 'grid', gap: '0.35rem', fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Budget Range</span>
                        <input
                          type="text"
                          value={budgetRange}
                          onChange={(e) => setBudgetRange(e.target.value)}
                          placeholder="e.g., ₹2,000 – ₹6,000"
                          style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                        />
                      </label>
                    </div>

                    <label style={{ display: 'grid', gap: '0.35rem', fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                      <span>What Product Do You Need? *</span>
                      <textarea
                        rows={2}
                        required
                        value={productNeed}
                        onChange={(e) => setProductNeed(e.target.value)}
                        placeholder="Describe the item you need and how you plan to use it..."
                        style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', resize: 'vertical' }}
                      />
                    </label>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '0.85rem' }}>
                      <label style={{ display: 'grid', gap: '0.35rem', fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Timeline / Urgency</span>
                        <select
                          value={urgency}
                          onChange={(e) => setUrgency(e.target.value)}
                          style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                        >
                          <option value="Immediate (This week)">Immediate (This week)</option>
                          <option value="Within 1–2 weeks">Within 1–2 weeks</option>
                          <option value="Within a month">Within a month</option>
                          <option value="Research / Exploring">Research / Exploring</option>
                        </select>
                      </label>

                      <label style={{ display: 'grid', gap: '0.35rem', fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Key Constraints / Preferences</span>
                        <input
                          type="text"
                          value={requirements}
                          onChange={(e) => setRequirements(e.target.value)}
                          placeholder="Size, warranty, durability, compatibility..."
                          style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                        />
                      </label>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '0.85rem' }}>
                      <label style={{ display: 'grid', gap: '0.35rem', fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Your Name *</span>
                        <input
                          type="text"
                          required
                          value={customerName}
                          onChange={(e) => setCustomerName(e.target.value)}
                          placeholder="Full name"
                          style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                        />
                      </label>

                      <label style={{ display: 'grid', gap: '0.35rem', fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Email or Preferred Contact *</span>
                        <input
                          type="text"
                          required
                          value={customerContact}
                          onChange={(e) => setCustomerContact(e.target.value)}
                          placeholder="name@domain.com"
                          style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                        />
                      </label>
                    </div>

                    <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.6rem', fontSize: '0.8rem', color: 'var(--tvz-color-ivory-secondary)', cursor: 'pointer' }}>
                      <input
                        type="checkbox"
                        checked={consentGiven}
                        onChange={(e) => setConsentGiven(e.target.checked)}
                        style={{ marginTop: '0.25rem' }}
                      />
                      <span>
                        I consent to TOVENZA processing my stated product requirements and contact details solely to provide buying research and respond to my request under TOVENZA’s privacy terms. Internal contact fields are not displayed publicly.
                      </span>
                    </label>

                    {formError && (
                      <p role="alert" style={{ margin: 0, fontSize: '0.84rem', color: 'var(--tvz-color-champagne-light)' }}>
                        {formError}
                      </p>
                    )}

                    <button
                      type="submit"
                      disabled={submitting}
                      className="tvz-mono tvz-focus-ring"
                      style={{
                        padding: '0.88rem 1.35rem',
                        backgroundColor: 'var(--tvz-color-champagne)',
                        color: 'var(--tvz-color-obsidian)',
                        border: 'none',
                        cursor: 'pointer',
                        fontWeight: 500
                      }}
                    >
                      {submitting ? 'Logging Request...' : 'Submit Free Discovery Request & Generate ID'}
                    </button>

                    {lastSubmittedId && (
                      <div role="status" className="tvz-hairline-t" style={{ paddingTop: '0.9rem' }}>
                        <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne-light)', fontSize: '0.58rem' }}>
                          Stage 03 • Request Confirmation Recorded
                        </div>
                        <p style={{ margin: '0.35rem 0 0', fontSize: '0.88rem', color: 'var(--tvz-color-ivory)' }}>
                          Your unique Request ID is <strong style={{ color: 'var(--tvz-color-champagne-light)' }}>{lastSubmittedId}</strong>. Use it on the right to review status, structured product comparisons, and purchase enquiry options.
                        </p>
                      </div>
                    )}
                  </form>

                  {/* REQUEST LOOKUP, STRUCTURED COMPARISON & CUSTOMER DECISION PANEL */}
                  <div style={{ display: 'grid', gap: '1.25rem' }}>
                    <form onSubmit={handleLookupRequest} className="tvz-monolith-card" style={{ padding: '1.5rem', display: 'grid', gap: '0.75rem' }}>
                      <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                        Track Existing Request or Sample Comparison
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                        <input
                          type="text"
                          value={lookupId}
                          onChange={(e) => setLookupId(e.target.value)}
                          placeholder="Enter Request ID (e.g., TVZ-RET-104821)"
                          aria-label="Lookup Request ID"
                          style={{ flex: '1 1 200px', padding: '0.65rem 0.8rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                        />
                        <button
                          type="submit"
                          className="tvz-mono tvz-focus-ring"
                          style={{ padding: '0.65rem 1rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne)', cursor: 'pointer', fontSize: '0.58rem' }}
                        >
                          Open Request
                        </button>
                      </div>
                      {lookupFeedback && (
                        <p role="status" style={{ margin: 0, fontSize: '0.8rem', color: 'var(--tvz-color-champagne-light)' }}>
                          {lookupFeedback}
                        </p>
                      )}
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                        {requests.slice(0, 4).map((r) => (
                          <button
                            key={r.requestId}
                            type="button"
                            onClick={() => setSelectedRequestId(r.requestId)}
                            className="tvz-mono tvz-focus-ring"
                            style={{
                              padding: '0.35rem 0.6rem',
                              fontSize: '0.54rem',
                              cursor: 'pointer',
                              border: '1px solid var(--tvz-border-hairline)',
                              backgroundColor: activeRequest && activeRequest.requestId === r.requestId ? 'rgba(185,157,107,0.14)' : 'transparent',
                              color: 'var(--tvz-color-ivory-secondary)'
                            }}
                          >
                            {r.requestId} • {r.status}
                          </button>
                        ))}
                      </div>
                    </form>

                    {activeRequest && (
                      <div className="tvz-monolith-card" style={{ padding: '1.85rem', display: 'grid', gap: '1.15rem' }}>
                        <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '0.5rem' }}>
                          <div>
                            <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                              {activeRequest.requestId} • {activeRequest.direction}
                            </span>
                            <h3 className="tvz-display" style={{ fontSize: '1.5rem', margin: '0.25rem 0 0' }}>
                              {activeRequest.productNeed}
                            </h3>
                          </div>
                          <span className="tvz-mono" style={{ padding: '0.3rem 0.65rem', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne-light)', fontSize: '0.56rem' }}>
                            {activeRequest.status}
                          </span>
                        </div>

                        <div style={{ fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)', display: 'grid', gap: '0.35rem' }}>
                          <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Budget:</strong> {activeRequest.budgetRange} • <strong style={{ color: 'var(--tvz-color-ivory)' }}>Timeline:</strong> {activeRequest.urgency}</div>
                          <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Requirements:</strong> {activeRequest.requirements}</div>
                        </div>

                        {/* STRUCTURED PRODUCT RECOMMENDATIONS */}
                        <div className="tvz-hairline-t" style={{ paddingTop: '1rem' }}>
                          <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem', marginBottom: '0.75rem' }}>
                            Structured Research &amp; Comparison Records ({activeRequest.recommendations ? activeRequest.recommendations.length : 0})
                          </div>

                          {(!activeRequest.recommendations || activeRequest.recommendations.length === 0) ? (
                            <p style={{ fontSize: '0.85rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>
                              No structured product comparisons added to this request yet. You can ask a question below or add a research comparison in the Internal Operations Console.
                            </p>
                          ) : (
                            <div style={{ display: 'grid', gap: '0.85rem' }}>
                              {activeRequest.recommendations.map((rec) => (
                                <div key={rec.recId} style={{ padding: '1.1rem', border: '1px solid var(--tvz-border-hairline)', backgroundColor: 'rgba(8,9,9,0.75)', display: 'grid', gap: '0.45rem', fontSize: '0.83rem' }}>
                                  <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', gap: '0.5rem' }}>
                                    <strong style={{ color: 'var(--tvz-color-ivory)', fontSize: '0.94rem' }}>{rec.productName}</strong>
                                    <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne-light)', fontSize: '0.55rem' }}>
                                      {rec.priceType}: {rec.priceLabel}
                                    </span>
                                  </div>
                                  <div style={{ color: 'var(--tvz-color-ivory-secondary)' }}>
                                    <strong>Seller / Source:</strong> {rec.supplierOrSeller} •{' '}
                                    <a href={rec.sourceLink} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--tvz-color-champagne)' }}>
                                      Source Reference ↗
                                    </a>
                                  </div>
                                  <div style={{ color: 'var(--tvz-color-ivory-secondary)' }}><strong>Specs:</strong> {rec.specifications}</div>
                                  {rec.advantages && rec.advantages.length > 0 && (
                                    <div style={{ color: 'var(--tvz-color-ivory-secondary)' }}><strong>Advantages:</strong> {rec.advantages.join(' • ')}</div>
                                  )}
                                  {rec.limitations && rec.limitations.length > 0 && (
                                    <div style={{ color: 'var(--tvz-color-ivory-muted)' }}><strong>Limitations:</strong> {rec.limitations.join(' • ')}</div>
                                  )}
                                  <div style={{ color: 'var(--tvz-color-ivory-muted)' }}>
                                    <strong>Warranty:</strong> {rec.warrantyInfo} | <strong>Returns:</strong> {rec.returnPolicy} | <strong>Delivery:</strong> {rec.deliveryInfo}
                                  </div>
                                  <div style={{ color: 'var(--tvz-color-ivory)' }}><strong>Why Recommended:</strong> {rec.reason}</div>
                                  <div className="tvz-mono" style={{ color: 'var(--tvz-color-ivory-muted)', fontSize: '0.54rem' }}>
                                    Disclosure: {rec.commercialDisclosure}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        {/* CUSTOMER QUESTION & DECISION / PURCHASE ENQUIRY */}
                        <div className="tvz-hairline-t" style={{ paddingTop: '1rem', display: 'grid', gap: '0.75rem' }}>
                          <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                            Stages 07–08 • Ask Questions, Decide or Log Purchase Enquiry
                          </div>
                          <input
                            type="text"
                            value={customerNoteText}
                            onChange={(e) => setCustomerNoteText(e.target.value)}
                            placeholder="Ask a question or share your preference on the options above..."
                            aria-label="Customer question or note"
                            style={{ padding: '0.65rem 0.8rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.84rem' }}
                          />
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                            <button
                              type="button"
                              onClick={() => handleCustomerAction(activeRequest.status, customerNoteText || 'Customer asked a follow-up question.')}
                              className="tvz-mono tvz-focus-ring"
                              style={{ padding: '0.6rem 0.9rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', cursor: 'pointer', fontSize: '0.56rem' }}
                            >
                              Post Question / Note
                            </button>
                            <button
                              type="button"
                              onClick={() => handleCustomerAction('Purchase Enquiry', customerDecisionNote || 'Customer wants to proceed toward purchase enquiry & next steps.')}
                              className="tvz-mono tvz-focus-ring"
                              style={{ padding: '0.6rem 0.95rem', backgroundColor: 'var(--tvz-color-champagne)', border: 'none', color: 'var(--tvz-color-obsidian)', cursor: 'pointer', fontSize: '0.56rem', fontWeight: 500 }}
                            >
                              Mark Purchase Enquiry
                            </button>
                            <button
                              type="button"
                              onClick={() => handleCustomerAction('Awaiting Customer Response', 'Customer holding decision to review options further.')}
                              className="tvz-mono tvz-focus-ring"
                              style={{ padding: '0.6rem 0.9rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne-light)', cursor: 'pointer', fontSize: '0.56rem' }}
                            >
                              Hold / Decide Later
                            </button>
                          </div>
                          <input
                            type="text"
                            value={customerDecisionNote}
                            onChange={(e) => setCustomerDecisionNote(e.target.value)}
                            placeholder="Optional note for purchase enquiry or decision (e.g., preferred option or delivery city)"
                            aria-label="Purchase enquiry note"
                            style={{ padding: '0.6rem 0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory-secondary)', fontSize: '0.8rem' }}
                          />

                          {activeRequest.messages && activeRequest.messages.length > 0 && (
                            <div style={{ display: 'grid', gap: '0.4rem', marginTop: '0.25rem' }}>
                              {activeRequest.messages.map((m) => (
                                <div key={m.id} style={{ padding: '0.6rem 0.75rem', borderLeft: '2px solid var(--tvz-color-champagne)', backgroundColor: 'rgba(32,35,33,0.35)', fontSize: '0.8rem' }}>
                                  <span className="tvz-mono" style={{ fontSize: '0.54rem', color: 'var(--tvz-color-champagne)' }}>{m.sender}</span>
                                  <div style={{ color: 'var(--tvz-color-ivory-secondary)', marginTop: '0.15rem' }}>{m.text}</div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </section>
          ) : (
            /* INTERNAL OPERATIONS & RESEARCH CONSOLE */
            <section className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
              <div className="tvz-container">
                {!consoleUnlocked ? (
                  <form onSubmit={handleUnlockConsole} className="tvz-monolith-card" style={{ padding: '2.25rem', maxWidth: '34rem', display: 'grid', gap: '1rem' }}>
                    <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                      Internal Operations Access Separation (Pilot Gate)
                    </span>
                    <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: 0 }}>
                      Unlock Retail Operations Console
                    </h2>
                    <p style={{ fontSize: '0.85rem', color: 'var(--tvz-color-ivory-secondary)', margin: 0 }}>
                      Internal customer contact fields, research notes, supplier checks, and status transitions are separated from the public customer view. Enter pilot passcode (<code style={{ color: 'var(--tvz-color-champagne-light)' }}>{INTERNAL_CONSOLE_PASSCODE}</code>) to manage requests. (Note: For multi-device production security, move authentication and storage to a server backend.)
                    </p>
                    <input
                      type="password"
                      value={passcodeInput}
                      onChange={(e) => setPasscodeInput(e.target.value)}
                      placeholder="Enter internal pilot passcode"
                      aria-label="Internal pilot passcode"
                      style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                    />
                    {passcodeError && (
                      <p role="alert" style={{ margin: 0, fontSize: '0.82rem', color: 'var(--tvz-color-champagne-light)' }}>
                        {passcodeError}
                      </p>
                    )}
                    <button
                      type="submit"
                      className="tvz-mono tvz-focus-ring"
                      style={{ padding: '0.8rem 1.2rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
                    >
                      Open Operations Console
                    </button>
                  </form>
                ) : (
                  <div style={{ display: 'grid', gap: '1.75rem' }}>
                    <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                      <div>
                        <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                          Internal Operations &amp; Evidence Tracking
                        </span>
                        <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: '0.25rem 0 0' }}>
                          Request Queue ({filteredOpsRequests.length}) • Purchase Enquiries: {demandSummary.purchaseEnquiries}
                        </h2>
                      </div>
                      <button
                        type="button"
                        onClick={() => setConsoleUnlocked(false)}
                        className="tvz-mono tvz-focus-ring"
                        style={{ padding: '0.55rem 0.9rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory-muted)', cursor: 'pointer', fontSize: '0.56rem' }}
                      >
                        Lock Console
                      </button>
                    </div>

                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                      {['ALL', ...REQUEST_STATUSES].map((st) => (
                        <button
                          key={st}
                          type="button"
                          onClick={() => setStatusFilter(st)}
                          className="tvz-mono tvz-focus-ring"
                          style={{
                            padding: '0.45rem 0.7rem',
                            fontSize: '0.54rem',
                            cursor: 'pointer',
                            border: '1px solid var(--tvz-border-champagne)',
                            backgroundColor: statusFilter === st ? 'var(--tvz-color-champagne)' : 'transparent',
                            color: statusFilter === st ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory-secondary)'
                          }}
                        >
                          {st}
                        </button>
                      ))}
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem', alignItems: 'start' }}>
                      <div style={{ display: 'grid', gap: '0.75rem' }}>
                        {filteredOpsRequests.map((req) => (
                          <button
                            key={req.requestId}
                            type="button"
                            onClick={() => setSelectedRequestId(req.requestId)}
                            className="tvz-monolith-card tvz-focus-ring"
                            style={{
                              padding: '1.25rem',
                              textAlign: 'left',
                              cursor: 'pointer',
                              borderColor: activeRequest && activeRequest.requestId === req.requestId ? 'var(--tvz-color-champagne)' : undefined
                            }}
                          >
                            <div style={{ display: 'flex', justifyContent: 'space-between', gap: '0.5rem' }}>
                              <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>{req.requestId}</span>
                              <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne-light)', fontSize: '0.54rem' }}>{req.status}</span>
                            </div>
                            <div style={{ color: 'var(--tvz-color-ivory)', fontSize: '0.92rem', margin: '0.35rem 0' }}>{req.productNeed}</div>
                            <div style={{ fontSize: '0.78rem', color: 'var(--tvz-color-ivory-muted)' }}>
                              {req.direction.split('—')[0].trim()} • Budget: {req.budgetRange}
                            </div>
                          </button>
                        ))}
                      </div>

                      {activeRequest && (
                        <div className="tvz-monolith-card" style={{ padding: '1.85rem', display: 'grid', gap: '1rem' }}>
                          <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                            Managing {activeRequest.requestId} • Internal Record
                          </div>

                          <div style={{ fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)', padding: '0.85rem', border: '1px solid var(--tvz-border-hairline)' }}>
                            <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Customer:</strong> {activeRequest.customerName} ({activeRequest.customerContact})</div>
                            <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Consent Verified:</strong> {activeRequest.consentGiven ? 'Yes (Explicit Opt-In)' : 'No'}</div>
                            <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Need:</strong> {activeRequest.productNeed}</div>
                            <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Budget &amp; Timeline:</strong> {activeRequest.budgetRange} • {activeRequest.urgency}</div>
                          </div>

                          <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                            <span>Request Status</span>
                            <select
                              value={activeRequest.status}
                              onChange={(e) => handleUpdateRequestOps(activeRequest.requestId, { status: e.target.value })}
                              style={{ padding: '0.65rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}

    function GatewayPortalTemplate() {
      const [email, setEmail] = useState('');
      const [track, setTrack] = useState('Institutional Dispatch');
      const [statusMsg, setStatusMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email.trim()) return;
        try {
          window.localStorage.setItem(
            'tovenza_gateway_dispatch_preview',
            JSON.stringify({ email: email.trim(), track, recordedAt: new Date().toISOString() })
          );
        } catch {}
        setStatusMsg(`Recorded locally in preview storage for ${email.trim()} (${track}).`);
        setEmail('');
      };

      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Route 20 • Institutional Gateway"
            title="Dispatches & Level 2 Workspace Preview"

            <form onSubmit={handleSubmit} className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '1rem' }}>
              <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Institutional Dispatch Registration</div>
              <label style={{ display: 'grid', gap: '0.4rem', fontSize: '0.85rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                <span>Inquiry Track</span>
                <select
                  value={track}
                  onChange={(e) => setTrack(e.target.value)}
                  style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                >
                  <option value="Institutional Dispatch">Institutional Dispatch</option>
                  <option value="TOVENZA Retail Discovery Pilot">TOVENZA Retail Discovery Pilot</option>
                  <option value="Strategic Horizon Dialogue">Strategic Horizon Dialogue</option>
                  <option value="Level 2 Workspace Pilot">Level 2 Workspace Pilot</option>
                </select>
              </label>
              <label style={{ display: 'grid', gap: '0.4rem', fontSize: '0.85rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                <span>Email Address</span>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@institution.org"
                  style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
                />
              </label>
              <button
                type="submit"
                className="tvz-mono tvz-focus-ring"
                style={{ padding: '0.85rem 1.25rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
              >
                Record Dispatch Interest
              </button>
              <p style={{ fontSize: '0.78rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>

              {statusMsg && (
                <p role="status" style={{ fontSize: '0.84rem', color: 'var(--tvz-color-champagne-light)', margin: 0 }}>{statusMsg}</p>

            <div className="tvz-monolith-card" style={{ padding: '2rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
              <div>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Ecosystem Progression</div>

    function normalizePathname(rawPath) {
      if (!rawPath || rawPath === '') return '/';
      return rawPath.replace(/\/+$/, '') || '/';
    }

    function App() {
      const [currentPath, setCurrentPath] = useState(() => {
        if (window.location.protocol === 'blob:' || window.location.origin === 'null') return '/';
        return normalizePathname(window.location.pathname);
      });

      const navigate = useCallback((to) => {
        const nextPath = normalizePathname(to);
        if (
          window.location.protocol !== 'blob:' &&
          window.location.origin !== 'null' &&
          window.location.pathname !== nextPath
        ) {
          try {
            window.history.pushState({}, '', nextPath);
          } catch {}
        }
        setCurrentPath(nextPath);
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch {}
      }, []);

      useEffect(() => {
        if (window.location.protocol === 'blob:') return;
        const handlePopState = () => setCurrentPath(normalizePathname(window.location.pathname));
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const matchedRoute = ROUTE_REGISTRY.find((r) => r.path === currentPath);

      useEffect(() => {
        if (!matchedRoute || matchedRoute.path === '/') {
          document.title = 'TOVENZA — Global Institutional Group';
        } else if (matchedRoute.path === '/foundations/sovereign-identity') {
          document.title = 'Sovereign Identity (Foundation I) — TOVENZA';
        } else if (matchedRoute.path === '/foundations/architectural-authority') {
          document.title = 'Architectural Authority (Foundation II) — TOVENZA';
        } else if (matchedRoute.path === '/foundations/financial-sophistication') {
          document.title = 'Financial Sophistication (Foundation III) — TOVENZA';
        } else if (matchedRoute.path === '/foundations/global-ecosystem') {
          document.title = 'Global Ecosystem (Foundation IV) — TOVENZA';
        } else if (matchedRoute.path === '/horizons/retail') {
          document.title = 'TOVENZA Product Discovery & Buying Assistance — TOVENZA';
        } else if (matchedRoute.path === '/horizons/education-learning') {
          document.title = 'TOVENZA Learning Pathway (Education & Learning) — TOVENZA';
        } else if (matchedRoute.path === '/horizons/astrology-jyotish') {
          document.title = 'TOVENZA Personal Jyotish Analysis — TOVENZA';
        } else {
          document.title = `${matchedRoute.title} — TOVENZA`;
        }
      }, [matchedRoute]);

      let activeView = null;
      if (!matchedRoute || matchedRoute.path === '/') {
        activeView = <HomeFlagshipTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/institution') {
        activeView = <EditorialEssayTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/sovereign-identity') {
        activeView = <SovereignIdentityTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/architectural-authority') {
        activeView = <ArchitecturalAuthorityTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/financial-sophistication') {
        activeView = <FinancialSophisticationTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/foundations/global-ecosystem') {
        activeView = <GlobalEcosystemTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/horizons/retail') {
        activeView = <RetailHorizonTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/horizons/education-learning') {
        activeView = <EducationLearningTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/horizons/astrology-jyotish') {
        activeView = <AstrologyJyotishTemplate onNavigate={navigate} />;
      } else if (matchedRoute.group === 'foundations') {
        activeView = <FoundationDetailTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.group === 'horizons') {
        activeView = <HorizonBlueprintTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.path === '/capabilities') {
        activeView = <CapabilityFrameworkTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/governance') {
        activeView = <GovernanceLedgerTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/gateway') {
        activeView = <GatewayPortalTemplate />;
      } else if (matchedRoute.path === '/legal') {
        activeView = <LegalDocumentTemplate />;
      }

      return (
        <InstitutionalErrorBoundary>
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', backgroundColor: 'var(--tvz-color-obsidian)', color: 'var(--tvz-color-ivory)' }}>
            <InstitutionalHeader currentPath={matchedRoute ? matchedRoute.path : '/'} onNavigate={navigate} />
            <main style={{ flex: 1 }}>{activeView}</main>
            <InstitutionalFooter onNavigate={navigate} />
          </div>
        </InstitutionalErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
