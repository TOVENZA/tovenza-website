    name="description"
    content="TOVENZA — Global Institutional Group. Beyond Business. Built to Endure. Obsidian Sovereignty across Four Permanent Foundations and Eleven Strategic Horizons."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"

  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { Component, useState, useEffect, useCallback } = React;

    /* ==========================================================================
       0A. OBSIDIAN SOVEREIGNTY DESIGN TOKENS
       ========================================================================== */
    const OBSIDIAN_SOVEREIGNTY_CSS = `
:root {
  --tvz-color-obsidian: #080909;
  --tvz-color-obsidian-deep: #050606;
  --tvz-color-basalt: #202321;
  --tvz-color-basalt-elevated: #282c29;
  --tvz-color-champagne: #B99D6B;
  --tvz-color-champagne-light: #D1B98A;
  --tvz-color-champagne-muted: rgba(185, 157, 107, 0.28);
  --tvz-color-ivory: #E9E4D9;
  --tvz-color-ivory-secondary: #B8B2A6;
  --tvz-color-ivory-muted: #868177;

  --tvz-border-hairline: rgba(233, 228, 217, 0.12);
  --tvz-border-champagne: rgba(185, 157, 107, 0.36);
  --tvz-surface-glass: rgba(32, 35, 33, 0.42);

  --tvz-font-display: 'Cormorant Garamond', Georgia, serif;
  --tvz-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --tvz-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

  --tvz-text-hero: clamp(2.5rem, 6vw, 5.25rem);
  --tvz-text-h1: clamp(2.1rem, 4.5vw, 4rem);
  --tvz-text-h2: clamp(1.65rem, 3vw, 2.75rem);
  --tvz-text-h3: clamp(1.3rem, 2vw, 1.85rem);
  --tvz-text-body: clamp(0.95rem, 1.05vw, 1.0625rem);
  --tvz-text-micro: 0.6875rem;

  --tvz-container-max: 1360px;
  --tvz-gutter-x: clamp(1.25rem, 4vw, 3.5rem);
  --tvz-section-py: clamp(4.25rem, 8vw, 7.5rem);
  --tvz-header-height: 5rem;

  --tvz-ease-architectural: cubic-bezier(0.22, 1, 0.36, 1);
  --tvz-duration-base: 320ms;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background-color: var(--tvz-color-obsidian);
  color: var(--tvz-color-ivory);
  font-family: var(--tvz-font-sans);
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.tvz-container {
  width: 100%;
  max-width: var(--tvz-container-max);
  margin-inline: auto;
  padding-inline: var(--tvz-gutter-x);
}

.tvz-display {
  font-family: var(--tvz-font-display);
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.05;
}

.tvz-mono {
  font-family: var(--tvz-font-mono);
  font-size: var(--tvz-text-micro);
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

.tvz-hairline-t {
  border-top: 1px solid var(--tvz-border-hairline);
}

.tvz-hairline-b {
  border-bottom: 1px solid var(--tvz-border-hairline);
}

.tvz-monolith-card {
  background: linear-gradient(180deg, rgba(32, 35, 33, 0.48) 0%, rgba(8, 9, 9, 0.94) 100%);
  border: 1px solid var(--tvz-border-hairline);
  transition: border-color var(--tvz-duration-base) var(--tvz-ease-architectural),
              background-color var(--tvz-duration-base) var(--tvz-ease-architectural);
}

.tvz-monolith-card:hover {
  border-color: var(--tvz-border-champagne);
}

.tvz-focus-ring:focus-visible {
  outline: 1px solid var(--tvz-color-champagne);
  outline-offset: 3px;
}

@media (max-width: 1023px) {
  .tvz-desktop-nav { display: none !important; }
}
@media (min-width: 1024px) {
  .tvz-mobile-toggle { display: none !important; }
}
`;

    /* ==========================================================================
       0B. INSTITUTIONAL METADATA, FOUNDATIONS & ELEVEN HORIZONS
       ========================================================================== */
    const INSTITUTION_META = Object.freeze({
      name: 'TOVENZA',
      identity: 'Global Institutional Group',
      statement: 'Beyond Business. Built to Endure.',
      creativeDirection: 'Obsidian Sovereignty',
      originMandate: 'India-Origin Global Institutional Group',
      currentStage: 'Pre-Operational Institutional Architecture & Pilot Preview',
      governanceDisclosure:
        'TOVENZA presents its Four Foundations and Eleven Strategic Horizons as a long-term institutional architecture. Individual horizons carry explicit lifecycle designations distinguishing research and thesis development from active operations.'
    });

    const FOUR_FOUNDATIONS = Object.freeze([
      {
        id: 'sovereign-identity',
        numeral: 'I',
        path: '/foundations/sovereign-identity',
        title: 'Sovereign Identity',
        subtitle: 'Philosophical Independence & Brand Permanence',
        thesis:
          'Establishes institutional independence, unmistakable aesthetic restraint, ethical consent-first stewardship, and long-horizon ownership principles across every venture.',
        principles: [
          'Uncompromising editorial and architectural coherence under Obsidian Sovereignty',
          'Independence from short-term market noise and opportunistic dilution',
          'Centralized brand equity and intellectual property stewardship across branches'
        ]
      },
      {
        id: 'architectural-authority',
        numeral: 'II',
        path: '/foundations/architectural-authority',
        title: 'Architectural Authority',
        subtitle: 'Governance, Operating Models & Accountability',
        thesis:
          'Codifies clear decision gates, modular organisational structures, and repeatable operating standards before scaling complexity.',
        principles: [
          'Stage-Gate validation prior to capital or operational expansion',
          'Unified digital infrastructure built on reusable architectural templates',
          'Transparent separation between research, development, and live operations'
        ]
      },
      {
        id: 'financial-sophistication',
        numeral: 'III',
        path: '/foundations/financial-sophistication',
        title: 'Financial Sophistication',
        subtitle: 'Capital Discipline & Downside Resilience',
        thesis:
          'Governs capital allocation through explicit stress-testing, liquidity floors, and risk-adjusted unit economics.',
        principles: [
          'Downside protection and cash-runway verification before commitment',
          'Phased capital deployment matched to validated operational maturity',
          'Transparent, inspectable financial modeling free of speculative claims'
        ]
      },
      {
        id: 'global-ecosystem',
        numeral: 'IV',
        path: '/foundations/global-ecosystem',
        title: 'Global Ecosystem',
        subtitle: 'Cross-Border Connectivity & Strategic Alliances',
        thesis:
          'Connects multi-market opportunities, institutional partnerships, and cross-industry capabilities within a disciplined governance perimeter.',
        principles: [
          'Jurisdiction-aware expansion aligned with local regulatory compliance',
          'Interconnected value creation across human capital, technology, and advisory',
          'Enduring institutional partnerships vetted for alignment and rigor'
        ]
      }
    ]);

    const ELEVEN_HORIZONS = Object.freeze([
      {
        index: '01',
        slug: 'human-capital',
        path: '/horizons/human-capital',
        title: 'Recruitment & HR / Human Capital',
        branchName: 'TOVENZA CAREER (Inaugural Initiative)',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['sovereign-identity', 'global-ecosystem'],
        priorityTier: 'Near-Term',
        lifecycleStatus: 'In Development',
        summary: 'Structured compensation benchmarking, offer evaluation architecture, and consent-first talent intelligence.'
      },
      {
        index: '02',
        slug: 'healthcare-diagnostics',
        path: '/horizons/healthcare-diagnostics',
        title: 'Healthcare & Diagnostics',
        primaryFoundation: 'financial-sophistication',
        secondaryFoundations: ['architectural-authority', 'global-ecosystem'],
        priorityTier: 'Long-Term',

      },
      {
        index: '03',
        slug: 'hospitality',
        path: '/horizons/hospitality',
        title: 'Hospitality',
        primaryFoundation: 'sovereign-identity',
        secondaryFoundations: ['financial-sophistication', 'global-ecosystem'],

      },
      {
        index: '04',
        slug: 'real-estate-property',
        path: '/horizons/real-estate-property',
        title: 'Real Estate & Property',
        primaryFoundation: 'financial-sophistication',
        secondaryFoundations: ['architectural-authority', 'sovereign-identity'],
        priorityTier: 'Long-Term',
        lifecycleStatus: 'Research',
        summary: 'Delhi NCR & Horizon 01 architectural walkthroughs, space inspection, and long-duration physical asset stewardship.'
      },
      {
        index: '05',
        slug: 'technology-ai-software',
        path: '/horizons/technology-ai-software',
        title: 'Technology, AI & Software',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['global-ecosystem', 'financial-sophistication'],
        priorityTier: 'Near-Term',
        lifecycleStatus: 'In Development',
        summary: 'Deterministic decision instruments, human-in-the-loop AI workflows, and modular institutional software systems.'
      },
      {
        index: '06',
        slug: 'business-consulting',
        path: '/horizons/business-consulting',
        title: 'Business Consulting',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['sovereign-identity', 'financial-sophistication'],
        priorityTier: 'Near-Term',
        lifecycleStatus: 'In Development',
        summary: 'Structured operator clinics, cash-runway diagnostics, and organisational execution frameworks.'
      },
      {
        index: '07',
        slug: 'psychology-wellbeing',
        path: '/horizons/psychology-wellbeing',
        title: 'Psychology & Wellbeing',
        primaryFoundation: 'sovereign-identity',
        secondaryFoundations: ['architectural-authority', 'global-ecosystem'],
        priorityTier: 'Medium-Term',
        lifecycleStatus: 'Strategic Thesis',
        summary: 'Behavioral clarity, cognitive resilience, and non-clinical performance frameworks.'
      },
      {
        index: '08',
        slug: 'astrology-jyotish',
        path: '/horizons/astrology-jyotish',
        title: 'Astrology & Jyotish Sciences',
        primaryFoundation: 'sovereign-identity',
        secondaryFoundations: ['global-ecosystem'],
        priorityTier: 'Medium-Term',
        lifecycleStatus: 'In Development',
        summary: 'Ancient wisdom, structured interpretation, and informed reflection with explicit non-claim boundaries.'
      },
      {
        index: '09',
        slug: 'education-learning',
        path: '/horizons/education-learning',
        title: 'Education & Learning',
        primaryFoundation: 'architectural-authority',
        secondaryFoundations: ['sovereign-identity', 'global-ecosystem'],
        priorityTier: 'Medium-Term',
        lifecycleStatus: 'Strategic Thesis',
        summary: 'From learning to real capability — personalized learning pathways, milestones, and demonstrable skill building.'
      },
      {
        index: '10',
        slug: 'retail',
        path: '/horizons/retail',

        priorityTier: 'Long-Term',

        summary: 'Product discovery, buying assistance, transparent product comparisons, and request tracking.'
      },
      {
        index: '11',
        slug: 'future-industries',
        path: '/horizons/future-industries',
        title: 'Future Industries',
        primaryFoundation: 'global-ecosystem',
        secondaryFoundations: ['financial-sophistication', 'architectural-authority'],
        priorityTier: 'Long-Term',
        lifecycleStatus: 'Research',
        summary: 'Long-horizon frontier research observatory evaluating emerging industrial shifts.'
      }
    ]);

    const CAPABILITY_SYSTEMS_CHARTER = Object.freeze({
      ratified: false,
      statusLabel: 'Pending Founder Ratification — Six Capability Systems Charter',
      notice:
        'The final names, definitions, and operational scope of the Six Institutional Capability Systems remain under founder review and are intentionally not fabricated.',
      evaluationDimensions: [
        'Institutional Purpose & Cross-Horizon Mandate',
        'Core Operational Functions & Boundaries',
        'Dependencies Across the Four Locked Foundations',
        'Digital Application & Workspace Integration',
        'Governance Controls, Compliance & Audit Trails'
      ]
    });

    const ROUTE_REGISTRY = Object.freeze([
      { index: '01', path: '/', group: 'core', title: 'Homepage', template: 'HomeFlagshipTemplate' },
      { index: '02', path: '/institution', group: 'core', title: 'The Institution', template: 'EditorialEssayTemplate' },
      ...FOUR_FOUNDATIONS.map((f, idx) => ({
        index: String(idx + 3).padStart(2, '0'),
        path: f.path,
        group: 'foundations',
        title: f.title,
        template: 'FoundationDetailTemplate',
        slug: f.id
      })),
      ...ELEVEN_HORIZONS.map((h, idx) => ({
        index: String(idx + 7).padStart(2, '0'),
        path: h.path,
        group: 'horizons',
        title: h.title,
        template: 'HorizonBlueprintTemplate',
        slug: h.slug
      })),
      { index: '18', path: '/capabilities', group: 'control', title: 'Six Capability Systems', template: 'CapabilityFrameworkTemplate' },
      { index: '19', path: '/governance', group: 'control', title: 'Institutional Governance', template: 'GovernanceLedgerTemplate' },
      { index: '20', path: '/gateway', group: 'control', title: 'Institutional Gateway', template: 'GatewayPortalTemplate' },
      { index: '21', path: '/legal', group: 'control', title: 'Legal & Disclosures', template: 'LegalDocumentTemplate' }
    ]);

    /* ==========================================================================
       1. ERROR BOUNDARY & SHARED UI PRIMITIVES
       ========================================================================== */
    class InstitutionalErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }

      static getDerivedStateFromError() {
        return { hasError: true };
      }

      render() {
        if (this.state.hasError) {
          return (
            <main className="tvz-container" style={{ paddingBlock: '6rem' }}>
              <div className="tvz-monolith-card" style={{ padding: '2.5rem' }}>
                <p className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>
                  Institutional Fallback Interface
                </p>
                <h1 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', marginTop: '0.75rem' }}>
                  A visual module encountered an interruption.
                </h1>
                <p style={{ color: 'var(--tvz-color-ivory-secondary)', maxWidth: '58ch' }}>
                  Core institutional navigation and registry records remain accessible. Reload the view to reinitialize spatial modules.
                </p>
              </div>
            </main>
          );
        }
        return this.props.children;
      }
    }

    function TovenzaCrest({ width = 28, height = 34 }) {
      return (
        <svg width={width} height={height} viewBox="0 0 96 120" fill="none" aria-hidden="true">
          <rect x="12" y="10" width="72" height="100" stroke="#B99D6B" strokeWidth="1.4" />
          <line x1="48" y1="24" x2="48" y2="96" stroke="#B99D6B" strokeWidth="1.6" />
          <line x1="30" y1="36" x2="66" y2="36" stroke="#B99D6B" strokeWidth="1.6" />
          <circle cx="48" cy="60" r="11" stroke="#B99D6B" strokeWidth="1.1" />
        </svg>
      );
    }

    function InstitutionalLink({ to, onNavigate, className = '', style = {}, children, ...rest }) {
      const isBlobPreview =
        typeof window !== 'undefined' &&
        (window.location.protocol === 'blob:' || window.location.origin === 'null');
      const safeHref = isBlobPreview ? `#${to}` : to;

      const handleClick = (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        onNavigate(to);
      };
      return (
        <a href={safeHref} onClick={handleClick} className={`tvz-focus-ring ${className}`.trim()} style={style} {...rest}>
          {children}
        </a>
      );
    }

    function LifecycleStatusBadge({ status }) {
      const isDev = status === 'In Development' || status === 'Active Pillar';
      const isThesis = status === 'Strategic Thesis';
      return (
        <span
          className="tvz-mono"
          style={{
            fontSize: '0.58rem',
            padding: '0.26rem 0.6rem',
            border: `1px solid ${isDev ? 'var(--tvz-color-champagne)' : 'var(--tvz-border-hairline)'}`,
            color: isDev
              ? 'var(--tvz-color-champagne-light)'
              : isThesis
              ? 'var(--tvz-color-ivory)'
              : 'var(--tvz-color-ivory-muted)',
            backgroundColor: isDev ? 'rgba(185, 157, 107, 0.08)' : 'transparent',
            whiteSpace: 'nowrap'
          }}
        >
          {status}
        </span>
      );
    }

    function SectionHeaderBlock({ indexLabel, title, subtitle }) {
      return (
        <div style={{ maxWidth: '48rem', marginBottom: '2.5rem' }}>
          <p className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', margin: 0 }}>
            {indexLabel}
          </p>
          <h1 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h1)', margin: '0.6rem 0 0' }}>
            {title}
          </h1>
          {subtitle && (
            <p style={{ fontSize: 'var(--tvz-text-body)', color: 'var(--tvz-color-ivory-secondary)', marginTop: '1.1rem', maxWidth: '62ch' }}>
              {subtitle}
            </p>
          )}
        </div>
      );
    }

    function InstitutionalNoticeBanner() {
      return (
        <div
          className="tvz-monolith-card"
          style={{
            padding: '1.25rem 1.5rem',
            marginTop: '3rem',
            display: 'flex',
            flexWrap: 'wrap',
            justifyContent: 'space-between',
            alignItems: 'center',
            gap: '1rem'
          }}
        >
          <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.6rem' }}>
            Governance Disclosure • Ambition Separated From Verified Operations
          </span>
          <span style={{ fontSize: '0.82rem', color: 'var(--tvz-color-ivory-muted)' }}>
            {INSTITUTION_META.currentStage}
          </span>
        </div>
      );
    }

    /* ==========================================================================
       2. GLOBAL HEADER & FOOTER
       ========================================================================== */
    function InstitutionalHeader({ currentPath, onNavigate }) {
      const [openMenu, setOpenMenu] = useState(null);
      const [mobileOpen, setMobileOpen] = useState(false);

      const navigateAndClose = (path) => {
        setOpenMenu(null);
        setMobileOpen(false);
        onNavigate(path);
      };

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') {
            setOpenMenu(null);
            setMobileOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      const isFoundationsActive = currentPath.startsWith('/foundations/');
      const isHorizonsActive = currentPath.startsWith('/horizons/');

      return (
        <header
          className="tvz-hairline-b"
          style={{
            position: 'sticky',
            top: 0,
            zIndex: 40,
            backgroundColor: 'rgba(8, 9, 9, 0.92)',
            backdropFilter: 'blur(14px)'
          }}
          onMouseLeave={() => setOpenMenu(null)}
        >
          <div
            className="tvz-container"
            style={{
              height: 'var(--tvz-header-height)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              gap: '1.5rem'
            }}
          >
            <InstitutionalLink
              to="/"
              onNavigate={navigateAndClose}
              style={{ display: 'flex', alignItems: 'center', gap: '0.85rem', textDecoration: 'none' }}
            >
              <TovenzaCrest width={28} height={34} />
              <div>
                <div className="tvz-display" style={{ fontSize: '1.45rem', letterSpacing: '0.22em', color: 'var(--tvz-color-ivory)' }}>
                  {INSTITUTION_META.name}
                </div>
                <div className="tvz-mono" style={{ fontSize: '0.55rem', color: 'var(--tvz-color-champagne)' }}>
                  {INSTITUTION_META.identity}
                </div>
              </div>
            </InstitutionalLink>

            <nav aria-label="Global Institutional Navigation" className="tvz-desktop-nav" style={{ display: 'flex', alignItems: 'center', gap: '1.4rem' }}>
              <InstitutionalLink
                to="/institution"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  color: currentPath === '/institution' ? 'var(--tvz-color-champagne)' : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Institution
              </InstitutionalLink>

              <button
                type="button"
                onClick={() => setOpenMenu(openMenu === 'foundations' ? null : 'foundations')}
                onMouseEnter={() => setOpenMenu('foundations')}
                aria-expanded={openMenu === 'foundations'}
                className="tvz-mono tvz-focus-ring"
                style={{
                  background: 'none',
                  border: 'none',
                  padding: 0,
                  cursor: 'pointer',
                  color: isFoundationsActive || openMenu === 'foundations'
                    ? 'var(--tvz-color-champagne)'
                    : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Foundations (04) ▾
              </button>

              <button
                type="button"
                onClick={() => setOpenMenu(openMenu === 'horizons' ? null : 'horizons')}
                onMouseEnter={() => setOpenMenu('horizons')}
                aria-expanded={openMenu === 'horizons'}
                className="tvz-mono tvz-focus-ring"
                style={{
                  background: 'none',
                  border: 'none',
                  padding: 0,
                  cursor: 'pointer',
                  color: isHorizonsActive || openMenu === 'horizons'
                    ? 'var(--tvz-color-champagne)'
                    : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Horizons (11) ▾
              </button>

              <InstitutionalLink
                to="/capabilities"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  color: currentPath === '/capabilities' ? 'var(--tvz-color-champagne)' : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Capabilities
              </InstitutionalLink>

              <InstitutionalLink
                to="/governance"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  color: currentPath === '/governance' ? 'var(--tvz-color-champagne)' : 'var(--tvz-color-ivory-secondary)'
                }}
              >
                Governance
              </InstitutionalLink>

              <InstitutionalLink
                to="/gateway"
                onNavigate={navigateAndClose}
                className="tvz-mono"
                style={{
                  textDecoration: 'none',
                  padding: '0.55rem 0.95rem',
                  border: '1px solid var(--tvz-border-champagne)',
                  color: currentPath === '/gateway' ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-champagne)',
                  backgroundColor: currentPath === '/gateway' ? 'var(--tvz-color-champagne)' : 'transparent'
                }}
              >
                Gateway
              </InstitutionalLink>
            </nav>

            <button
              type="button"
              className="tvz-mono tvz-mobile-toggle tvz-focus-ring"
              onClick={() => setMobileOpen(!mobileOpen)}

    function RealEstatePropertyTemplate() {
      const [encFilter, setEncFilter] = useState('all');
      const [gatewayOpen, setGatewayOpen] = useState(false);
      const [activeTourKey, setActiveTourKey] = useState('lutyens');
      const [activeRoomIdx, setActiveRoomIdx] = useState(0);
      const [autoWalk, setAutoWalk] = useState(true);
      const [walkPct, setWalkPct] = useState(0);
      const [cornerKey, setCornerKey] = useState('sw');
      const [tilt, setTilt] = useState({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });

      const [inqName, setInqName] = useState('');
      const [inqContact, setInqContact] = useState('');
      const [inqEnclave, setInqEnclave] = useState('Lutyens Delhi');
      const [inqStatus, setInqStatus] = useState('');

      const activeTour = HORIZON_04_TOURS[activeTourKey] || HORIZON_04_TOURS.lutyens;
      const activeRoom = activeTour.rooms[activeRoomIdx] || activeTour.rooms[0];

      const openTour = useCallback((key) => {
        setActiveTourKey(HORIZON_04_TOURS[key] ? key : 'lutyens');
        setActiveRoomIdx(0);
        setWalkPct(0);
        setCornerKey('sw');
        setTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
        setAutoWalk(true);
        setGatewayOpen(true);
      }, []);

      const closeTour = useCallback(() => {
        setGatewayOpen(false);
        setWalkPct(0);
        setTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      }, []);

      useEffect(() => {
        if (!gatewayOpen) return undefined;
        const onKey = (e) => {
          if (e.key === 'Escape') closeTour();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [gatewayOpen, closeTour]);

      useEffect(() => {
        if (!gatewayOpen || !autoWalk) return undefined;
        const stopDurationMs = 5200;
        const tickMs = 80;
        let elapsed = 0;

        const timer = setInterval(() => {
          elapsed += tickMs;
          const pct = Math.min((elapsed / stopDurationMs) * 100, 100);
          setWalkPct(pct);
          if (elapsed >= stopDurationMs) {
            elapsed = 0;
            setWalkPct(0);
            setActiveRoomIdx((prev) => (prev + 1) % activeTour.rooms.length);
          }
        }, tickMs);

        return () => clearInterval(timer);
      }, [gatewayOpen, autoWalk, activeTour.rooms.length]);

      const handleRoomMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const rx = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        const ry = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
        const nx = (rx - 0.5) * 2;
        const ny = (ry - 0.5) * 2;
        setTilt({
          rx: Number((-ny * 4.2).toFixed(2)),
          ry: Number((nx * 5.5).toFixed(2)),
          ix: Number((-nx * 20).toFixed(1)),
          iy: Number((-ny * 14).toFixed(1)),
          scale: 1.14
        });
        setCornerKey(ry < 0.5 ? (rx < 0.5 ? 'nw' : 'ne') : rx < 0.5 ? 'sw' : 'se');
      };

      const handleRoomLeave = () => {
        setTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      };

      const handleRoomWheel = (e) => {
        if (Math.abs(e.deltaY) < 18 && Math.abs(e.deltaX) < 18) return;

      const filteredNcr =
        encFilter === 'all' ? DELHI_NCR_ESTATES : DELHI_NCR_ESTATES.filter((item) => item.enc === encFilter);

      const handleInquiry = (e) => {

          <section className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
            <div className="tvz-container">
              <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'flex-end', gap: '1rem', marginBottom: '2rem' }}>

            >
              <div className="tvz-container" style={{ display: 'grid', gap: '1.5rem' }}>
                <div className="tvz-hairline-b" style={{ paddingBottom: '1rem', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                  <div>
                    <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>{activeTour.enclave}</div>
                    <h2 className="tvz-display" style={{ fontSize: 'clamp(1.6rem, 3vw, 2.4rem)', margin: '0.25rem 0 0' }}>{activeTour.title}</h2>
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                    <button
                      type="button"
                      onClick={() => setAutoWalk((v) => !v)}
                      className="tvz-mono tvz-focus-ring"
                      style={{ padding: '0.45rem 0.8rem', cursor: 'pointer', fontSize: '0.54rem', border: '1px solid var(--tvz-border-champagne)', backgroundColor: 'transparent', color: 'var(--tvz-color-champagne-light)' }}
                    >
                      Auto-Walk: {autoWalk ? 'On' : 'Off'}
                    </button>
                    <button
                      type="button"
                      onClick={closeTour}
                      className="tvz-mono tvz-focus-ring"
                      style={{ padding: '0.45rem 0.85rem', cursor: 'pointer', fontSize: '0.54rem', border: '1px solid var(--tvz-border-hairline)', backgroundColor: 'transparent', color: 'var(--tvz-color-ivory)' }}
                    >
                      Exit Tour ×
                    </button>
                  </div>
                </div>

                <div className="tvz-monolith-card" style={{ padding: '0.85rem 1.15rem', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '0.75rem' }}>
                  <span className="tvz-mono" style={{ fontSize: '0.54rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    Move cursor across corners to look around or scroll wheel to step through every space
                  </span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', minWidth: '14rem' }}>
                    <span className="tvz-mono" style={{ fontSize: '0.56rem', color: 'var(--tvz-color-champagne)' }}>
                      SPACE {activeRoomIdx + 1} / {activeTour.rooms.length}
                    </span>
                    <div style={{ flex: 1, height: '3px', backgroundColor: 'rgba(233,228,217,0.15)' }}>
                      <div style={{ width: `${walkPct}%`, height: '100%', backgroundColor: 'var(--tvz-color-champagne)', transition: 'width 160ms linear' }} />
                    </div>
                  </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem', alignItems: 'start' }}>
                  <div
                    onMouseMove={handleRoomMove}
                    onMouseLeave={handleRoomLeave}
                    onWheel={handleRoomWheel}
                    style={{
                      position: 'relative',
                      aspectRatio: '16 / 10',
                      overflow: 'hidden',
                      border: '1px solid var(--tvz-border-champagne)',
                      backgroundColor: 'var(--tvz-color-obsidian-deep)',
                      transform: `perspective(1400px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`,
                      transition: 'transform 220ms ease-out'
                    }}
                  >
                    <img
                      src={activeRoom.img}
                      alt={activeRoom.name}
                      style={{
                        width: '100%',
                        height: '100%',
                        objectFit: 'cover',
                        transform: `scale(${tilt.scale}) translate(${tilt.ix}px, ${tilt.iy}px)`,
                        transition: 'transform 320ms ease-out',
                        display: 'block'
                      }}
                    />
                    <div className="tvz-mono" style={{ position: 'absolute', bottom: '0.85rem', left: '1rem', right: '1rem', fontSize: '0.54rem', color: 'var(--tvz-color-ivory)', backgroundColor: 'rgba(8,9,9,0.78)', padding: '0.4rem 0.7rem', display: 'flex', justifyContent: 'space-between', gap: '0.5rem' }}>
                      <span>You are standing in: {activeRoom.name}</span>
                      <span style={{ color: 'var(--tvz-color-champagne-light)' }}>{cornerKey.toUpperCase()}</span>

                  <div className="tvz-monolith-card" style={{ padding: '1.75rem', display: 'grid', gap: '0.85rem' }}>

                      </span>

    /* ==========================================================================
       4. SHARED INTERACTIVE WALKTHROUGH BUILDER FOR HORIZONS 01, 02, 03 & 05
       ========================================================================== */
    function HorizonWalkthroughSuite({
      badgeLabel,
      statusBadge,
      heading,
      lead,
      tracksSectionEyebrow,
      tracksSectionTitle,
      filterOptions,
      tracks,
      photos,
      inquiryEyebrow,
      inquiryTitle,
      inquiryOptions
    }) {
      const [selectedTrack, setSelectedTrack] = useState('all');
      const [walkOpen, setWalkOpen] = useState(false);
      const [activeTrackIdx, setActiveTrackIdx] = useState(0);
      const [activeStageIdx, setActiveStageIdx] = useState(0);
      const [autoWalk, setAutoWalk] = useState(true);
      const [walkProgress, setWalkProgress] = useState(0);
      const [focusedCorner, setFocusedCorner] = useState('sw');
      const [frameTilt, setFrameTilt] = useState({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });

      const [inqName, setInqName] = useState('');
      const [inqContact, setInqContact] = useState('');
      const [inqFocus, setInqFocus] = useState(inquiryOptions[0] || '');
      const [inqConsent, setInqConsent] = useState(false);
      const [inqStatus, setInqStatus] = useState('');

      const visibleTracks =
        selectedTrack === 'all' ? tracks : tracks.filter((t) => t.track === selectedTrack);
      const currentTrack = tracks[activeTrackIdx] || tracks[0];
      const currentStage = currentTrack.stages[activeStageIdx] || currentTrack.stages[0];
      const currentImg = photos[(activeTrackIdx * 3 + activeStageIdx) % photos.length];

      const openWalkthrough = useCallback(
        (trackId) => {
          const idx = Math.max(0, tracks.findIndex((t) => t.id === trackId));
          setActiveTrackIdx(idx);
          setActiveStageIdx(0);
          setWalkProgress(0);
          setFocusedCorner('sw');
          setFrameTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
          setAutoWalk(true);
          setWalkOpen(true);
        },
        [tracks]
      );

      const closeWalkthrough = useCallback(() => {
        setWalkOpen(false);
        setWalkProgress(0);
        setFrameTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      }, []);

      useEffect(() => {
        if (!walkOpen) return undefined;
        const onKey = (e) => {
          if (e.key === 'Escape') closeWalkthrough();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [walkOpen, closeWalkthrough]);

      useEffect(() => {
        if (!walkOpen || !autoWalk) return undefined;
        const stopDurationMs = 5200;
        const tickMs = 80;
        let elapsed = 0;

        const timer = setInterval(() => {
          elapsed += tickMs;
          const pct = Math.min((elapsed / stopDurationMs) * 100, 100);
          setWalkProgress(pct);
          if (elapsed >= stopDurationMs) {
            elapsed = 0;
            setWalkProgress(0);
            setActiveStageIdx((prev) => (prev + 1) % currentTrack.stages.length);
          }
        }, tickMs);

        return () => clearInterval(timer);
      }, [walkOpen, autoWalk, currentTrack.stages.length]);

      const handleStageMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const rx = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        const ry = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
        const nx = (rx - 0.5) * 2;
        const ny = (ry - 0.5) * 2;
        setFrameTilt({
          rx: Number((-ny * 4.2).toFixed(2)),
          ry: Number((nx * 5.5).toFixed(2)),
          ix: Number((-nx * 20).toFixed(1)),
          iy: Number((-ny * 14).toFixed(1)),
          scale: 1.13
        });
        setFocusedCorner(ry < 0.5 ? (rx < 0.5 ? 'nw' : 'ne') : rx < 0.5 ? 'sw' : 'se');
      };

      const handleStageLeave = () => {
        setFrameTilt({ rx: 0, ry: 0, ix: 0, iy: 0, scale: 1.06 });
      };

      const handleStageWheel = (e) => {
        if (Math.abs(e.deltaY) < 18 && Math.abs(e.deltaX) < 18) return;
        const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        const dir = delta > 0 ? 1 : -1;
        setWalkProgress(0);
        setActiveStageIdx((prev) => (prev + dir + currentTrack.stages.length) % currentTrack.stages.length);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!inqName.trim() || !inqContact.trim() || !inqConsent) {
          setInqStatus('Please complete your name, contact details, and consent checkbox.');
          return;
        }
        setInqStatus(`Thank you, ${inqName.trim()}. Your request for ${inqFocus} has been recorded with consent.`);
        setInqName('');
        setInqContact('');
        setInqConsent(false);
      };

      return (
        <article>
          <section className="tvz-container" style={{ paddingBlock: 'clamp(3.75rem, 7vw, 6rem)' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center', marginBottom: '1.1rem' }}>
              <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>{badgeLabel}</span>
              <LifecycleStatusBadge status={statusBadge} />
            </div>
            <h1 className="tvz-display" style={{ fontSize: 'var(--tvz-text-hero)', margin: '0 0 0.9rem' }}>{heading}</h1>
            <p style={{ fontSize: 'var(--tvz-text-body)', color: 'var(--tvz-color-ivory-secondary)', maxWidth: '62ch', margin: '0 0 1.65rem' }}>{lead}</p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem' }}>
              <button
                type="button"
                onClick={() => openWalkthrough(tracks[0].id)}
                className="tvz-mono tvz-focus-ring"
                style={{ padding: '0.85rem 1.35rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}
              >
                Enter Interactive Walkthrough →
              </button>
              <a
                href="#horizon-briefing-form"
                className="tvz-mono tvz-focus-ring"
                style={{ padding: '0.85rem 1.25rem', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-ivory)', textDecoration: 'none' }}
              >
                Request Briefing
              </a>

    function normalizePathname(rawPath) {
      if (!rawPath || rawPath === '') return '/';
      return rawPath.replace(/\/+$/, '') || '/';
    }

    function App() {
      const [currentPath, setCurrentPath] = useState(() => {
        if (typeof window === 'undefined') return '/';
        if (window.location.protocol === 'blob:' || window.location.origin === 'null') return '/';
        return normalizePathname(window.location.pathname);
      });

      const navigate = useCallback((to) => {
        const nextPath = normalizePathname(to);
        if (
          typeof window !== 'undefined' &&
          window.location.protocol !== 'blob:' &&
          window.location.origin !== 'null' &&
          window.location.pathname !== nextPath
        ) {
          try {
            window.history.pushState({}, '', nextPath);
          } catch {}
        }
        setCurrentPath(nextPath);
        if (typeof window !== 'undefined') {
          try {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } catch {}
        }
      }, []);

      useEffect(() => {
        if (typeof window === 'undefined' || window.location.protocol === 'blob:') return;
        const handlePopState = () => {
          setCurrentPath(normalizePathname(window.location.pathname));
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const matchedRoute = ROUTE_REGISTRY.find((r) => r.path === currentPath);

      useEffect(() => {
        if (typeof document === 'undefined') return;
        document.title = !matchedRoute || matchedRoute.path === '/'
          ? 'TOVENZA — Global Institutional Group'
          : `${matchedRoute.title} — TOVENZA`;
      }, [matchedRoute]);

      let activeView = null;
      if (!matchedRoute || matchedRoute.path === '/') {
        activeView = <HomeFlagshipTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/institution') {
        activeView = <EditorialEssayTemplate onNavigate={navigate} />;
      } else if (matchedRoute.group === 'foundations') {
        activeView = <FoundationDetailTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.path === '/horizons/human-capital') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 01 of 11 • Recruitment & HR / Human Capital"
            statusBadge="In Development"
            heading="Career Direction, Offer Clarity & Consent-First Hiring."
            lead="Walk through TOVENZA’s human-capital architecture for adults (18+) and employers—structured career clarity, transparent positioning, and fair role scorecards."
            tracksSectionEyebrow="Horizon 01 Tracks"
            tracksSectionTitle="Individual & Employer Pathways"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'career', label: 'Career & Offers (18+)' },
              { key: 'hiring', label: 'Hiring Calibration' }
            ]}
            tracks={HUMAN_CAPITAL_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Consent-First Briefing • Horizon 01"
            inquiryTitle="Connect on Human Capital Architecture"
            inquiryOptions={[
              'Intentional Career Direction & Offer Clarity',
              'Role Scorecards & Consent-First Hiring'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/healthcare-diagnostics') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 02 of 11 • Healthcare & Diagnostics"
            statusBadge="Research"
            heading="Diagnostic & Preventative Governance Research."
            lead="Explores how structured health information, diagnostic clarity, and clinical licensing guardrails fit TOVENZA’s long-term research horizon."
            tracksSectionEyebrow="Horizon 02 Tracks"
            tracksSectionTitle="Research & Governance Pathways"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'pathways', label: 'Pathways & Gates' }
            ]}
            tracks={HEALTHCARE_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Research Note • Horizon 02"
            inquiryTitle="Connect on Healthcare & Diagnostics Research"
            inquiryOptions={[
              'Preventative & Diagnostic Pathway Architecture'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/hospitality') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 03 of 11 • Hospitality"
            statusBadge="Research"
            heading="Hospitality Architecture & Calm Stewardship."
            lead="Walk through TOVENZA’s hospitality concepts—unhurried guest space, acoustic rest, and reliable service standards—with cursor-guided depth."
            tracksSectionEyebrow="Horizon 03 Tracks"
            tracksSectionTitle="Guest Sanctuary & Service Pathways"
            filterOptions={[

              { key: 'space', label: 'Guest Sanctuary' },
              { key: 'service', label: 'Service Craft' }
            ]}
            tracks={HOSPITALITY_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Research Note • Horizon 03"
            inquiryTitle="Connect on Hospitality Architecture"
            inquiryOptions={[
              'Calm Arrival, Proportion & Restorative Space',

            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/real-estate-property') {
        activeView = <RealEstatePropertyTemplate />;
      } else if (matchedRoute.path === '/horizons/technology-ai-software') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 05 of 11 • Technology, AI & Software"
            statusBadge="In Development"
            heading="Technology, AI & Software Architecture."
            lead="Walk through TOVENZA’s software and human-in-the-loop AI principles—structured intake, validation, clear states, and human accountability."
            tracksSectionEyebrow="Horizon 05 Tracks"
            tracksSectionTitle="Decision Systems & Human + AI"

            inquiryEyebrow="Research & Build Note • Horizon 05"
            inquiryTitle="Connect on Technology, AI & Software"
            inquiryOptions={[
              'Structured Decision & Intake Systems'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/astrology-jyotish') {
        activeView = <JyotishHorizonTemplate />;
      } else if (matchedRoute.path === '/horizons/education-learning') {
        activeView = <EducationHorizonTemplate />;
      } else if (matchedRoute.path === '/horizons/retail') {
        activeView = <RetailHorizonTemplate />;
      } else if (matchedRoute.group === 'horizons') {
        activeView = <HorizonBlueprintTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.path === '/capabilities') {
        activeView = <CapabilityFrameworkTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/governance') {
        activeView = <GovernanceLedgerTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/gateway') {
        activeView = <GatewayPortalTemplate />;
      } else if (matchedRoute.path === '/legal') {
        activeView = <LegalDocumentTemplate />;
      }

      return (
        <InstitutionalErrorBoundary>
          <style>{OBSIDIAN_SOVEREIGNTY_CSS}</style>
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', backgroundColor: 'var(--tvz-color-obsidian)', color: 'var(--tvz-color-ivory)' }}>
            <InstitutionalHeader currentPath={matchedRoute ? matchedRoute.path : '/'} onNavigate={navigate} />
            <main style={{ flex: 1 }}>{activeView}</main>
            <InstitutionalFooter onNavigate={navigate} />
          </div>
        </InstitutionalErrorBoundary>
      );
    }

    const rootEl = document.getElementById('root');
    if (rootEl) {
      ReactDOM.createRoot(rootEl).render(<App />);
    }
  </script>
</body>
</html>
