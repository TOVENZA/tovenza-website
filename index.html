      const [birthTimeConfidence, setBirthTimeConfidence] = useState('Exact (Verified record / certificate)');
      const [selectedService, setSelectedService] = useState(JYOTISH_SERVICE_OPTIONS[0]);
      const [selectedAreas, setSelectedAreas] = useState([JYOTISH_LIFE_AREAS[0]]);
      const [additionalContext, setAdditionalContext] = useState('');
      const [consentGiven, setConsentGiven] = useState(false);
      const [formError, setFormError] = useState('');
      const [submittedId, setSubmittedId] = useState('');
      const [submitting, setSubmitting] = useState(false);

      // Lookup & Follow-up State
      const [lookupInput, setLookupInput] = useState('');
      const [lookupMsg, setLookupMsg] = useState('');
      const [followUpText, setFollowUpText] = useState('');

      // Internal Delivery Console State
      const [unlocked, setUnlocked] = useState(false);
      const [passcode, setPasscode] = useState('');
      const [passcodeErr, setPasscodeErr] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');

      // Structured Report Builder State
      const [repOverview, setRepOverview] = useState('');
      const [repLagnaPlanets, setRepLagnaPlanets] = useState('');
      const [repDashaTransits, setRepDashaTransits] = useState('');
      const [repStrengthsChallenges, setRepStrengthsChallenges] = useState('');
      const [repLimitations, setRepLimitations] = useState(
        'Traditional interpretation for informed reflection only; not a scientific prediction or medical, legal, or financial advice.'
      );

      useEffect(() => {
        saveJyotishRequests(records);
      }, [records]);

      const activeRecord = useMemo(() => {
        if (!records.length) return null;
        return records.find((r) => r.requestId === selectedId) || records[0];
      }, [records, selectedId]);

      const toggleArea = (area) => {
        setSelectedAreas((prev) =>
          prev.includes(area) ? prev.filter((a) => a !== area) : [...prev, area]
        );
      };

      const handleCreateRequest = (e) => {
        e.preventDefault();
        setFormError('');
        if (submitting) return;

        const cleanName = customerName.trim();
        const cleanContact = customerContact.trim();
        const cleanDob = dateOfBirth.trim();
        const cleanPlace = birthPlace.trim();

        if (!cleanName || !cleanContact) {
          setFormError('Please provide your name and a contact reference (email or phone) so we can respond.');
          return;
        }
        if (!cleanDob || !cleanPlace) {
          setFormError('Please provide your date of birth and birthplace (city/region/country) for reference.');
          return;
        }
        if (!consentGiven) {
          setFormError('Please provide explicit consent to process your birth information for this service.');
          return;
        }

        const nowMs = Date.now();
        const isDuplicate = records.some((item) => {
          const sameContact = item.customerContact.trim().toLowerCase() === cleanContact.toLowerCase();
          const sameDob = item.dateOfBirth === cleanDob;
          return sameContact && sameDob && nowMs - new Date(item.createdAt).getTime() < 120000;
        });

        if (isDuplicate) {
          setFormError('Duplicate request detected within 2 minutes for the same contact and date of birth.');
          return;
        }

        setSubmitting(true);
        const newId = generateUniqueJyotishId(records);
        const createdAt = new Date().toISOString();
        const entry = {
          requestId: newId,
          createdAt,
          customerName: cleanName,
          customerContact: cleanContact,
          dateOfBirth: cleanDob,
          birthTime: birthTime.trim() || 'Not provided',
          birthPlace: cleanPlace,
          birthTimeConfidence,
          selectedService,
          areasOfInterest: selectedAreas.length ? selectedAreas : ['General Birth-Chart & Nakshatra Overview'],
          additionalContext: additionalContext.trim() || 'None',
          consentGiven: true,
          status: 'New Request',
          methodologyVersion: 'Proposed Default: Vedic Sidereal • Lahiri Ayanamsha • Drik Panchang (Pending Founder Ratification)',
          calculationRecord: '',
          interpretationNotes: '',
          qualityChecklistPassed: false,
          reportDraft: null,
          followUps: [
            {
              id: `FUP-${nowMs}`,
              sender: 'TOVENZA Jyotish Pilot',
              createdAt,
              text: `Request ${newId} logged with birth-time confidence "${birthTimeConfidence}". Free/scoped pilot — no live checkout or payment active.`
            }
          ]
        };

        setRecords((prev) => [entry, ...prev]);
        setSelectedId(newId);
        setSubmittedId(newId);
        setLookupInput(newId);
        setCustomerName('');
        setCustomerContact('');
        setDateOfBirth('');
        setBirthTime('');
        setBirthPlace('');
        setAdditionalContext('');
        setConsentGiven(false);
        setSubmitting(false);
      };

      const handleLookup = (e) => {
        e.preventDefault();
        const target = lookupInput.trim().toUpperCase();
        if (!target) return;
        const found = records.find((r) => r.requestId.toUpperCase() === target);
        if (found) {
          setSelectedId(found.requestId);
          setLookupMsg(`Request ${found.requestId} found • Status: ${found.status}.`);
        } else {
          setLookupMsg(`No record found for "${target}" in current browser storage.`);
        }
      };

      const handlePostFollowUp = (e) => {
        e.preventDefault();
        if (!activeRecord || !followUpText.trim()) return;
        const txt = followUpText.trim();
        const ts = new Date().toISOString();
        setRecords((prev) =>
          prev.map((r) =>
            r.requestId === activeRecord.requestId
              ? {
                  ...r,
                  status: r.status === 'Delivered' || r.status === 'Analysis Ready' ? 'Follow-up Requested' : r.status,
                  followUps: [
                    ...(r.followUps || []),
                    { id: `FUP-${Date.now()}`, sender: 'Customer Follow-Up', createdAt: ts, text: txt }
                  ]
                }
              : r
          )
        );
        setFollowUpText('');
      };

      const handleUnlock = (e) => {
        e.preventDefault();
        if (passcode.trim() === JYOTISH_CONSOLE_PASSCODE) {
          setUnlocked(true);
          setPasscodeErr('');
          setPasscode('');
        } else {
          setPasscodeErr('Invalid pilot passcode. Internal Jyotish delivery console remains locked.');
        }
      };

      const handleUpdateRecord = (requestId, patch) => {
        setRecords((prev) => prev.map((r) => (r.requestId === requestId ? { ...r, ...patch } : r)));
      };

      const handleSaveReport = (e) => {
        e.preventDefault();
        if (!activeRecord) return;
        const draft = {
          overview: repOverview.trim() || `Reflective analysis for ${activeRecord.selectedService} (${activeRecord.birthTimeConfidence}).`,
          lagnaAndPlanets: repLagnaPlanets.trim() || 'Attach verified ephemeris/calculation chart details before delivery.',
          dashaAndTransits: repDashaTransits.trim() || 'Timing context noted without deterministic predictions.',
          strengthsAndChallenges: repStrengthsChallenges.trim() || 'Balanced strengths and practical considerations noted for reflection.',
          limitationsAndUncertainty: repLimitations.trim()
        };

        handleUpdateRecord(activeRecord.requestId, {
          reportDraft: draft,
          status: 'Analysis Ready'
        });
        setRepOverview('');
        setRepLagnaPlanets('');
        setRepDashaTransits('');
        setRepStrengthsChallenges('');
      };

      const filteredRecords = useMemo(() => {
        if (statusFilter === 'ALL') return records;
        return records.filter((r) => r.status === statusFilter);
      }, [records, statusFilter]);

      return (
        <article aria-labelledby="jyotish-horizon-heading">
          {/* HERO & INSTITUTIONAL JYOTISH PHILOSOPHY */}
          <section className="tvz-container" style={{ paddingBlock: 'clamp(3.5rem, 6.5vw, 5.5rem)' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center', marginBottom: '1.1rem' }}>
              <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>
                Horizon 08 of 11 • TOVENZA Astrology &amp; Jyotish Sciences
              </span>
              <LifecycleStatusBadge status="In Development" />
              <span className="tvz-mono" style={{ fontSize: '0.56rem', color: 'var(--tvz-color-ivory-muted)' }}>
                SCOPED PILOT • NO FEAR-BASED CLAIMS OR LIVE CHECKOUT
              </span>
            </div>

            <h1 id="jyotish-horizon-heading" className="tvz-display" style={{ fontSize: 'var(--tvz-text-hero)', margin: '0 0 0.8rem' }}>
              TOVENZA Personal Jyotish Analysis
            </h1>
            <p className="tvz-display" style={{ fontSize: 'clamp(1.25rem, 2vw, 1.65rem)', fontStyle: 'italic', color: 'var(--tvz-color-champagne-light)', margin: '0 0 1.15rem' }}>
              “Ancient wisdom. Structured interpretation. Informed reflection.”
            </p>
            <p style={{ fontSize: 'var(--tvz-text-body)', color: 'var(--tvz-color-ivory-secondary)', maxWidth: '64ch', margin: '0 0 1.65rem' }}>
              Designed to make traditional Jyotish knowledge clearer, structured, and transparent—supporting informed personal reflection without fear-based selling, guaranteed predictions, or LLM-only astronomical calculations.
            </p>

            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.65rem' }}>
              <button
                type="button"
                onClick={() => setActiveTab('seeker')}
                className="tvz-mono tvz-focus-ring"
                style={{
                  padding: '0.8rem 1.25rem',
                  cursor: 'pointer',
                  border: '1px solid var(--tvz-border-champagne)',
                  backgroundColor: activeTab === 'seeker' ? 'var(--tvz-color-champagne)' : 'transparent',
                  color: activeTab === 'seeker' ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory)',
                  fontWeight: 500
                }}
              >
                Birth-Detail Request &amp; Analysis
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('delivery')}
                className="tvz-mono tvz-focus-ring"
                style={{
                  padding: '0.8rem 1.25rem',
                  cursor: 'pointer',
                  border: '1px solid var(--tvz-border-champagne)',
                  backgroundColor: activeTab === 'delivery' ? 'var(--tvz-color-champagne)' : 'transparent',
                  color: activeTab === 'delivery' ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-champagne-light)'
                }}
              >
                Internal Delivery Console ({records.length})
              </button>
            </div>
          </section>

              <div className="tvz-monolith-card" style={{ padding: '1.6rem' }}>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>
                  Proposed Default Methodology (Pending Founder Approval)
                </div>
                <h2 className="tvz-display" style={{ fontSize: '1.4rem', margin: '0.45rem 0' }}>
                  Vedic Sidereal • Lahiri &amp; Drik Panchang
                </h2>
                <p style={{ fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)', margin: 0 }}>
                  Proposed default conventions use Vedic sidereal zodiac with Lahiri Ayanamsha and Drik Panchang timing rules, clearly separated from other conventions and never mixed silently.
                </p>
              </div>

              <div className="tvz-monolith-card" style={{ padding: '1.6rem' }}>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>
                  Calculation &amp; AI Accountability Rule
                </div>
                <h2 className="tvz-display" style={{ fontSize: '1.4rem', margin: '0.45rem 0' }}>
                  Verified Calculation vs. Human Reflection
                </h2>
                <p style={{ fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)', margin: 0 }}>
                  An LLM is never used alone as an astronomical calculation engine. Planetary coordinates, houses, Nakshatras, and Dashas require a verified calculation engine/ephemeris plus human quality review.
                </p>
              </div>

              <div className="tvz-monolith-card" style={{ padding: '1.6rem' }}>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>
                  Birth-Time Confidence Handling
                </div>
                <h2 className="tvz-display" style={{ fontSize: '1.4rem', margin: '0.45rem 0' }}>
                  Exact, Approximate &amp; Unknown Times
                </h2>
                <p style={{ fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)', margin: 0 }}>
                  Approximate or unknown birth times constrain Ascendant/Lagna, house cusps, and divisional-chart precision—limitations are stated transparently rather than guessed.
                </p>
              </div>
            </div>
          </section>

          {activeTab === 'seeker' ? (
            <section className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
              <div className="tvz-container">
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(310px, 1fr))', gap: '1.75rem', alignItems: 'start' }}>
                  {/* CUSTOMER BIRTH-DETAIL REQUEST FORM */}
                  <form onSubmit={handleCreateRequest} className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '0.9rem' }} aria-label="Personal Jyotish Analysis Request Form">
                    <div>
                      <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                        Private Birth Information Intake • Consent Required
                      </span>
                      <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: '0.3rem 0 0.25rem' }}>
                        Request Personal Jyotish Analysis
                      </h2>
                      <p style={{ fontSize: '0.82rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>
                        Birth details are collected solely to prepare your requested analysis and are never published publicly.
                      </p>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '0.75rem' }}>
                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Your Name * <em style={{ color: 'var(--tvz-color-ivory-muted)', fontStyle: 'normal' }}>(for delivery record)</em></span>
                        <input type="text" required value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Full name" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                      </label>
                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Email or Phone * <em style={{ color: 'var(--tvz-color-ivory-muted)', fontStyle: 'normal' }}>(to send analysis)</em></span>
                        <input type="text" required value={customerContact} onChange={(e) => setCustomerContact(e.target.value)} placeholder="you@domain.com" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                      </label>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '0.75rem' }}>
                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Date of Birth * <em style={{ color: 'var(--tvz-color-ivory-muted)', fontStyle: 'normal' }}>(calculation date)</em></span>
                        <input type="date" required value={dateOfBirth} onChange={(e) => setDateOfBirth(e.target.value)} style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                      </label>
                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Birth Time <em style={{ color: 'var(--tvz-color-ivory-muted)', fontStyle: 'normal' }}>(if known)</em></span>
                        <input type="text" value={birthTime} onChange={(e) => setBirthTime(e.target.value)} placeholder="e.g., 09:15 IST" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                      </label>
                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Birthplace * <em style={{ color: 'var(--tvz-color-ivory-muted)', fontStyle: 'normal' }}>(city &amp; coordinates)</em></span>
                        <input type="text" required value={birthPlace} onChange={(e) => setBirthPlace(e.target.value)} placeholder="City, State, Country" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                      </label>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '0.75rem' }}>
                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Birth-Time Confidence</span>
                        <select value={birthTimeConfidence} onChange={(e) => setBirthTimeConfidence(e.target.value)} style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                          <option value="Exact (Verified record / certificate)">Exact (Verified record / certificate)</option>
                          <option value="Approximate (±15–30 mins)">Approximate (±15–30 mins)</option>
                          <option value="Rough / Unknown">Rough / Unknown</option>
                        </select>
                      </label>

                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Selected Service</span>
                        <select value={selectedService} onChange={(e) => setSelectedService(e.target.value)} style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                          {JYOTISH_SERVICE_OPTIONS.map((srv) => (
                            <option key={srv} value={srv}>{srv}</option>
                          ))}
                        </select>
                      </label>
                    </div>

                    <div style={{ display: 'grid', gap: '0.4rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                      <span>Areas of Interest</span>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.45rem' }}>
                        {JYOTISH_LIFE_AREAS.map((area) => {
                          const active = selectedAreas.includes(area);
                          return (
                            <button
                              key={area}
                              type="button"
                              onClick={() => toggleArea(area)}
                              className="tvz-mono tvz-focus-ring"
                              style={{
                                padding: '0.4rem 0.65rem',
                                fontSize: '0.53rem',
                                cursor: 'pointer',
                                border: '1px solid var(--tvz-border-champagne)',
                                backgroundColor: active ? 'var(--tvz-color-champagne)' : 'transparent',
                                color: active ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory-secondary)'
                              }}
                            >
                              {active ? '✓ ' : ''}{area}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                      <span>Additional Context (Optional)</span>
                      <textarea rows={2} value={additionalContext} onChange={(e) => setAdditionalContext(e.target.value)} placeholder="Questions or context you wish to reflect on (avoiding medical, legal, or investment directives)..." style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', resize: 'vertical' }} />
                    </label>

                    <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.55rem', fontSize: '0.79rem', color: 'var(--tvz-color-ivory-secondary)', cursor: 'pointer' }}>
                      <input type="checkbox" checked={consentGiven} onChange={(e) => setConsentGiven(e.target.checked)} style={{ marginTop: '0.2rem' }} />
                      <span>
                        I consent to TOVENZA processing my supplied birth details and contact information solely to prepare and deliver my requested Jyotish analysis under TOVENZA’s privacy terms.
                      </span>
                    </label>

                    {formError && (
                      <p role="alert" style={{ margin: 0, fontSize: '0.83rem', color: 'var(--tvz-color-champagne-light)' }}>
                        {formError}
                      </p>
                    )}

                    <button type="submit" disabled={submitting} className="tvz-mono tvz-focus-ring" style={{ padding: '0.88rem 1.3rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}>
                      {submitting ? 'Submitting Request...' : 'Submit Birth Details & Generate Request ID'}
                    </button>

                    {submittedId && (
                      <div role="status" className="tvz-hairline-t" style={{ paddingTop: '0.85rem' }}>
                        <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne-light)', fontSize: '0.58rem' }}>
                          Request Confirmed • Unique Request ID
                        </div>
                        <p style={{ margin: '0.3rem 0 0', fontSize: '0.86rem', color: 'var(--tvz-color-ivory)' }}>
                          Your Request ID is <strong style={{ color: 'var(--tvz-color-champagne-light)' }}>{submittedId}</strong>. Review status, analysis structure, and follow-up options on the right.
                        </p>
                      </div>
                    )}
                  </form>

                  {/* REQUEST LOOKUP, ANALYSIS VIEW & FOLLOW-UP */}
                  <div style={{ display: 'grid', gap: '1.25rem' }}>
                    <form onSubmit={handleLookup} className="tvz-monolith-card" style={{ padding: '1.5rem', display: 'grid', gap: '0.7rem' }}>
                      <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                        Track Request ID &amp; Analysis
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                        <input type="text" value={lookupInput} onChange={(e) => setLookupInput(e.target.value)} placeholder="Enter Request ID (e.g., TVZ-JYT-308114)" aria-label="Lookup Jyotish Request ID" style={{ flex: '1 1 200px', padding: '0.65rem 0.8rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                        <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.65rem 1rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne)', cursor: 'pointer', fontSize: '0.58rem' }}>
                          Open Request
                        </button>
                      </div>
                      {lookupMsg && (
                        <p role="status" style={{ margin: 0, fontSize: '0.8rem', color: 'var(--tvz-color-champagne-light)' }}>
                          {lookupMsg}
                        </p>
                      )}
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                        {records.slice(0, 4).map((r) => (
                          <button key={r.requestId} type="button" onClick={() => setSelectedId(r.requestId)} className="tvz-mono tvz-focus-ring" style={{ padding: '0.35rem 0.6rem', fontSize: '0.54rem', cursor: 'pointer', border: '1px solid var(--tvz-border-hairline)', backgroundColor: activeRecord && activeRecord.requestId === r.requestId ? 'rgba(185,157,107,0.14)' : 'transparent', color: 'var(--tvz-color-ivory-secondary)' }}>
                            {r.requestId} • {r.status}
                          </button>
                        ))}
                      </div>
                    </form>

                    {activeRecord && (
                      <div className="tvz-monolith-card" style={{ padding: '1.85rem', display: 'grid', gap: '1rem' }}>
                        <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '0.5rem' }}>

function generateUniqueEducationId(existingList = []) {
  const existingIds = new Set(existingList.map((item) => item.requestId));
  let candidate = '';
  let attempts = 0;
  do {
    const randomNum = Math.floor(100000 + Math.random() * 900000);
    candidate = `TVZ-EDU-${randomNum}`;
    attempts += 1;
  } while (existingIds.has(candidate) && attempts < 25);
  return candidate;
}

function loadEducationRequests() {
  try {
    const raw = window.localStorage.getItem(EDUCATION_STORAGE_KEY);
    if (!raw) return [...SEED_EDUCATION_REQUESTS];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0) return [...SEED_EDUCATION_REQUESTS];
    return parsed;
  } catch {
    return [...SEED_EDUCATION_REQUESTS];
  }
}

function saveEducationRequests(list) {
  try {
    window.localStorage.setItem(EDUCATION_STORAGE_KEY, JSON.stringify(list));
  } catch {}
}

  const [statusFilter, setStatusFilter] = useState('ALL');

  // Pathway Builder State in Admin Console
  const [pwObjective, setPwObjective] = useState('');
  const [pwCapability, setPwCapability] = useState('');
  const [pwModules, setPwModules] = useState('');
  const [pwExercises, setPwExercises] = useState('');
  const [pwAssignment, setPwAssignment] = useState('');
  const [pwMilestones, setPwMilestones] = useState('');
  const [pwCompletionCriteria, setPwCompletionCriteria] = useState('Practical assignment completed and reviewed against stated objective.');

  useEffect(() => {
    saveEducationRequests(records);
  }, [records]);

  const activeRecord = useMemo(() => {
    if (!records.length) return null;
    return records.find((r) => r.requestId === selectedId) || records[0];
  }, [records, selectedId]);

  const handleCreateRequest = (e) => {
    e.preventDefault();
    setErrorMsg('');
    if (submitting) return;

    const cleanName = customerName.trim();
    const cleanEmail = email.trim();
    const cleanGoal = learningGoal.trim();

    if (!cleanName || !cleanEmail || !cleanEmail.includes('@')) {
      setErrorMsg('Please enter your full name and a valid email address.');
      return;
    }
    if (!cleanGoal || cleanGoal.length < 10) {
      setErrorMsg('Please describe what you want to learn and achieve (at least 10 characters).');
      return;
    }
    if (ageEligibility === 'Under 18 (Guardian Required)' && !guardianConsentNote.trim()) {
      setErrorMsg('For under-18 requests, please provide parent/guardian contact & consent confirmation before submitting.');
      return;
    }
    if (!consentGiven) {
      setErrorMsg('Please confirm your privacy and service consent before submitting your learning request.');
      return;
    }

    const nowMs = Date.now();
    const isDuplicate = records.some((item) => {
      const sameEmail = item.email.trim().toLowerCase() === cleanEmail.toLowerCase();
      const sameGoal = item.learningGoal.trim().toLowerCase() === cleanGoal.toLowerCase();
      return sameEmail && sameGoal && nowMs - new Date(item.createdAt).getTime() < 120000;
    });

    if (isDuplicate) {
      setErrorMsg('Duplicate request detected within 2 minutes for the same email and learning goal.');
      return;
    }

    setSubmitting(true);
    const newId = generateUniqueEducationId(records);
    const createdAt = new Date().toISOString();
    const entry = {
      requestId: newId,
      createdAt,
      customerName: cleanName,
      email: cleanEmail,
      ageEligibility,
      guardianConsentNote: guardianConsentNote.trim() || 'Not applicable',
      cityCountry: cityCountry.trim() || 'Not specified',
      background: background.trim() || 'Not specified',
      learningArea,
      learningGoal: cleanGoal,
      currentLevel,
      availableTime,
      preferredFormat,
      budgetRange,
      additionalInfo: additionalInfo.trim() || 'None',
      consentGiven: true,
      status: 'New Request',
      assessmentNotes: '',
      learningPathway: null,
      feedbackNotes: '',
      serviceOutcome: 'Logged — Awaiting Review'
    };

    setRecords((prev) => [entry, ...prev]);
    setSelectedId(newId);
    setSubmittedId(newId);
    setLookupInput(newId);
    setCustomerName('');
    setEmail('');
    setGuardianConsentNote('');
    setCityCountry('');
    setBackground('');
    setLearningGoal('');
    setAdditionalInfo('');
    setConsentGiven(false);
    setSubmitting(false);
  };

  const handleLookup = (e) => {
    e.preventDefault();
    const target = lookupInput.trim().toUpperCase();
    if (!target) return;
    const match = records.find((r) => r.requestId.toUpperCase() === target);
    if (match) {
      setSelectedId(match.requestId);
      setLookupStatus(`Request ${match.requestId} found • Status: ${match.status}.`);
    } else {
      setLookupStatus(`No record found for "${target}" in current browser storage.`);
    }
  };

  const handleSubmitLearnerFeedback = (e) => {
    e.preventDefault();
    if (!activeRecord || !learnerFeedbackInput.trim()) return;
    const note = learnerFeedbackInput.trim();
    setRecords((prev) =>
      prev.map((r) =>
        r.requestId === activeRecord.requestId
          ? {
              ...r,
              feedbackNotes: r.feedbackNotes ? `${r.feedbackNotes} | ${note}` : note
            }
          : r
      )
    );
    setLearnerFeedbackInput('');
  };

  const handleAdminUnlock = (e) => {
    e.preventDefault();
    if (passcodeInput.trim() === EDUCATION_CONSOLE_PASSCODE) {
      setAdminUnlocked(true);
      setPasscodeError('');
      setPasscodeInput('');
    } else {
      setPasscodeError('Invalid pilot passcode. Internal education console remains locked.');
    }
  };

  const handleUpdateRecord = (requestId, patch) => {
    setRecords((prev) => prev.map((r) => (r.requestId === requestId ? { ...r, ...patch } : r)));
  };

  const handleSavePathway = (e) => {
    e.preventDefault();
    if (!activeRecord) return;
    const pathwayObj = {
      objective: pwObjective.trim() || activeRecord.learningGoal,
      expectedCapability: pwCapability.trim() || 'Demonstrable practical skill application in real scenarios.',
      startingLevel: activeRecord.currentLevel,
      modules: pwModules
        .split(',')
        .map((s) => s.trim())
        .filter(Boolean),
      resources: [
        { title: 'Verified Public / Open Learning Reference (Verify Access & Free/Paid Terms)', accessType: 'Verify Before Use', link: 'https://www.education.gov.in/' }
      ],
      practicalExercises: pwExercises
        .split(',')
        .map((s) => s.trim())
        .filter(Boolean),
      realWorldApplication: pwAssignment.trim() || 'Complete one applied task mapped to your learning goal.',
      timeEstimate: activeRecord.availableTime,
      milestones: pwMilestones
        .split(',')
        .map((s) => s.trim())
        .filter(Boolean),
      assessmentMethod: 'Practical output review and self-assessment checklist (non-accredited pilot).',
      completionCriteria: pwCompletionCriteria.trim() || 'Practical assignment completed and reviewed.',
      nextStep: 'Review progress and choose next capability step.'
    };

    handleUpdateRecord(activeRecord.requestId, {
      learningPathway: pathwayObj,
      status: 'Pathway Delivered'
    });
    setPwObjective('');
    setPwCapability('');
    setPwModules('');
    setPwExercises('');
    setPwAssignment('');
    setPwMilestones('');
  };

  const filteredRecords = useMemo(() => {
    if (statusFilter === 'ALL') return records;
    return records.filter((r) => r.status === statusFilter);
  }, [records, statusFilter]);

  return (
    <article aria-labelledby="education-horizon-heading">
      {/* HERO & CENTRAL PHILOSOPHY */}
      <section className="tvz-container" style={{ paddingBlock: 'clamp(3.5rem, 6.5vw, 5.5rem)' }}>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center', marginBottom: '1.1rem' }}>
          <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>
            Horizon 09 of 11 • TOVENZA Education &amp; Learning
          </span>
          <LifecycleStatusBadge status="In Development" />
          <span className="tvz-mono" style={{ fontSize: '0.56rem', color: 'var(--tvz-color-ivory-muted)' }}>
            FROM LEARNING TO REAL CAPABILITY • NON-ACCREDITED PILOT
          </span>
        </div>

        <h1 id="education-horizon-heading" className="tvz-display" style={{ fontSize: 'var(--tvz-text-hero)', margin: '0 0 0.8rem' }}>
          TOVENZA Learning Pathway
        </h1>
        <p className="tvz-display" style={{ fontSize: 'clamp(1.25rem, 2vw, 1.65rem)', fontStyle: 'italic', color: 'var(--tvz-color-champagne-light)', margin: '0 0 1.15rem' }}>
          “From learning to real capability.”
        </p>
        <p style={{ fontSize: 'var(--tvz-text-body)', color: 'var(--tvz-color-ivory-secondary)', maxWidth: '64ch', margin: '0 0 1.65rem' }}>
          Rather than selling passive course lists or unverified certificates, TOVENZA Education &amp; Learning helps individuals clarify what to learn, assess current knowledge and gaps, follow a structured pathway, practise through real-world assignments, and measure genuine capability.
        </p>

        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.65rem' }}>
          <button
            type="button"
            onClick={() => setActiveTab('learner')}
            className="tvz-mono tvz-focus-ring"
            style={{
              padding: '0.8rem 1.25rem',
              cursor: 'pointer',
              border: '1px solid var(--tvz-border-champagne)',
              backgroundColor: activeTab === 'learner' ? 'var(--tvz-color-champagne)' : 'transparent',
              color: activeTab === 'learner' ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory)',
              fontWeight: 500
            }}
          >
            Learner Request &amp; Pathway View
          </button>
          <button
            type="button"
            onClick={() => setActiveTab('admin')}
            className="tvz-mono tvz-focus-ring"
            style={{
              padding: '0.8rem 1.25rem',
              cursor: 'pointer',
              border: '1px solid var(--tvz-border-champagne)',
              backgroundColor: activeTab === 'admin' ? 'var(--tvz-color-champagne)' : 'transparent',
              color: activeTab === 'admin' ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-champagne-light)'
            }}
          >
            Internal Education Console ({records.length})
          </button>
        </div>
      </section>

      {/* 10-STEP CUSTOMER JOURNEY */}
      <section className="tvz-hairline-t" style={{ paddingBlock: '2.25rem' }}>
        <div className="tvz-container">
          <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '0.9rem' }}>
            10-Step Learning-to-Capability Customer Journey
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(145px, 1fr))', gap: '0.5rem' }}>
            {EDUCATION_JOURNEY_STAGES.map((step, idx) => (
              <div key={step} className="tvz-monolith-card" style={{ padding: '0.75rem 0.85rem' }}>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.54rem' }}>
                  0{idx + 1}
                </div>
                <div style={{ fontSize: '0.8rem', color: 'var(--tvz-color-ivory)', marginTop: '0.2rem' }}>
                  {step}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* 8 EXPLORABLE LEARNING AREAS */}
      <section className="tvz-hairline-t" style={{ paddingBlock: '2.5rem' }}>
        <div className="tvz-container">
          <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', marginBottom: '0.85rem' }}>
            Proposed Learning Areas (Subject to Validation)
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '0.65rem' }}>
            {EDUCATION_LEARNING_AREAS.map((area, i) => (
              <button
                key={area}
                type="button"
                onClick={() => {
                  setLearningArea(area);
                  setActiveTab('learner');
                }}
                className="tvz-monolith-card tvz-focus-ring"
                style={{ padding: '1rem', textAlign: 'left', cursor: 'pointer', color: 'var(--tvz-color-ivory)' }}
              >
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.54rem' }}>
                  Area 0{i + 1}
                </div>
                <div style={{ fontSize: '0.86rem', marginTop: '0.25rem' }}>{area}</div>
              </button>
            ))}
          </div>
        </div>
      </section>

      {activeTab === 'learner' ? (
        <section className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <div className="tvz-container">
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(310px, 1fr))', gap: '1.75rem', alignItems: 'start' }}>
              {/* LEARNER PATHWAY REQUEST FORM */}
              <form onSubmit={handleCreateRequest} className="tvz-monolith-card" style={{ padding: '2rem', display: 'grid', gap: '0.9rem' }} aria-label="TOVENZA Learning Pathway Request Form">
                <div>
                  <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                    Step 03–04 • Submit Learning Goal
                  </span>
                  <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: '0.3rem 0 0.25rem' }}>
                    Request a Learning Pathway
                  </h2>
                  <p style={{ fontSize: '0.82rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>
                    Only essential fields are collected. No guaranteed employment or accredited degree/certification is claimed.
                  </p>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '0.75rem' }}>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Full Name *</span>
                    <input type="text" required value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Your name" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                  </label>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Email Address *</span>
                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@domain.com" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                  </label>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '0.75rem' }}>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Age Eligibility / Band</span>
                    <select value={ageEligibility} onChange={(e) => setAgeEligibility(e.target.value)} style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                      <option value="18+ Adult Learner">18+ Adult Learner</option>
                      <option value="Under 18 (Guardian Required)">Under 18 (Guardian Required)</option>
                    </select>
                  </label>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>City &amp; Country</span>
                    <input type="text" value={cityCountry} onChange={(e) => setCityCountry(e.target.value)} placeholder="e.g., Bengaluru, India" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                  </label>
                </div>

                {ageEligibility === 'Under 18 (Guardian Required)' && (
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-champagne-light)' }}>
                    <span>Parent / Guardian Consent &amp; Contact Reference *</span>
                    <input type="text" value={guardianConsentNote} onChange={(e) => setGuardianConsentNote(e.target.value)} placeholder="Guardian name, relationship & consent confirmation" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-ivory)' }} />
                  </label>
                )}

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '0.75rem' }}>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Current Background</span>
                    <input type="text" value={background} onChange={(e) => setBackground(e.target.value)} placeholder="Student, fresher, working pro, founder..." style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                  </label>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Learning Area</span>
                    <select value={learningArea} onChange={(e) => setLearningArea(e.target.value)} style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                      {EDUCATION_LEARNING_AREAS.map((area) => (
                        <option key={area} value={area}>{area}</option>
                      ))}
                    </select>
                  </label>
                </div>

                <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                  <span>What Do You Want to Learn &amp; Achieve? *</span>
                  <textarea rows={2} required value={learningGoal} onChange={(e) => setLearningGoal(e.target.value)} placeholder="Explain your learning goal, why it matters now, and what practical capability you want..." style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', resize: 'vertical' }} />
                </label>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '0.75rem' }}>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Current Level</span>
                    <select value={currentLevel} onChange={(e) => setCurrentLevel(e.target.value)} style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                      <option value="Beginner / Exploring">Beginner / Exploring</option>
                      <option value="Foundational familiarity">Foundational familiarity</option>
                      <option value="Intermediate / Bridging gaps">Intermediate / Bridging gaps</option>
                    </select>
                  </label>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Available Time</span>
                    <input type="text" value={availableTime} onChange={(e) => setAvailableTime(e.target.value)} placeholder="e.g., 5 hrs/week" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                  </label>
                  <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                    <span>Budget (If Applicable)</span>
                    <input type="text" value={budgetRange} onChange={(e) => setBudgetRange(e.target.value)} placeholder="Free / Pilot / Budget" style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                  </label>
                </div>

                <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                  <span>Preferred Format &amp; Additional Context</span>
                  <input type="text" value={additionalInfo} onChange={(e) => setAdditionalInfo(e.target.value)} placeholder="Format preference, deadlines, or helpful context..." style={{ padding: '0.68rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                </label>

                <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.55rem', fontSize: '0.79rem', color: 'var(--tvz-color-ivory-secondary)', cursor: 'pointer' }}>
                  <input type="checkbox" checked={consentGiven} onChange={(e) => setConsentGiven(e.target.checked)} style={{ marginTop: '0.2rem' }} />
                  <span>
                    I consent to TOVENZA collecting and using these learning details solely to assess my learning goal and prepare a structured learning pathway under TOVENZA’s privacy terms.
                  </span>
                </label>

                {errorMsg && (
                  <p role="alert" style={{ margin: 0, fontSize: '0.83rem', color: 'var(--tvz-color-champagne-light)' }}>
                    {errorMsg}
                  </p>
                )}

                <button type="submit" disabled={submitting} className="tvz-mono tvz-focus-ring" style={{ padding: '0.88rem 1.3rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}>
                  {submitting ? 'Submitting Request...' : 'Submit Learning Pathway Request & Generate ID'}
                </button>

                {submittedId && (
                  <div role="status" className="tvz-hairline-t" style={{ paddingTop: '0.85rem' }}>
                    <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne-light)', fontSize: '0.58rem' }}>
                      Submission Confirmed • Unique Reference ID
                    </div>
                    <p style={{ margin: '0.3rem 0 0', fontSize: '0.86rem', color: 'var(--tvz-color-ivory)' }}>
                      Reference Number: <strong style={{ color: 'var(--tvz-color-champagne-light)' }}>{submittedId}</strong>. View your request status and pathway template on the right.
                    </p>
                  </div>
                )}
              </form>

              {/* REFERENCE LOOKUP & STRUCTURED LEARNING PATHWAY VIEW */}
              <div style={{ display: 'grid', gap: '1.25rem' }}>
                <form onSubmit={handleLookup} className="tvz-monolith-card" style={{ padding: '1.5rem', display: 'grid', gap: '0.7rem' }}>
                  <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                    Track Request &amp; Pathway Reference
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                    <input type="text" value={lookupInput} onChange={(e) => setLookupInput(e.target.value)} placeholder="Enter Reference ID (e.g., TVZ-EDU-209412)" aria-label="Lookup Education Reference ID" style={{ flex: '1 1 200px', padding: '0.65rem 0.8rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                    <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.65rem 1rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne)', cursor: 'pointer', fontSize: '0.58rem' }}>
                      Find Request
                    </button>
                  </div>
                  {lookupStatus && (
                    <p role="status" style={{ margin: 0, fontSize: '0.8rem', color: 'var(--tvz-color-champagne-light)' }}>
                      {lookupStatus}
                    </p>
                  )}
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                    {records.slice(0, 4).map((r) => (
                      <button key={r.requestId} type="button" onClick={() => setSelectedId(r.requestId)} className="tvz-mono tvz-focus-ring" style={{ padding: '0.35rem 0.6rem', fontSize: '0.54rem', cursor: 'pointer', border: '1px solid var(--tvz-border-hairline)', backgroundColor: activeRecord && activeRecord.requestId === r.requestId ? 'rgba(185,157,107,0.14)' : 'transparent', color: 'var(--tvz-color-ivory-secondary)' }}>
                        {r.requestId} • {r.status}
                      </button>
                    ))}
                  </div>
                </form>

                {activeRecord && (
                  <div className="tvz-monolith-card" style={{ padding: '1.85rem', display: 'grid', gap: '1rem' }}>
                    <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '0.5rem' }}>
                      <div>
                        <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                          {activeRecord.requestId} • {activeRecord.learningArea}
                        </span>
                        <h3 className="tvz-display" style={{ fontSize: '1.45rem', margin: '0.25rem 0 0' }}>
                          {activeRecord.learningGoal}
                        </h3>
                      </div>
                      <span className="tvz-mono" style={{ padding: '0.3rem 0.65rem', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne-light)', fontSize: '0.55rem' }}>
                        {activeRecord.status}
                      </span>
                    </div>

                    <div style={{ fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)', display: 'grid', gap: '0.25rem' }}>
                      <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Starting Level:</strong> {activeRecord.currentLevel} • <strong style={{ color: 'var(--tvz-color-ivory)' }}>Time:</strong> {activeRecord.availableTime}</div>
                      <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>Eligibility:</strong> {activeRecord.ageEligibility}</div>
                    </div>

                    {activeRecord.learningPathway ? (
                      <div className="tvz-hairline-t" style={{ paddingTop: '1rem', display: 'grid', gap: '0.55rem', fontSize: '0.83rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                          Structured Learning Pathway Blueprint (10 Elements)
                        </div>
                        <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>1. Learning Goal:</strong> {activeRecord.learningPathway.objective}</div>
                        <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>2–3. Capability &amp; Starting Level:</strong> {activeRecord.learningPathway.expectedCapability} ({activeRecord.learningPathway.startingLevel})</div>
                        {activeRecord.learningPathway.modules && activeRecord.learningPathway.modules.length > 0 && (
                          <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>4. Learning Sequence:</strong> {activeRecord.learningPathway.modules.join(' → ')}</div>
                        )}
                        {activeRecord.learningPathway.resources && activeRecord.learningPathway.resources.length > 0 && (
                          <div>
                            <strong style={{ color: 'var(--tvz-color-ivory)' }}>5. Curated Resources:</strong>{' '}
                            {activeRecord.learningPathway.resources.map((res, idx) => (
                              <span key={res.link + idx}>
                                {idx > 0 ? '; ' : ''}
                                <a href={res.link} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--tvz-color-champagne)' }}>
                                  {res.title} ({res.accessType}) ↗
                                </a>
                              </span>
                            ))}
                          </div>
                        )}
                        {activeRecord.learningPathway.practicalExercises && activeRecord.learningPathway.practicalExercises.length > 0 && (
                          <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>6. Practical Exercises:</strong> {activeRecord.learningPathway.practicalExercises.join(' • ')}</div>
                        )}
                        <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>7. Real-World Assignment:</strong> {activeRecord.learningPathway.realWorldApplication}</div>
                        {activeRecord.learningPathway.milestones && activeRecord.learningPathway.milestones.length > 0 && (
                          <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>8. Progress Milestones:</strong> {activeRecord.learningPathway.milestones.join(' | ')}</div>
                        )}
                        <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>9. Assessment &amp; Completion:</strong> {activeRecord.learningPathway.assessmentMethod} — {activeRecord.learningPathway.completionCriteria}</div>
                        <div><strong style={{ color: 'var(--tvz-color-ivory)' }}>10. Next Recommended Step:</strong> {activeRecord.learningPathway.nextStep}</div>
                      </div>
                    ) : (
                      <p style={{ fontSize: '0.84rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>
                        Pathway not yet attached to this request. Once prepared in the internal console, all 10 pathway elements appear here.
                      </p>
                    )}

                    <form onSubmit={handleSubmitLearnerFeedback} className="tvz-hairline-t" style={{ paddingTop: '0.9rem', display: 'grid', gap: '0.55rem' }}>
                      <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>
                        Learner Feedback &amp; Progress Note
                      </div>
                      <input type="text" value={learnerFeedbackInput} onChange={(e) => setLearnerFeedbackInput(e.target.value)} placeholder="Share feedback, practice progress, or questions..." aria-label="Learner feedback note" style={{ padding: '0.62rem 0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.82rem' }} />
                      <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.58rem 0.9rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-champagne)', color: 'var(--tvz-color-champagne)', cursor: 'pointer', fontSize: '0.56rem', alignSelf: 'flex-start' }}>
                        Save Feedback Note
                      </button>
                      {activeRecord.feedbackNotes && (
                        <div style={{ fontSize: '0.8rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                          <strong>Recorded Feedback:</strong> {activeRecord.feedbackNotes}
                        </div>
                      )}
                    </form>
                  </div>
                )}
              </div>
            </div>
          </div>
        </section>
      ) : (
        /* INTERNAL EDUCATION OPERATING SYSTEM CONSOLE */
        <section className="tvz-hairline-t" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <div className="tvz-container">
            {!adminUnlocked ? (
              <form onSubmit={handleAdminUnlock} className="tvz-monolith-card" style={{ padding: '2.25rem', maxWidth: '34rem', display: 'grid', gap: '1rem' }}>
                <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                  Internal Education Operating Console (Pilot Access Gate)
                </span>
                <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: 0 }}>
                  Unlock Education Operations
                </h2>
                <p style={{ fontSize: '0.84rem', color: 'var(--tvz-color-ivory-secondary)', margin: 0 }}>
                  Enter internal pilot passcode (<code style={{ color: 'var(--tvz-color-champagne-light)' }}>{EDUCATION_CONSOLE_PASSCODE}</code>) to review requests, update status across the 10 workflow stages, and attach structured learning pathways. Move authentication and storage to a server backend before multi-user production.
                </p>
                <input type="password" value={passcodeInput} onChange={(e) => setPasscodeInput(e.target.value)} placeholder="Enter internal pilot passcode" aria-label="Education admin passcode" style={{ padding: '0.72rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                {passcodeError && (
                  <p role="alert" style={{ margin: 0, fontSize: '0.82rem', color: 'var(--tvz-color-champagne-light)' }}>
                    {passcodeError}
                  </p>
                )}
                <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.8rem 1.2rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontWeight: 500 }}>
                  Open Education Console
                </button>
              </form>
            ) : (
              <div style={{ display: 'grid', gap: '1.5rem' }}>
                <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem' }}>
                  <div>
                    <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                      Internal Workflow &amp; Pathway Delivery
                    </span>
                    <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', margin: '0.25rem 0 0' }}>
                      Learner Requests ({filteredRecords.length})
                    </h2>
                  </div>
                  <button type="button" onClick={() => setAdminUnlocked(false)} className="tvz-mono tvz-focus-ring" style={{ padding: '0.55rem 0.9rem', backgroundColor: 'transparent', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory-muted)', cursor: 'pointer', fontSize: '0.56rem' }}>
                    Lock Console
                  </button>
                </div>

                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                  {['ALL', ...EDUCATION_REQUEST_STATUSES].map((st) => (
                    <button key={st} type="button" onClick={() => setStatusFilter(st)} className="tvz-mono tvz-focus-ring" style={{ padding: '0.42rem 0.65rem', fontSize: '0.53rem', cursor: 'pointer', border: '1px solid var(--tvz-border-champagne)', backgroundColor: statusFilter === st ? 'var(--tvz-color-champagne)' : 'transparent', color: statusFilter === st ? 'var(--tvz-color-obsidian)' : 'var(--tvz-color-ivory-secondary)' }}>
                      {st}
                    </button>
                  ))}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem', alignItems: 'start' }}>
                  <div style={{ display: 'grid', gap: '0.75rem' }}>
                    {filteredRecords.map((rec) => (
                      <button key={rec.requestId} type="button" onClick={() => setSelectedId(rec.requestId)} className="tvz-monolith-card tvz-focus-ring" style={{ padding: '1.2rem', textAlign: 'left', cursor: 'pointer', borderColor: activeRecord && activeRecord.requestId === rec.requestId ? 'var(--tvz-color-champagne)' : undefined }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', gap: '0.5rem' }}>
                          <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>{rec.requestId}</span>
                          <span className="tvz-mono" style={{ color: 'var(--tvz-color-champagne-light)', fontSize: '0.53rem' }}>{rec.status}</span>
                        </div>
                        <div style={{ color: 'var(--tvz-color-ivory)', fontSize: '0.9rem', margin: '0.3rem 0' }}>{rec.learningGoal}</div>
                        <div style={{ fontSize: '0.78rem', color: 'var(--tvz-color-ivory-muted)' }}>{rec.learningArea} • {rec.ageEligibility}</div>
                      </button>
                    ))}
                  </div>

                  {activeRecord && (
                    <div className="tvz-monolith-card" style={{ padding: '1.8rem', display: 'grid', gap: '0.9rem' }}>
                      <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>
                        Managing {activeRecord.requestId} • {activeRecord.customerName} ({activeRecord.email})
                      </div>

                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Workflow Status</span>
                        <select value={activeRecord.status} onChange={(e) => handleUpdateRecord(activeRecord.requestId, { status: e.target.value })} style={{ padding: '0.62rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}>
                          {EDUCATION_REQUEST_STATUSES.map((st) => (
                            <option key={st} value={st}>{st}</option>
                          ))}
                        </select>
                      </label>

                      <label style={{ display: 'grid', gap: '0.3rem', fontSize: '0.82rem', color: 'var(--tvz-color-ivory-secondary)' }}>
                        <span>Assessment &amp; Gap Notes</span>
                        <textarea rows={2} value={activeRecord.assessmentNotes || ''} onChange={(e) => handleUpdateRecord(activeRecord.requestId, { assessmentNotes: e.target.value })} placeholder="Current capability gaps, time feasibility, and notes..." style={{ padding: '0.62rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }} />
                      </label>

                      <form onSubmit={handleSavePathway} className="tvz-hairline-t" style={{ paddingTop: '0.9rem', display: 'grid', gap: '0.6rem' }}>
                        <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>
                          Prepare &amp; Deliver Learning Pathway
                        </div>
                        <input type="text" value={pwObjective} onChange={(e) => setPwObjective(e.target.value)} placeholder="Learning Objective" style={{ padding: '0.58rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.8rem' }} />
                        <input type="text" value={pwCapability} onChange={(e) => setPwCapability(e.target.value)} placeholder="Expected Capability Outcome" style={{ padding: '0.58rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.8rem' }} />
                        <input type="text" value={pwModules} onChange={(e) => setPwModules(e.target.value)} placeholder="Modules (comma-separated)" style={{ padding: '0.58rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.8rem' }} />
                        <input type="text" value={pwExercises} onChange={(e) => setPwExercises(e.target.value)} placeholder="Practical Exercises (comma-separated)" style={{ padding: '0.58rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.8rem' }} />
                        <input type="text" value={pwAssignment} onChange={(e) => setPwAssignment(e.target.value)} placeholder="Real-World Assignment" style={{ padding: '0.58rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.8rem' }} />
                        <input type="text" value={pwMilestones} onChange={(e) => setPwMilestones(e.target.value)} placeholder="Milestones (comma-separated)" style={{ padding: '0.58rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)', fontSize: '0.8rem' }} />
                        <button type="submit" className="tvz-mono tvz-focus-ring" style={{ padding: '0.68rem 1rem', backgroundColor: 'var(--tvz-color-champagne)', color: 'var(--tvz-color-obsidian)', border: 'none', cursor: 'pointer', fontSize: '0.56rem', fontWeight: 500 }}>
                          Attach Pathway &amp; Mark Delivered
                        </button>
                      </form>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </section>
      )}

      {/* FAQ, SAFEGUARDING & SERVICE BOUNDARIES */}
      <section className="tvz-hairline-t" style={{ paddingBlock: '3rem' }}>
        <div className="tvz-container" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '1.15rem' }}>
          <div className="tvz-monolith-card" style={{ padding: '1.5rem' }}>
            <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>Non-Accredited &amp; No Job Guarantee</div>
            <p style={{ fontSize: '0.83rem', color: 'var(--tvz-color-ivory-secondary)', margin: '0.5rem 0 0' }}>
              TOVENZA Learning Pathway provides structured learning guidance and practical exercises—not an accredited degree, formal certification, or guaranteed job placement.
            </p>
          </div>
          <div className="tvz-monolith-card" style={{ padding: '1.5rem' }}>
            <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>Age, Guardian &amp; Privacy Notice</div>
            <p style={{ fontSize: '0.83rem', color: 'var(--tvz-color-ivory-secondary)', margin: '0.5rem 0 0' }}>
              Any request involving minors (under 18) requires explicit parent/guardian consent and safeguarding review before processing; records in this pilot use browser storage until server persistence is connected.
            </p>
          </div>
          <div className="tvz-monolith-card" style={{ padding: '1.5rem' }}>
            <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.56rem' }}>Support &amp; Governance</div>
            <p style={{ fontSize: '0.83rem', color: 'var(--tvz-color-ivory-secondary)', margin: '0.5rem 0 0.75rem' }}>
              Review full institutional boundaries and privacy disclosures before sharing details.
            </p>
            <InstitutionalLink to="/legal" onNavigate={onNavigate} className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', textDecoration: 'none', fontSize: '0.56rem' }}>
              Open Legal &amp; Privacy Disclosures →
            </InstitutionalLink>
          </div>
        </div>
      </section>
    </article>
  );
}

    class InstitutionalErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      render() {
        if (this.state.hasError) {
          return (
            <main className="tvz-container" style={{ paddingBlock: '6rem' }}>
              <div className="tvz-monolith-card" style={{ padding: '2.5rem' }}>
                <p className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>
                  Institutional Fallback Interface
                </p>
                <h1 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h2)', marginTop: '0.75rem' }}>
                  A visual module encountered an interruption.
                </h1>
              </div>
            </main>
          );
        }
        return this.props.children;
      }
    }

      const handleClick = (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        onNavigate(to);
      };
      return (
        <a href={safeHref} onClick={handleClick} className={`tvz-focus-ring ${className}`.trim()} style={style} {...rest}>
          {children}
        </a>
      );
    }

    /* ============================================================================
       HORIZON 10: TOVENZA PRODUCT DISCOVERY & BUYING ASSISTANCE WORKFLOW
