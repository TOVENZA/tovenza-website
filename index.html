            </section>

            <section className="tvz-monolith-card" style={{ padding: '2rem' }}>
              <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Governed Strategic Horizons ({anchoredHorizons.length})</div>
              <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', margin: '0.6rem 0 1.25rem' }}>Cross-Horizon Relationship Map</h2>
              <div style={{ display: 'grid', gap: '0.65rem' }}>
                {anchoredHorizons.map((h) => (
                  <InstitutionalLink
                    key={h.slug}
                    to={h.path}
                    onNavigate={onNavigate}
                    style={{
                      padding: '0.75rem 0.9rem',
                      border: '1px solid var(--tvz-border-hairline)',
                      textDecoration: 'none',
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center',
                      gap: '0.75rem'
                    }}
                  >
                    <div>
                      <span className="tvz-mono" style={{ fontSize: '0.58rem', color: 'var(--tvz-color-champagne)' }}>
                        {h.index} • {h.primaryFoundation === foundation.id ? 'Primary Anchor' : 'Secondary Enabler'}
                      </span>
                      <div style={{ color: 'var(--tvz-color-ivory)', fontSize: '0.9rem' }}>{h.title}</div>
                    </div>
                    <LifecycleStatusBadge status={h.lifecycleStatus} />
                  </InstitutionalLink>
                ))}
              </div>
            </section>
          </div>
          <InstitutionalNoticeBanner />
        </div>
      );
    }

    function CapabilityFrameworkTemplate({ onNavigate }) {
      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel={`Route 18 • ${CAPABILITY_SYSTEMS_CHARTER.statusLabel}`}
            title="Six Institutional Capability Systems"
            subtitle={CAPABILITY_SYSTEMS_CHARTER.notice}
          />
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '1rem' }}>
            {CAPABILITY_SYSTEMS_CHARTER.evaluationDimensions.map((dim, i) => (
              <div key={dim} className="tvz-monolith-card" style={{ padding: '1.5rem' }}>
                <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', fontSize: '0.58rem' }}>Criterion 0{i + 1}</div>
                <div style={{ color: 'var(--tvz-color-ivory)', fontSize: '0.92rem', marginTop: '0.45rem' }}>{dim}</div>
              </div>
            ))}
          </div>
          <div style={{ marginTop: '2rem' }}>
            <InstitutionalLink to="/governance" onNavigate={onNavigate} className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)', textDecoration: 'none' }}>
              Inspect Institutional Governance Controls →
            </InstitutionalLink>
          </div>
        </div>
      );
    }

    function GovernanceLedgerTemplate({ onNavigate }) {
      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Route 19 • Institutional Control"
            title="Governance & Stage-Gate Ledger"
            subtitle="Complete route topology, lifecycle status classifications, and separation between long-horizon research and verified operational reality."
          />
          <div className="tvz-monolith-card" style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '0.85rem' }}>
              <thead>
                <tr className="tvz-hairline-b">
                  <th className="tvz-mono" style={{ padding: '1rem', color: 'var(--tvz-color-champagne)' }}>ID</th>
                  <th className="tvz-mono" style={{ padding: '1rem', color: 'var(--tvz-color-champagne)' }}>Canonical Path</th>
                  <th className="tvz-mono" style={{ padding: '1rem', color: 'var(--tvz-color-champagne)' }}>Title</th>
                </tr>
              </thead>
              <tbody>
                {ROUTE_REGISTRY.map((r) => (
                  <tr key={r.path} className="tvz-hairline-b">
                    <td className="tvz-mono" style={{ padding: '0.85rem 1rem', color: 'var(--tvz-color-ivory-muted)' }}>{r.index}</td>
                    <td className="tvz-mono" style={{ padding: '0.85rem 1rem' }}>
                      <InstitutionalLink to={r.path} onNavigate={onNavigate} style={{ color: 'var(--tvz-color-ivory)', textDecoration: 'none' }}>
                        {r.path}
                      </InstitutionalLink>
                    </td>
                    <td style={{ padding: '0.85rem 1rem', color: 'var(--tvz-color-ivory)' }}>{r.title}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function GatewayPortalTemplate() {
      const [email, setEmail] = useState('');
      const [track, setTrack] = useState('Institutional Dispatch');
      const [statusMsg, setStatusMsg] = useState('');

      const recordRegistration = () => {
        if (!email.trim()) {
          setStatusMsg('Enter your email address above before pressing Sign Up.');
          return;
        }
        try {
          window.localStorage.setItem(
            'tovenza_gateway_dispatch_preview',
            JSON.stringify({ email: email.trim(), track, recordedAt: new Date().toISOString() })
          );
        } catch {}
        setStatusMsg(`Recorded locally in preview storage for ${email.trim()} (${track}).`);
        setEmail('');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        recordRegistration();
      };

      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Route 20 • Institutional Gateway"
            title="Dispatches & Level 2 Workspace Preview"
            subtitle="Register an address for institutional architectural notes or preview the upcoming Level 2 Authorized Digital Workspace gateway."
          />
          <form onSubmit={handleSubmit} className="tvz-monolith-card" style={{ padding: '2rem', maxWidth: '38rem', display: 'grid', gap: '1rem' }}>
            <div className="tvz-mono" style={{ color: 'var(--tvz-color-champagne)' }}>Institutional Dispatch Registration</div>
            <select
              value={track}
              onChange={(e) => setTrack(e.target.value)}
              style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
            >
              <option value="Institutional Dispatch">Institutional Dispatch</option>
              <option value="Strategic Horizon Dialogue">Strategic Horizon Dialogue</option>
              <option value="Level 2 Workspace Pilot">Level 2 Workspace Pilot</option>
            </select>
            <input
              type="email"
              required
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="name@institution.org"
              style={{ padding: '0.75rem', backgroundColor: 'var(--tvz-color-obsidian)', border: '1px solid var(--tvz-border-hairline)', color: 'var(--tvz-color-ivory)' }}
            />
            <div className="shader-frame">
              <SignUpButton onPress={recordRegistration} />
            </div>
            <p style={{ fontSize: '0.78rem', color: 'var(--tvz-color-ivory-muted)', margin: 0 }}>
              Preview Disclosure: Entries are stored locally in browser storage during preview mode.
            </p>
            {statusMsg && (
              <p role="status" style={{ fontSize: '0.84rem', color: 'var(--tvz-color-champagne-light)', margin: 0 }}>{statusMsg}</p>
            )}
          </form>
        </div>
      );
    }

    function LegalDocumentTemplate() {
      return (
        <div className="tvz-container" style={{ paddingBlock: 'var(--tvz-section-py)' }}>
          <SectionHeaderBlock
            indexLabel="Route 21 • Legal & Regulatory Disclosures"
            title="Institutional Notices & Boundaries"
            subtitle="Governing principles regarding forward-looking strategic horizons, non-advisory boundaries, and local preview data handling."
          />
          <div style={{ display: 'grid', gap: '1.25rem' }}>
            <article className="tvz-monolith-card" style={{ padding: '2rem' }}>
              <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', marginTop: 0 }}>
                1. Non-Operational &amp; Forward-Looking Horizon Notice
              </h2>
              <p style={{ color: 'var(--tvz-color-ivory-secondary)', marginBottom: 0 }}>
                The Eleven Strategic Horizons presented across TOVENZA represent long-term areas of institutional research, strategic thesis development, and phased capability building. Representation of a horizon does not constitute a claim of current commercial operation or regulated licensing.
              </p>
            </article>
            <article className="tvz-monolith-card" style={{ padding: '2rem' }}>
              <h2 className="tvz-display" style={{ fontSize: 'var(--tvz-text-h3)', marginTop: 0 }}>
                2. Non-Advisory &amp; Privacy Boundary
              </h2>
              <p style={{ color: 'var(--tvz-color-ivory-secondary)', marginBottom: 0 }}>
                Analytical frameworks, career/learning/retail/Jyotish workflows, and architectural notes provided on this platform are structured informational instruments and do not constitute regulated medical, legal, tax, or investment advice.
              </p>
            </article>
          </div>
        </div>
      );
    }

    /* ==========================================================================
       7. UNIFIED 21-ROUTE APPLICATION ROOT
       ========================================================================== */
    function normalizePathname(rawPath) {
      if (!rawPath || rawPath === '') return '/';
      return rawPath.replace(/\/+$/, '') || '/';
    }

    function App() {
      const [atmospherePreset, setAtmospherePreset] = useState('standard');
      const [currentPath, setCurrentPath] = useState(() => {
        if (typeof window === 'undefined') return '/';
        if (window.location.protocol === 'blob:' || window.location.origin === 'null') return '/';
        return normalizePathname(window.location.pathname);
      });

      const navigate = useCallback((to) => {
        const nextPath = normalizePathname(to);
        if (
          typeof window !== 'undefined' &&
          window.location.protocol !== 'blob:' &&
          window.location.origin !== 'null' &&
          window.location.pathname !== nextPath
        ) {
          try {
            window.history.pushState({}, '', nextPath);
          } catch {}
        }
        setCurrentPath(nextPath);
        if (typeof window !== 'undefined') {
          try {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } catch {}
        }
      }, []);

      useEffect(() => {
        if (typeof window === 'undefined' || window.location.protocol === 'blob:') return;
        const handlePopState = () => {
          setCurrentPath(normalizePathname(window.location.pathname));
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const matchedRoute = ROUTE_REGISTRY.find((r) => r.path === currentPath);
      const activePath = matchedRoute ? matchedRoute.path : '/';
      const isMinimalHome = activePath === '/';

      useEffect(() => {
        if (typeof document === 'undefined') return;
        document.title = !matchedRoute || matchedRoute.path === '/'
          ? 'TOVENZA — Global Institutional Group'
          : `${matchedRoute.title} — TOVENZA`;
      }, [matchedRoute]);

      let activeView = null;
      if (!matchedRoute || matchedRoute.path === '/') {
        activeView = <HomeFlagshipTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/institution') {
        activeView = <EditorialEssayTemplate />;
      } else if (matchedRoute.group === 'foundations') {
        activeView = <FoundationDetailTemplate slug={matchedRoute.slug} onNavigate={navigate} />;
      } else if (matchedRoute.path === '/horizons/human-capital') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 01 of 11 • Recruitment & HR / Human Capital"
            statusBadge="In Development"
            conceptLabel="Concept 01 • Talent Constellation & Consent Bridges"
            heading="Career Direction, Offer Clarity & Consent-First Hiring."
            lead="Walk through TOVENZA’s human-capital architecture for adults (18+) and employers—structured career clarity, transparent positioning, and fair role scorecards."
            tracksSectionEyebrow="Horizon 01 Tracks"
            tracksSectionTitle="Individual & Employer Pathways"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'career', label: 'Career & Offers (18+)' },
              { key: 'hiring', label: 'Hiring Calibration' }
            ]}
            tracks={HUMAN_CAPITAL_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Consent-First Briefing • Horizon 01"
            inquiryTitle="Connect on Human Capital Architecture"
            inquiryOptions={[
              'Intentional Career Direction & Offer Clarity',
              'Role Scorecards & Consent-First Hiring'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/healthcare-diagnostics') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 02 of 11 • Healthcare & Diagnostics"
            statusBadge="Research"
            conceptLabel="Concept 02 • Laminar Biometric Waveform"
            heading="Diagnostic & Preventative Governance Research."
            lead="Explores how structured health information, diagnostic clarity, and clinical licensing guardrails fit TOVENZA’s long-term research horizon."
            tracksSectionEyebrow="Horizon 02 Tracks"
            tracksSectionTitle="Research & Governance Pathways"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'pathways', label: 'Pathways & Gates' }
            ]}
            tracks={HEALTHCARE_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Research Note • Horizon 02"
            inquiryTitle="Connect on Healthcare & Diagnostics Research"
            inquiryOptions={[
              'Preventative & Diagnostic Pathway Architecture'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/hospitality') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 03 of 11 • Hospitality"
            statusBadge="Research"
            conceptLabel="Concept 03 • Courtyard Sanctuary & Tranquil Water Ripples"
            heading="Hospitality Architecture & Calm Stewardship."
            lead="Walk through TOVENZA’s hospitality concepts—unhurried guest space, acoustic rest, and reliable service standards—with cursor-guided depth."
            tracksSectionEyebrow="Horizon 03 Tracks"
            tracksSectionTitle="Guest Sanctuary & Service Pathways"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'space', label: 'Guest Sanctuary' },
              { key: 'service', label: 'Service Craft' }
            ]}
            tracks={HOSPITALITY_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Research Note • Horizon 03"
            inquiryTitle="Connect on Hospitality Architecture"
            inquiryOptions={[
              'Calm Arrival, Proportion & Restorative Space',
              'Consistent Service Standards & Everyday Reliability'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/real-estate-property') {
        activeView = <RealEstatePropertyTemplate />;
      } else if (matchedRoute.path === '/horizons/technology-ai-software') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 05 of 11 • Technology, AI & Software"
            statusBadge="In Development"
            conceptLabel="Concept 05 • Spacetime Gravity-Well & Deterministic Circuit Lattice"
            heading="Technology, AI & Software Architecture."
            lead="Walk through TOVENZA’s software and human-in-the-loop AI principles—structured intake, validation, clear states, and human accountability."
            tracksSectionEyebrow="Horizon 05 Tracks"
            tracksSectionTitle="Decision Systems & Human + AI"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'systems', label: 'Decision Systems' }
            ]}
            tracks={TECHNOLOGY_AI_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Research & Build Note • Horizon 05"
            inquiryTitle="Connect on Technology, AI & Software"
            inquiryOptions={[
              'Structured Decision & Intake Systems'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/business-consulting') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 06 of 11 • Business Consulting"
            statusBadge="In Development"
            conceptLabel="Concept 06 • Strategic Vector Field & Precision Compass"
            heading="Operator Clinics, Runway Clarity & Execution."
            lead="Walk through TOVENZA’s structured operator clinics—cash-runway diagnostics, pricing discipline, and bottleneck resolution."
            tracksSectionEyebrow="Horizon 06 Tracks"
            tracksSectionTitle="Operator & Execution Pathways"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'clinics', label: 'Operator Clinics' }
            ]}
            tracks={BUSINESS_CONSULTING_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Operator Briefing • Horizon 06"
            inquiryTitle="Connect on Business Consulting"
            inquiryOptions={[
              'Cash-Runway, Pricing & Execution Diagnostics'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/psychology-wellbeing') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 07 of 11 • Psychology & Wellbeing"
            statusBadge="Strategic Thesis"
            conceptLabel="Concept 07 • Acoustic Stillness & Cognitive Breath Contours"
            heading="Behavioral Clarity, Resilience & Non-Clinical Boundaries."
            lead="Walk through TOVENZA’s non-clinical reflection and sustainable-pacing framework—designed with strict privacy and clear clinical referral boundaries."
            tracksSectionEyebrow="Horizon 07 Tracks"
            tracksSectionTitle="Clarity & Sustainable Pacing"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'clarity', label: 'Clarity & Resilience' }
            ]}
            tracks={PSYCHOLOGY_WELLBEING_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Strategic Thesis Note • Horizon 07"
            inquiryTitle="Connect on Psychology & Wellbeing"
            inquiryOptions={[
              'Decision Calm, Burnout Prevention & Boundaries'
            ]}
          />
        );
      } else if (matchedRoute.path === '/horizons/astrology-jyotish') {
        activeView = <JyotishHorizonTemplate />;
      } else if (matchedRoute.path === '/horizons/education-learning') {
        activeView = <EducationHorizonTemplate />;
      } else if (matchedRoute.path === '/horizons/retail') {
        activeView = <RetailHorizonTemplate />;
      } else if (matchedRoute.path === '/horizons/future-industries') {
        activeView = (
          <HorizonWalkthroughSuite
            badgeLabel="Horizon 11 of 11 • Future Industries"
            statusBadge="Research"
            conceptLabel="Concept 11 • Deep-Time Frontier Radar & Gravitational Singularity"
            heading="Frontier Research & Long-Horizon Industrial Radar."
            lead="Walk through TOVENZA’s frontier research approach—filtering signal from hype, mapping regulatory & capital prerequisites, and keeping long-horizon bets disciplined."
            tracksSectionEyebrow="Horizon 11 Tracks"
            tracksSectionTitle="Frontier Research Observatory"
            filterOptions={[
              { key: 'all', label: 'All Tracks' },
              { key: 'observatory', label: 'Industrial Radar' }
            ]}
            tracks={FUTURE_INDUSTRIES_TRACKS}
            photos={WALKTHROUGH_PHOTOS}
            inquiryEyebrow="Research Note • Horizon 11"
            inquiryTitle="Connect on Future Industries Research"
            inquiryOptions={[
              'Long-Horizon Industrial Shift Radar'
            ]}
          />
        );
      } else if (matchedRoute.path === '/capabilities') {
        activeView = <CapabilityFrameworkTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/governance') {
        activeView = <GovernanceLedgerTemplate onNavigate={navigate} />;
      } else if (matchedRoute.path === '/gateway') {
        activeView = <GatewayPortalTemplate />;
      } else if (matchedRoute.path === '/legal') {
        activeView = <LegalDocumentTemplate />;
      }

      return (
        <InstitutionalErrorBoundary>
          <style>{OBSIDIAN_SOVEREIGNTY_CSS}</style>
          {!isMinimalHome && (
            <SovereignAtmosphereCanvas currentPath={activePath} preset={atmospherePreset} />
          )}
          <div
            style={{
              position: 'relative',
              zIndex: 1,
              minHeight: '100vh',
              display: 'flex',
              flexDirection: 'column',
              backgroundColor: 'transparent',
              color: 'var(--tvz-color-ivory)'
            }}
          >
            {!isMinimalHome && (
              <InstitutionalHeader currentPath={activePath} onNavigate={navigate} />
            )}
            <main style={{ flex: 1 }}>{activeView}</main>
            {!isMinimalHome && (
              <InstitutionalFooter
                onNavigate={navigate}
                currentPath={activePath}
                preset={atmospherePreset}
                onChangePreset={setAtmospherePreset}
              />
            )}
          </div>
        </InstitutionalErrorBoundary>
      );
    }

    const rootEl = document.getElementById('root');
    if (rootEl) {
      ReactDOM.createRoot(rootEl).render(<App />);
    }
  </script>
</body>
</html>
